<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080914;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

#menu {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 28px;
  color: white;
  background: rgba(8, 9, 20, .93);
}

h1 {
  margin: 0 0 25px;
  color: #ffc65a;
  font-size: 40px;
  line-height: 1.15;
  text-shadow: 0 0 20px #f05224;
}

p {
  max-width: 360px;
  font-size: 19px;
  line-height: 1.45;
  color: #e1dbe5;
}

button {
  width: min(360px, 86vw);
  margin: 22px 0 12px;
  padding: 18px;
  border: 2px solid #ffc65a;
  border-radius: 14px;
  background: #592540;
  color: white;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>
<canvas id="game" width="420" height="760"></canvas>

<div id="menu">
  <h1>FLIGHT OF THE<br>PHOENIXES</h1>
  <p>Hold the screen to rise. Release to glide.<br>Avoid the obstacles and fly as far as you can.</p>
  <button onclick="startGame()">Endless Flight</button>
  <p id="bestText">Best: 0 m</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const bestText = document.getElementById("bestText");

let playing = false;
let holding = false;
let bird;
let obstacles;
let distance;
let seconds;
let lastTime;

let best = Number(localStorage.getItem("phoenixBest")) || 0;
bestText.textContent = "Best: " + best.toLocaleString() + " m";

function startGame() {
  playing = true;
  holding = false;

  bird = {
    x: 95,
    y: 380,
    velocity: 0,
    radius: 19
  };

  obstacles = [];
  distance = 0;
  seconds = 0;
  lastTime = performance.now();

  menu.style.display = "none";
  requestAnimationFrame(gameLoop);
}

canvas.addEventListener("touchstart", function(event) {
  event.preventDefault();
  if (playing) holding = true;
}, { passive: false });

canvas.addEventListener("touchend", function(event) {
  event.preventDefault();
  holding = false;
}, { passive: false });

canvas.addEventListener("touchcancel", function() {
  holding = false;
});

canvas.addEventListener("mousedown", function() {
  if (playing) holding = true;
});

window.addEventListener("mouseup", function() {
  holding = false;
});

function addObstacle() {
  const gap = 220;
  const middle = 160 + Math.random() * 440;

  obstacles.push({
    x: 440,
    width: 55,
    top: middle - gap / 2,
    bottom: middle + gap / 2
  });
}

function gameOver() {
  if (!playing) return;

  playing = false;
  best = Math.max(best, Math.floor(distance));
  localStorage.setItem("phoenixBest", best);

  bestText.innerHTML =
    "Flight ended at <b>" + Math.floor(distance).toLocaleString() +
    " m</b><br>Best: " + best.toLocaleString() + " m";

  menu.style.display = "flex";
}

function gameLoop(now) {
  if (!playing) return;

  const dt = Math.min(0.03, (now - lastTime) / 1000);
  lastTime = now;

  seconds += dt;

  bird.velocity += (holding ? -720 : 920) * dt;
  bird.velocity = Math.max(-360, Math.min(420, bird.velocity));
  bird.y += bird.velocity * dt;

  distance += 52 * dt;

  if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 235) {
    addObstacle();
  }

  for (const obstacle of obstacles) {
    obstacle.x -= 155 * dt;

    const hitSide =
      bird.x + bird.radius > obstacle.x &&
      bird.x - bird.radius < obstacle.x + obstacle.width;

    const hitObstacle =
      bird.y - bird.radius < obstacle.top ||
      bird.y + bird.radius > obstacle.bottom;

    if (hitSide && hitObstacle) {
      gameOver();
    }
  }

  obstacles = obstacles.filter(obstacle => obstacle.x > -70);

  if (bird.y - bird.radius < 0 || bird.y + bird.radius > 760) {
    gameOver();
  }

  drawGame();
  requestAnimationFrame(gameLoop);
}

function drawGame() {
  const sky = ctx.createLinearGradient(0, 0, 0, 760);
  sky.addColorStop(0, "#2b102d");
  sky.addColorStop(1, "#080914");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 420, 760);

  for (const obstacle of obstacles) {
    ctx.fillStyle = "#2c1820";
    ctx.fillRect(obstacle.x, 0, obstacle.width, obstacle.top);
    ctx.fillRect(
      obstacle.x,
      obstacle.bottom,
      obstacle.width,
      760 - obstacle.bottom
    );

    ctx.strokeStyle = "#ff8c36";
    ctx.lineWidth = 3;
    ctx.strokeRect(obstacle.x, 0, obstacle.width, obstacle.top);
    ctx.strokeRect(
      obstacle.x,
      obstacle.bottom,
      obstacle.width,
      760 - obstacle.bottom
    );
  }

 ctx.save();
ctx.translate(bird.x, bird.y);
ctx.rotate(bird.velocity / 650);
ctx.shadowBlur = 20;
ctx.shadowColor = "#ff542f";

/* Fiery tail feathers */
ctx.fillStyle = "#c83820";
ctx.beginPath();
ctx.moveTo(-13, 1);
ctx.quadraticCurveTo(-42, -15, -55, -28);
ctx.quadraticCurveTo(-45, 3, -58, 20);
ctx.quadraticCurveTo(-33, 13, -13, 8);
ctx.fill();

ctx.fillStyle = "#ff9b32";
ctx.beginPath();
ctx.moveTo(-12, 5);
ctx.quadraticCurveTo(-39, 12, -51, 34);
ctx.quadraticCurveTo(-27, 24, -5, 11);
ctx.fill();

/* Ember Phoenix body */
ctx.fillStyle = "#e84b24";
ctx.beginPath();
ctx.ellipse(1, 1, 24, 15, 0, 0, Math.PI * 2);
ctx.fill();

/* Gold chest */
ctx.fillStyle = "#ffb842";
ctx.beginPath();
ctx.ellipse(10, 4, 13, 9, 0.2, 0, Math.PI * 2);
ctx.fill();

/* Phoenix head */
ctx.fillStyle = "#ff7d2f";
ctx.beginPath();
ctx.arc(23, -9, 12, 0, Math.PI * 2);
ctx.fill();

/* Gold beak */
ctx.fillStyle = "#ffd15b";
ctx.beginPath();
ctx.moveTo(33, -10);
ctx.lineTo(46, -6);
ctx.lineTo(33, -2);
ctx.closePath();
ctx.fill();

/* Glowing eye */
ctx.fillStyle = "#fff5a0";
ctx.beginPath();
ctx.arc(27, -12, 3.5, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = "#3c1017";
ctx.beginPath();
ctx.arc(28, -12, 1.3, 0, Math.PI * 2);
ctx.fill();

ctx.restore();


  ctx.fillStyle = "white";
  ctx.font = "bold 20px Arial";
  ctx.fillText(Math.floor(distance).toLocaleString() + " m", 16, 32);

  ctx.font = "16px Arial";
  ctx.fillText(seconds.toFixed(1) + " s", 16, 56);

  ctx.textAlign = "right";
  ctx.fillText("ASHLANDS", 402, 32);
  ctx.textAlign = "left";
}
</script>
</body>
</html>
