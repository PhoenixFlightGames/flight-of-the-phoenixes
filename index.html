<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080914;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

#menu {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 28px;
  color: white;
  background: rgba(8, 9, 20, .93);
}

h1 {
  margin: 0 0 25px;
  color: #ffc65a;
  font-size: 40px;
  line-height: 1.15;
  text-shadow: 0 0 20px #f05224;
}

p {
  max-width: 360px;
  font-size: 19px;
  line-height: 1.45;
  color: #e1dbe5;
}

button {
  width: min(360px, 86vw);
  margin: 22px 0 12px;
  padding: 18px;
  border: 2px solid #ffc65a;
  border-radius: 14px;
  background: #592540;
  color: white;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>
<canvas id="game" width="420" height="760"></canvas>

<div id="menu">
  <h1>FLIGHT OF THE<br>PHOENIXES</h1>
  <p>Hold the screen to rise. Release to glide.<br>Avoid the obstacles and fly as far as you can.</p>
  <button onclick="startGame()">Endless Flight</button>
  <p id="bestText">Best: 0 m</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const bestText = document.getElementById("bestText");

const W = 420;
const H = 760;

const phoenixImage = new Image();
let phoenixSprite = null;

phoenixImage.onload = function() {
  const spriteCanvas = document.createElement("canvas");
  spriteCanvas.width = phoenixImage.naturalWidth;
  spriteCanvas.height = phoenixImage.naturalHeight;

  const spriteCtx = spriteCanvas.getContext("2d");
  spriteCtx.drawImage(phoenixImage, 0, 0);

  const pixels = spriteCtx.getImageData(
    0,
    0,
    spriteCanvas.width,
    spriteCanvas.height
  );

  for (let i = 0; i < pixels.data.length; i += 4) {
    const red = pixels.data[i];
    const green = pixels.data[i + 1];
    const blue = pixels.data[i + 2];

    const nearWhite =
      red > 215 &&
      green > 215 &&
      blue > 215 &&
      Math.max(red, green, blue) - Math.min(red, green, blue) < 28;

    if (nearWhite) {
      pixels.data[i + 3] = 0;
    }
  }

  spriteCtx.putImageData(pixels, 0, 0);
  phoenixSprite = spriteCanvas;
};

phoenixImage.src = "IMG_3821.jpeg";

let playing = false;
let holding = false;
let bird;
let obstacles;
let embers;
let distance;
let seconds;
let lastTime;
let level;
let runShards;

let best = Number(localStorage.getItem("phoenixBest")) || 0;
let totalShards = Number(localStorage.getItem("phoenixShards")) || 0;

bestText.textContent = "Best: " + best.toLocaleString() + " m";

function makeEmbers() {
  const particles = [];

  for (let i = 0; i < 42; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 1 + Math.random() * 2.5,
      speed: 14 + Math.random() * 32,
      drift: Math.random() * Math.PI * 2,
      glow: Math.random() > 0.45
    });
  }

  return particles;
}

function startGame() {
  playing = true;
  holding = false;

  bird = {
    x: 95,
    y: 380,
    velocity: 0,
    radius: 25
  };

  obstacles = [];
  embers = makeEmbers();
  distance = 0;
  seconds = 0;
  level = 0;
  runShards = 0;
  lastTime = performance.now();

  menu.style.display = "none";
  requestAnimationFrame(gameLoop);
}

canvas.addEventListener("touchstart", function(event) {
  event.preventDefault();

  if (playing) {
    holding = true;
  }
}, { passive: false });

canvas.addEventListener("touchend", function(event) {
  event.preventDefault();
  holding = false;
}, { passive: false });

canvas.addEventListener("touchcancel", function() {
  holding = false;
});

canvas.addEventListener("mousedown", function() {
  if (playing) {
    holding = true;
  }
});

window.addEventListener("mouseup", function() {
  holding = false;
});

function addObstacle() {
  const gap = 220 - level * 8;
  const minimumMiddle = gap / 2 + 42;
  const maximumMiddle = H - gap / 2 - 42;
  const middle =
    minimumMiddle +
    Math.random() * (maximumMiddle - minimumMiddle);

  obstacles.push({
    x: 440,
    width: 55,
    top: middle - gap / 2,
    bottom: middle + gap / 2,
    shard: Math.random() < 0.65,
    shardY: middle,
    shardCollected: false
  });
}

function updateEmbers(dt) {
  for (const ember of embers) {
    ember.x -= ember.speed * dt;
    ember.y += Math.sin(seconds * 2 + ember.drift) * 12 * dt;

    if (ember.x < -8) {
      ember.x = W + 8;
      ember.y = Math.random() * H;
      ember.size = 1 + Math.random() * 2.5;
      ember.speed = 14 + Math.random() * 32;
    }
  }
}

function collectShards() {
  for (const obstacle of obstacles) {
    if (!obstacle.shard || obstacle.shardCollected) {
      continue;
    }

    const shardX = obstacle.x + obstacle.width / 2;
    const dx = bird.x - shardX;
    const dy = bird.y - obstacle.shardY;
    const hitDistance = bird.radius + 14;

    if (dx * dx + dy * dy < hitDistance * hitDistance) {
      obstacle.shardCollected = true;
      runShards += 1;
    }
  }
}

function gameOver() {
  if (!playing) return;

  playing = false;

  best = Math.max(best, Math.floor(distance));
  totalShards += runShards;

  localStorage.setItem("phoenixBest", best);
  localStorage.setItem("phoenixShards", totalShards);

  bestText.innerHTML =
    "Flight ended at <b>" + Math.floor(distance).toLocaleString() +
    " m</b><br>Ember Shards: <b>" + runShards +
    "</b><br>Total Shards: " + totalShards +
    "<br>Best: " + best.toLocaleString() + " m";

  menu.style.display = "flex";
}

function gameLoop(now) {
  if (!playing) return;

  const dt = Math.min(0.03, (now - lastTime) / 1000);
  lastTime = now;

  seconds += dt;
  distance += 52 * dt;

  level = Math.min(3, Math.floor(distance / 500));

  bird.velocity += (holding ? -720 : 920) * dt;
  bird.velocity = Math.max(-360, Math.min(420, bird.velocity));
  bird.y += bird.velocity * dt;

  updateEmbers(dt);

  if (
    obstacles.length === 0 ||
    obstacles[obstacles.length - 1].x < 235
  ) {
    addObstacle();
  }

  const obstacleSpeed = 155 + level * 10;

  for (const obstacle of obstacles) {
    obstacle.x -= obstacleSpeed * dt;

    const hitSide =
      bird.x + bird.radius > obstacle.x &&
      bird.x - bird.radius < obstacle.x + obstacle.width;

    const hitObstacle =
      bird.y - bird.radius < obstacle.top ||
      bird.y + bird.radius > obstacle.bottom;

    if (hitSide && hitObstacle) {
      gameOver();
      return;
    }
  }

  collectShards();

  obstacles = obstacles.filter(obstacle => obstacle.x > -70);

  if (bird.y - bird.radius < 0 || bird.y + bird.radius > H) {
    gameOver();
    return;
  }

  drawGame();
  requestAnimationFrame(gameLoop);
}

function drawMountainLayer(color, baseY, peakHeight, spacing, speed) {
  const offset = (distance * speed) % spacing;

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-spacing - offset, H);

  for (let x = -spacing - offset; x < W + spacing; x += spacing) {
    const peakX = x + spacing / 2;
    ctx.lineTo(x, baseY);
    ctx.lineTo(peakX, baseY - peakHeight);
    ctx.lineTo(x + spacing, baseY);
  }

  ctx.lineTo(W + spacing, H);
  ctx.closePath();
  ctx.fill();
}

function drawAshlands() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#35122f");
  sky.addColorStop(0.48, "#1a1022");
  sky.addColorStop(1, "#080914");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(210, 590, 10, 210, 590, 290);
  glow.addColorStop(0, "rgba(200, 54, 25, .26)");
  glow.addColorStop(1, "rgba(200, 54, 25, 0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 300, W, 460);

  drawMountainLayer("#1d1422", 575, 92, 180, 0.08);
  drawMountainLayer("#281522", 640, 125, 145, 0.16);
  drawMountainLayer("#351821", 705, 110, 112, 0.26);

  ctx.fillStyle = "rgba(255, 116, 45, .18)";
  ctx.fillRect(0, 716, W, 44);
}

function drawEmbers() {
  for (const ember of embers) {
    const pulse = 0.6 + Math.sin(seconds * 5 + ember.drift) * 0.4;

    ctx.save();

    if (ember.glow) {
      ctx.shadowBlur = 8;
      ctx.shadowColor = "#ff5b2c";
    }

    ctx.globalAlpha = 0.35 + pulse * 0.55;
    ctx.fillStyle = ember.glow ? "#ffb04d" : "#ed542d";

    ctx.beginPath();
    ctx.arc(ember.x, ember.y, ember.size * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawVolcanicTower(x, width, startY, endY, isTop) {
  const capY = isTop ? endY : startY;
  const bodyStart = isTop ? 0 : startY;
  const bodyEnd = isTop ? endY : H;

  ctx.fillStyle = "#281820";
  ctx.fillRect(x, bodyStart, width, bodyEnd - bodyStart);

  ctx.fillStyle = "#3b2023";
  ctx.beginPath();

  if (isTop) {
    ctx.moveTo(x, capY);
    ctx.lineTo(x + width * 0.25, capY - 14);
    ctx.lineTo(x + width * 0.55, capY - 6);
    ctx.lineTo(x + width * 0.8, capY - 16);
    ctx.lineTo(x + width, capY);
  } else {
    ctx.moveTo(x, capY);
    ctx.lineTo(x + width * 0.22, capY + 16);
    ctx.lineTo(x + width * 0.58, capY + 7);
    ctx.lineTo(x + width * 0.82, capY + 16);
    ctx.lineTo(x + width, capY);
  }

  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#d75a2e";
  ctx.lineWidth = 3;
  ctx.strokeRect(x, bodyStart, width, bodyEnd - bodyStart);

  ctx.strokeStyle = "#ff9c45";
  ctx.lineWidth = 2;
  ctx.beginPath();

  if (isTop) {
    ctx.moveTo(x, capY);
    ctx.lineTo(x + width * 0.25, capY - 14);
    ctx.lineTo(x + width * 0.55, capY - 6);
    ctx.lineTo(x + width * 0.8, capY - 16);
    ctx.lineTo(x + width, capY);
  } else {
    ctx.moveTo(x, capY);
    ctx.lineTo(x + width * 0.22, capY + 16);
    ctx.lineTo(x + width * 0.58, capY + 7);
    ctx.lineTo(x + width * 0.82, capY + 16);
    ctx.lineTo(x + width, capY);
  }

  ctx.stroke();

  ctx.strokeStyle = "rgba(255, 119, 48, .65)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + width * 0.27, bodyStart + 20);
  ctx.lineTo(x + width * 0.42, bodyEnd - 32);
  ctx.moveTo(x + width * 0.72, bodyStart + 55);
  ctx.lineTo(x + width * 0.58, bodyEnd - 18);
  ctx.stroke();
}

function drawShard(x, y) {
  const glow = 0.85 + Math.sin(seconds * 7 + x * 0.02) * 0.15;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(seconds * 1.8);

  ctx.shadowBlur = 16;
  ctx.shadowColor = "#ff7b2f";
  ctx.fillStyle = "#ffd15c";

  ctx.beginPath();
  ctx.moveTo(0, -11 * glow);
  ctx.lineTo(8 * glow, 0);
  ctx.lineTo(0, 11 * glow);
  ctx.lineTo(-8 * glow, 0);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#fff2a1";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();
}

function drawPhoenix() {
  const tilt = Math.max(-0.38, Math.min(0.58, bird.velocity / 650));
  const flap = (Math.sin(seconds * 18) + 1) / 2;
  const widthScale = 1.02 - flap * 0.06;
  const heightScale = 0.94 + flap * 0.12;
  const flightLift = flap * 3;

  ctx.save();
  ctx.translate(bird.x, bird.y - flightLift);
  ctx.rotate(tilt);
  ctx.scale(widthScale, heightScale);

  ctx.shadowBlur = 18 + flap * 8;
  ctx.shadowColor = "#ff542f";

  if (phoenixSprite) {
    ctx.drawImage(phoenixSprite, -52, -52, 104, 104);
  } else {
    ctx.fillStyle = "#ff842f";
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.quadraticCurveTo(-4, -27, 24, -8);
    ctx.quadraticCurveTo(32, 0, 24, 8);
    ctx.quadraticCurveTo(-4, 27, -25, 0);
    ctx.fill();
  }

  ctx.restore();
}

function drawGame() {
  drawAshlands();
  drawEmbers();

  for (const obstacle of obstacles) {
    drawVolcanicTower(
      obstacle.x,
      obstacle.width,
      0,
      obstacle.top,
      true
    );

    drawVolcanicTower(
      obstacle.x,
      obstacle.width,
      obstacle.bottom,
      H,
      false
    );

    if (obstacle.shard && !obstacle.shardCollected) {
      drawShard(
        obstacle.x + obstacle.width / 2,
        obstacle.shardY
      );
    }
  }

  drawPhoenix();

  ctx.fillStyle = "white";
  ctx.font = "bold 20px Arial";
  ctx.fillText(Math.floor(distance).toLocaleString() + " m", 16, 32);

  ctx.font = "bold 15px Arial";
  ctx.fillStyle = "#ffd15c";
  ctx.fillText("SHARDS: " + runShards, 16, 57);

  ctx.textAlign = "right";
  ctx.fillStyle = "#ffc65a";
  ctx.font = "bold 15px Arial";
  ctx.fillText("ASHLANDS · LEVEL " + (level + 1), 402, 32);
  ctx.textAlign = "left";
}
</script>
</body>
</html>
