<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#080914;
font-family:Arial,sans-serif;
}

canvas{
display:block;
width:100vw;
height:100vh;
touch-action:none;
}

.screen{
position:fixed;
inset:0;
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:28px;
color:#fff;
text-align:center;
background:rgba(8,9,20,.94);
}

.hidden{
display:none!important;
}

h1{
margin:0 0 20px;
color:#ffc65a;
font-size:39px;
line-height:1.12;
text-shadow:0 0 20px #f05224;
}

p{
max-width:365px;
color:#e1dbe5;
font-size:17px;
line-height:1.45;
}

button{
width:min(360px,86vw);
margin:8px 0;
padding:16px;
border:2px solid #ffc65a;
border-radius:14px;
background:#592540;
color:#fff;
font-size:19px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.roost,
.leaderboard-list{
width:min(390px,92vw);
max-height:64vh;
overflow:auto;
}

.shards{
color:#ffd15c;
font-size:22px;
font-weight:bold;
}

.card{
margin:9px 0;
padding:14px;
border:1px solid #744357;
border-radius:12px;
background:#221522;
text-align:left;
}

.card.equipped{
background:#402033;
}

.card button{
width:100%;
margin:10px 0 0;
padding:10px;
font-size:16px;
}

.preview{
display:inline-block;
width:17px;
height:17px;
margin-right:7px;
border-radius:50%;
vertical-align:-3px;
}

.revive-title{
color:#67e7ff;
text-shadow:0 0 20px #36dfff;
}

.revive-button,
.tutorial-button,
.leaderboard-button{
border-color:#67e7ff;
background:#164c68;
}

.end-button,
.tutorial-skip{
border-color:#a87d92;
background:#392333;
}

.ability-button{
position:fixed;
right:18px;
bottom:28px;
z-index:8;
width:112px;
height:112px;
margin:0;
padding:10px;
border:3px solid #c879ff;
border-radius:50%;
background:radial-gradient(circle,#5a267c,#231329);
color:#fff;
font-size:14px;
line-height:1.15;
box-shadow:0 0 24px #9e4bff;
}

.ability-button.solar{
border-color:#ffd15c;
background:radial-gradient(circle,#a95718,#4d2415);
box-shadow:0 0 24px #ffb62f;
}

.tutorial-screen{
z-index:20;
background:rgba(5,8,19,.97);
}

.tutorial-card{
width:min(390px,92vw);
padding:22px 20px;
border:2px solid #67e7ff;
border-radius:18px;
background:linear-gradient(145deg,#152a48,#171329);
box-shadow:0 0 30px rgba(54,223,255,.35);
}

.tutorial-card h1{
margin:0 0 12px;
color:#67e7ff;
font-size:30px;
line-height:1.12;
text-shadow:0 0 18px #36dfff;
}

.tutorial-step{
margin-bottom:15px;
color:#ffd15c;
font-size:14px;
font-weight:bold;
letter-spacing:1px;
}

.tutorial-art{
position:relative;
width:100%;
height:138px;
margin:8px 0 18px;
overflow:hidden;
border:1px solid #42779b;
border-radius:12px;
background:linear-gradient(#15304f,#09111f);
}

.tutorial-bird{
position:absolute;
left:48px;
top:20px;
width:100px;
height:100px;
background-image:var(--phoenix-image);
background-size:contain;
background-position:center;
background-repeat:no-repeat;
filter:drop-shadow(0 0 14px #ff542f);
transform:rotate(-8deg);
}

.tutorial-finger{
position:absolute;
right:46px;
bottom:17px;
padding:10px 13px;
border:2px solid #ffd15c;
border-radius:14px;
background:rgba(55,26,28,.86);
color:#fff;
font-size:14px;
font-weight:bold;
animation:pulse 1s ease-in-out infinite;
}

.tutorial-finger.glide{
border-color:#67e7ff;
background:rgba(15,55,77,.86);
}

.tutorial-shard{
position:absolute;
right:94px;
top:41px;
width:25px;
height:25px;
background:#ffd15c;
box-shadow:0 0 16px #ff7b2f;
transform:rotate(45deg);
}

.tutorial-gate{
position:absolute;
right:66px;
top:28px;
width:58px;
height:86px;
border:5px solid #ffd15c;
border-radius:50%;
box-shadow:0 0 22px #ff9b2f;
}

.tutorial-ability{
position:absolute;
right:30px;
bottom:15px;
width:74px;
height:74px;
padding-top:20px;
border:3px solid #c879ff;
border-radius:50%;
background:#5a267c;
box-shadow:0 0 20px #9e4bff;
color:#fff;
font-size:11px;
font-weight:bold;
text-align:center;
}

.tutorial-tip{
min-height:49px;
margin:0 0 14px;
color:#dcefff;
font-size:16px;
line-height:1.4;
}

.tutorial-next{
border-color:#67e7ff;
background:#164c68;
}

.tutorial-skip{
font-size:16px;
}

.game-tip{
position:fixed;
left:50%;
bottom:142px;
z-index:9;
width:min(340px,84vw);
padding:13px 16px;
border:2px solid #67e7ff;
border-radius:14px;
background:rgba(10,27,46,.94);
box-shadow:0 0 24px rgba(54,223,255,.45);
color:#fff;
font-size:16px;
font-weight:bold;
line-height:1.35;
text-align:center;
transform:translateX(-50%);
pointer-events:none;
}

.game-tip strong{
color:#ffd15c;
}

/* Local leaderboard */

.leaderboard-title{
color:#67e7ff;
text-shadow:0 0 20px #36dfff;
}

.leaderboard-subtitle{
margin:0 0 14px;
color:#b8ddeb;
font-size:15px;
}

.leaderboard-row{
display:grid;
grid-template-columns:38px 1fr auto;
gap:10px;
align-items:center;
margin:8px 0;
padding:12px;
border:1px solid #3f657d;
border-radius:12px;
background:#122032;
text-align:left;
}

.leaderboard-row.first{
border-color:#ffd15c;
background:linear-gradient(135deg,#3d2d18,#201925);
box-shadow:0 0 16px rgba(255,209,92,.22);
}

.leaderboard-rank{
color:#ffd15c;
font-size:20px;
font-weight:bold;
text-align:center;
}

.leaderboard-distance{
color:#fff;
font-size:18px;
font-weight:bold;
}

.leaderboard-detail{
margin-top:4px;
color:#b9c9d7;
font-size:12px;
line-height:1.35;
}

.leaderboard-phoenix{
font-size:13px;
font-weight:bold;
text-align:right;
}

.leaderboard-empty{
padding:20px 10px;
color:#b8ddeb;
font-size:17px;
line-height:1.45;
}

@keyframes pulse{
0%,100%{
transform:translateY(0);
opacity:.78;
}

50%{
transform:translateY(-8px);
opacity:1;
}
}
</style>
</head>

<body>

<canvas id="game" width="420" height="760"></canvas>

<button id="abilityButton" class="ability-button hidden" onclick="useAbility()">
ABILITY
</button>

<div id="gameTip" class="game-tip hidden"></div>

<div id="menu" class="screen">
<h1>FLIGHT OF THE<br>PHOENIXES</h1>

<p>
Hold to rise. Release to glide.<br>
Avoid volcanic rock and collect Ember Shards.
</p>

<button onclick="startGame()">Endless Flight</button>
<button class="tutorial-button" onclick="openTutorial()">How to Play</button>
<button onclick="openRoost()">Phoenix Roost</button>
<button class="leaderboard-button" onclick="openLeaderboard()">Top Flights</button>

<p id="bestText"></p>
</div>

<div id="roost" class="screen hidden">
<h1>PHOENIX ROOST</h1>
<p class="shards" id="roostShards"></p>
<div class="roost" id="phoenixList"></div>
<button onclick="closeRoost()">Back to Flight</button>
</div>

<div id="leaderboardScreen" class="screen hidden">
<h1 class="leaderboard-title">TOP FLIGHTS</h1>

<p class="leaderboard-subtitle">
Your best 10 completed flights on this device.
</p>

<div class="leaderboard-list" id="leaderboardList"></div>

<button onclick="closeLeaderboard()">Back to Flight</button>
</div>

<div id="reviveScreen" class="screen hidden">
<h1 class="revive-title">PHOENIX FALLEN</h1>
<p id="reviveText"></p>
<button class="revive-button" onclick="reviveFlight()">Revive for 15 Shards</button>
<button class="end-button" onclick="endFlight()">End Flight</button>
</div>

<div id="tutorialScreen" class="screen tutorial-screen hidden">
<div class="tutorial-card">
<div class="tutorial-step" id="tutorialStep"></div>
<h1 id="tutorialTitle"></h1>
<div class="tutorial-art" id="tutorialArt"></div>
<p class="tutorial-tip" id="tutorialText"></p>
<button class="tutorial-next" id="tutorialNext" onclick="nextTutorialStep()">Next</button>
<button class="tutorial-skip" onclick="skipTutorial()">Skip Tutorial</button>
</div>
</div>

<script>
const c=document.getElementById("game");
const x=c.getContext("2d");

const W=420;
const H=760;

const CHECKPOINT_DISTANCE=1000;
const REVIVE_COST=15;
const MAGNET_RANGE=80;
const LEADERBOARD_LIMIT=10;

const menu=document.getElementById("menu");
const roost=document.getElementById("roost");
const leaderboardScreen=document.getElementById("leaderboardScreen");
const leaderboardList=document.getElementById("leaderboardList");

const reviveScreen=document.getElementById("reviveScreen");
const reviveText=document.getElementById("reviveText");
const bestText=document.getElementById("bestText");
const roostShards=document.getElementById("roostShards");
const phoenixList=document.getElementById("phoenixList");
const abilityButton=document.getElementById("abilityButton");

const tutorialScreen=document.getElementById("tutorialScreen");
const tutorialStep=document.getElementById("tutorialStep");
const tutorialTitle=document.getElementById("tutorialTitle");
const tutorialArt=document.getElementById("tutorialArt");
const tutorialText=document.getElementById("tutorialText");
const tutorialNext=document.getElementById("tutorialNext");

const gameTip=document.getElementById("gameTip");

const P={
ember:{
name:"Ember Phoenix",
sub:"Starter Phoenix — orange flame",
color:"#ff8a35",
shadow:"#ff542f",
cost:0,
filter:""
},

azure:{
name:"Azure Phoenix",
sub:"Stormborn feathers and a checkpoint Storm Shield",
color:"#67e7ff",
shadow:"#36dfff",
cost:25,
filter:"hue-rotate(145deg) saturate(1.8) brightness(1.2)"
},

verdant:{
name:"Verdant Phoenix",
sub:"Wildfire plumage and Ember Magnet",
color:"#62f58c",
shadow:"#56f58a",
cost:50,
filter:"hue-rotate(78deg) saturate(1.9) brightness(1.18)"
},

violet:{
name:"Violet Phoenix",
sub:"Arcane flame and player-triggered Arcane Pulse",
color:"#c879ff",
shadow:"#9e4bff",
cost:100,
filter:"hue-rotate(230deg) saturate(2.1) brightness(1.2)"
},

solar:{
name:"Solar Phoenix",
sub:"Sunfire wings and player-triggered Sunfire Grace",
color:"#ffd15c",
shadow:"#ff9b2f",
cost:175,
filter:"hue-rotate(25deg) saturate(2.1) brightness(1.35)"
}
};

let playing=false;
let holding=false;

let bird;
let rocks=[];
let embers=[];
let trails=[];
let gate=null;

let distance=0;
let seconds=0;
let level=0;
let runShards=0;
let lastTime=0;

let checkpoint=0;
let checkpointFlash=0;

let revivedThisRun=false;
let reviveSafety=0;

let stormShield=false;
let arcanePulse=false;
let sunfireGrace=false;
let sunfireActive=false;

let tutorialPage=0;
let tutorialRunning=false;
let tutorialShardSeen=false;
let tutorialGateSeen=false;

let tipTimer=0;

let best=Number(localStorage.getItem("phoenixBest"))||0;
let totalShards=Number(localStorage.getItem("phoenixShards"))||0;

let highestCheckpoint=Number(
localStorage.getItem("phoenixHighestCheckpoint")
)||0;

let azureUnlocked=localStorage.getItem("azureUnlocked")==="true";
let verdantUnlocked=localStorage.getItem("verdantUnlocked")==="true";
let violetUnlocked=localStorage.getItem("violetUnlocked")==="true";
let solarUnlocked=localStorage.getItem("solarUnlocked")==="true";

let equippedPhoenix=localStorage.getItem("equippedPhoenix")||"ember";

let leaderboard=[];

try{
leaderboard=JSON.parse(
localStorage.getItem("phoenixLeaderboard")
)||[];
}catch(error){
leaderboard=[];
}

if(!Array.isArray(leaderboard)){
leaderboard=[];
}

function unlocked(key){
return key==="ember"||
(key==="azure"&&azureUnlocked)||
(key==="verdant"&&verdantUnlocked)||
(key==="violet"&&violetUnlocked)||
(key==="solar"&&solarUnlocked);
}

if(!unlocked(equippedPhoenix)){
equippedPhoenix="ember";
}

const img=new Image();
let sprite=null;

img.onload=function(){
const s=document.createElement("canvas");
const q=s.getContext("2d");

s.width=img.naturalWidth;
s.height=img.naturalHeight;

q.drawImage(img,0,0);

const d=q.getImageData(0,0,s.width,s.height);

for(let i=0;i<d.data.length;i+=4){
const r=d.data[i];
const g=d.data[i+1];
const b=d.data[i+2];

if(
r>215&&
g>215&&
b>215&&
Math.max(r,g,b)-Math.min(r,g,b)<28
){
d.data[i+3]=0;
}
}

q.putImageData(d,0,0);

sprite=s;

document.documentElement.style.setProperty(
"--phoenix-image",
`url("${s.toDataURL("image/png")}")`
);
};

img.src="IMG_3821.jpeg";

function save(){
localStorage.setItem("phoenixBest",best);
localStorage.setItem("phoenixShards",totalShards);

localStorage.setItem(
"phoenixHighestCheckpoint",
highestCheckpoint
);

localStorage.setItem("azureUnlocked",azureUnlocked);
localStorage.setItem("verdantUnlocked",verdantUnlocked);
localStorage.setItem("violetUnlocked",violetUnlocked);
localStorage.setItem("solarUnlocked",solarUnlocked);

localStorage.setItem("equippedPhoenix",equippedPhoenix);

localStorage.setItem(
"phoenixLeaderboard",
JSON.stringify(leaderboard)
);
}

function updateMenuText(){
bestText.innerHTML=`
Best: ${best.toLocaleString()} m<br>
Highest checkpoint: ${
highestCheckpoint
?highestCheckpoint.toLocaleString()+" m"
:"Not reached"
}
`;
}

function showTip(message,time=4){
gameTip.innerHTML=message;
gameTip.classList.remove("hidden");

tipTimer=time;
}

function formatScoreDate(dateString){
const date=new Date(dateString);

return date.toLocaleDateString(
undefined,
{
month:"short",
day:"numeric",
year:"numeric"
}
);
}

function addLeaderboardEntry(){
const finalDistance=Math.floor(distance);

if(finalDistance<=0)return;

const entry={
distance:finalDistance,
checkpoint:checkpoint,
shards:runShards,
phoenix:equippedPhoenix,
date:new Date().toISOString()
};

leaderboard.push(entry);

leaderboard.sort((a,b)=>{
if(b.distance!==a.distance){
return b.distance-a.distance;
}

if(b.checkpoint!==a.checkpoint){
return b.checkpoint-a.checkpoint;
}

return b.shards-a.shards;
});

leaderboard=leaderboard.slice(0,LEADERBOARD_LIMIT);
}

function openLeaderboard(){
renderLeaderboard();

menu.classList.add("hidden");
leaderboardScreen.classList.remove("hidden");
}

function closeLeaderboard(){
leaderboardScreen.classList.add("hidden");
menu.classList.remove("hidden");
}

function renderLeaderboard(){
if(!leaderboard.length){
leaderboardList.innerHTML=`
<div class="leaderboard-empty">
No completed flights yet.<br><br>
Take flight and your best runs will appear here.
</div>
`;

return;
}

leaderboardList.innerHTML=leaderboard.map((entry,index)=>{
const phoenix=P[entry.phoenix]||P.ember;

const checkpointText=
entry.checkpoint>0
?entry.checkpoint.toLocaleString()+" m checkpoint"
:"No checkpoint";

return `
<div class="leaderboard-row ${index===0?"first":""}">
<div class="leaderboard-rank">
${index+1}
</div>

<div>
<div class="leaderboard-distance">
${entry.distance.toLocaleString()} m
</div>

<div class="leaderboard-detail">
${checkpointText} · ${entry.shards} Shard${entry.shards===1?"":"s"}<br>
${formatScoreDate(entry.date)}
</div>
</div>

<div
class="leaderboard-phoenix"
style="color:${phoenix.color}"
>
${phoenix.name.replace(" Phoenix","")}
</div>
</div>
`;
}).join("");
}

function openTutorial(){
tutorialPage=0;

tutorialScreen.classList.remove("hidden");

renderTutorial();
}

function renderTutorial(){
const pages=[
{
title:"FLY YOUR PHOENIX",
text:"Press and hold anywhere on the screen to make your Phoenix rise.",
art:`
<div class="tutorial-bird"></div>
<div class="tutorial-finger">HOLD</div>
`
},
{
title:"GLIDE THROUGH DANGER",
text:"Release your hold to glide downward. Stay inside the opening between volcanic rock.",
art:`
<div class="tutorial-bird"></div>
<div class="tutorial-finger glide">RELEASE</div>
`
},
{
title:"COLLECT EMBER SHARDS",
text:"Fly through glowing Ember Shards. Spend saved Shards in the Phoenix Roost.",
art:`
<div class="tutorial-bird"></div>
<div class="tutorial-shard"></div>
`
},
{
title:"REACH CHECKPOINTS",
text:"Pass through a Phoenix Gate every 1,000 meters. Checkpoints grant a Shard and one revive.",
art:`
<div class="tutorial-bird"></div>
<div class="tutorial-gate"></div>
`
},
{
title:"UNLEASH YOUR POWER",
text:"Some Phoenixes charge a special ability at checkpoints. Tap the round ability button to use it.",
art:`
<div class="tutorial-bird"></div>
<div class="tutorial-ability">ARCANE<br>PULSE</div>
`
}
];

const page=pages[tutorialPage];

tutorialStep.textContent=
"HOW TO PLAY · "+(tutorialPage+1)+" OF 5";

tutorialTitle.textContent=page.title;
tutorialText.textContent=page.text;
tutorialArt.innerHTML=page.art;

tutorialNext.textContent=
tutorialPage===4
?"Start Practice Flight"
:"Next";
}

function nextTutorialStep(){
tutorialPage++;

if(tutorialPage>=5){
localStorage.setItem(
"phoenixTutorialComplete",
"true"
);

tutorialRunning=true;
tutorialShardSeen=false;
tutorialGateSeen=false;

tutorialScreen.classList.add("hidden");

startGame(true);

return;
}

renderTutorial();
}

function skipTutorial(){
localStorage.setItem(
"phoenixTutorialComplete",
"true"
);

tutorialScreen.classList.add("hidden");
}

function dot(color){
return `
<span
class="preview"
style="background:${color};box-shadow:0 0 12px ${color}"
></span>
`;
}

function openRoost(){
renderRoost();

menu.classList.add("hidden");
roost.classList.remove("hidden");
}

function closeRoost(){
roost.classList.add("hidden");
menu.classList.remove("hidden");
}

function renderRoost(){
roostShards.textContent=
"Ember Shards: "+totalShards;

phoenixList.innerHTML=Object.keys(P).map(key=>{
const phoenix=P[key];
const active=equippedPhoenix===key;

if(!unlocked(key)){
return `
<div class="card">
<strong style="color:${phoenix.color}">
${dot(phoenix.color)}${phoenix.name}
</strong><br>

${phoenix.sub}

<button onclick="unlockPhoenix('${key}')">
Unlock for ${phoenix.cost} Shards
</button>
</div>
`;
}

return `
<div class="card ${active?"equipped":""}">
<strong style="color:${phoenix.color}">
${dot(phoenix.color)}${phoenix.name}
</strong><br>

${phoenix.sub}<br>
${active?"Equipped":"Unlocked"}

${active?"":`
<button onclick="equipPhoenix('${key}')">
Equip ${phoenix.name}
</button>
`}
</div>
`;
}).join("");
}

function unlockPhoenix(key){
const phoenix=P[key];

if(totalShards<phoenix.cost){
alert("You need "+phoenix.cost+" Ember Shards.");
return;
}

totalShards-=phoenix.cost;

if(key==="azure")azureUnlocked=true;
if(key==="verdant")verdantUnlocked=true;
if(key==="violet")violetUnlocked=true;
if(key==="solar")solarUnlocked=true;

equippedPhoenix=key;

save();
renderRoost();
}

function equipPhoenix(key){
if(!unlocked(key))return;

equippedPhoenix=key;

save();
renderRoost();
}

function makeEmbers(){
return Array.from({length:42},()=>({
x:Math.random()*W,
y:Math.random()*H,
size:1+Math.random()*2.5,
speed:14+Math.random()*32,
drift:Math.random()*7
}));
}
function updateAbilityButton(){
abilityButton.classList.add("hidden");
abilityButton.classList.remove("solar");

if(!playing)return;

if(equippedPhoenix==="violet"&&arcanePulse){
abilityButton.textContent="ARCANE\nPULSE";
abilityButton.classList.remove("hidden");
}

if(equippedPhoenix==="solar"&&sunfireGrace){
abilityButton.textContent="SUNFIRE\nGRACE";
abilityButton.classList.add("solar");
abilityButton.classList.remove("hidden");
}
}

function useAbility(){
if(!playing)return;

if(equippedPhoenix==="violet"&&arcanePulse){
const target=rocks.find(rock=>{
return rock.x+rock.width>bird.x;
});

if(target){
arcanePulse=false;

target.x=-220;
target.shardX=-220;

showTip(
"<strong>Arcane Pulse!</strong><br>The nearest obstacle was destroyed."
);

updateAbilityButton();
}
}

if(equippedPhoenix==="solar"&&sunfireGrace){
sunfireGrace=false;
sunfireActive=true;

showTip(
"<strong>Sunfire Grace!</strong><br>Your next collision burns through rock."
);

updateAbilityButton();
}
}

function addRock(start=660){
let gap=Math.max(150,220-level*7);

let middle=
gap/2+45+
Math.random()*(H-gap-90);

if(distance>=5000&&Math.random()<.25){
gap=Math.max(140,gap-18);

middle=
H/2+
(Math.random()-.5)*35;
}

else if(distance>=3000&&Math.random()<.30){
middle=H*.69+Math.random()*70;
}

else if(distance>=2000&&Math.random()<.32){
middle=H*.20+Math.random()*70;
}

middle=Math.max(
gap/2+45,
Math.min(H-gap/2-45,middle)
);

const width=118;

const top=middle-gap/2;
const bottom=middle+gap/2;

const face=Array.from({length:7},(_,i)=>({
dx:i*width/6,
top:top-8-Math.random()*28,
bottom:bottom+8+Math.random()*28
}));

rocks.push({
x:start,
width,
top,
bottom,
face,

shard:Math.random()<.35,
shardX:start+width/2,
shardY:top+42+Math.random()*(gap-84),
shardCollected:false
});
}

function startGame(practice=false){
playing=true;
holding=false;

bird={
x:95,
y:380,
velocity:0,
radius:25
};

rocks=[];
embers=makeEmbers();
trails=[];
gate=null;

distance=0;
seconds=0;
level=0;
runShards=0;

checkpoint=0;
checkpointFlash=0;

revivedThisRun=false;
reviveSafety=0;

stormShield=false;
arcanePulse=false;
sunfireGrace=false;
sunfireActive=false;

tipTimer=0;
gameTip.classList.add("hidden");

lastTime=performance.now();

menu.classList.add("hidden");
roost.classList.add("hidden");
leaderboardScreen.classList.add("hidden");
reviveScreen.classList.add("hidden");

addRock(720);

updateAbilityButton();

if(practice){
showTip(
"<strong>Practice flight started.</strong><br>Hold to rise, then release to glide.",
5
);
}

requestAnimationFrame(loop);
}

c.addEventListener("touchstart",event=>{
event.preventDefault();

if(playing){
holding=true;
}
},{passive:false});

c.addEventListener("touchend",event=>{
event.preventDefault();

holding=false;
},{passive:false});

c.addEventListener("touchcancel",()=>{
holding=false;
});

c.addEventListener("mousedown",()=>{
if(playing){
holding=true;
}
});

window.addEventListener("mouseup",()=>{
holding=false;
});

function triggerGameOver(){
if(!playing)return;

playing=false;
holding=false;

updateAbilityButton();

const canRevive=
checkpoint>0&&
!revivedThisRun&&
totalShards>=REVIVE_COST;

if(canRevive){
reviveText.innerHTML=`
You reached the ${checkpoint.toLocaleString()} m checkpoint.<br><br>

Spend <b>${REVIVE_COST} saved Ember Shards</b><br>
to return to that checkpoint?
`;

reviveScreen.classList.remove("hidden");

return;
}

endFlight();
}

function endFlight(){
playing=false;
holding=false;
tutorialRunning=false;

reviveScreen.classList.add("hidden");
gameTip.classList.add("hidden");

const finalDistance=Math.floor(distance);
const wasNewBest=finalDistance>best;

best=Math.max(best,finalDistance);

addLeaderboardEntry();

totalShards+=runShards;

save();
updateMenuText();

bestText.innerHTML=`
Best: ${best.toLocaleString()} m<br>
Highest checkpoint: ${
highestCheckpoint
?highestCheckpoint.toLocaleString()+" m"
:"Not reached"
}

<br><br>

Flight ended at <b>${finalDistance.toLocaleString()} m</b>
${wasNewBest?`<br><span style="color:#ffd15c">NEW BEST!</span>`:""}

<br>
Run Shards: <b>${runShards}</b><br>
Total Shards: ${totalShards}

<br><br>

Your flight was saved in <b>Top Flights</b>.
`;

menu.classList.remove("hidden");
}

function reviveFlight(){
if(totalShards<REVIVE_COST)return;

totalShards-=REVIVE_COST;

revivedThisRun=true;
distance=checkpoint;

bird={
x:95,
y:H/2,
velocity:0,
radius:25
};

rocks=[];
trails=[];
gate=null;

reviveSafety=1.8;

stormShield=false;
arcanePulse=false;
sunfireGrace=false;
sunfireActive=false;

playing=true;
holding=false;

lastTime=performance.now();

save();

reviveScreen.classList.add("hidden");

showTip(
"<strong>Phoenix reborn.</strong><br>You are protected briefly.",
3
);

updateAbilityButton();

requestAnimationFrame(loop);
}

function mountains(color,y,height,spacing,speed){
const offset=(distance*speed)%spacing;

x.fillStyle=color;
x.beginPath();

x.moveTo(-spacing-offset,H);

for(
let px=-spacing-offset;
px<W+spacing;
px+=spacing
){
x.lineTo(px,y);
x.lineTo(px+spacing/2,y-height);
x.lineTo(px+spacing,y);
}

x.lineTo(W+spacing,H);

x.closePath();
x.fill();
}

function zone(){
if(distance>=4000){
return{
name:"VERDANT WILDS",
top:"#123826",
mid:"#0b2018",
bottom:"#06110d",
m1:"#10271c",
m2:"#163b27",
m3:"#1d5131",
rock:"#173126",
edge:"#72f59b",
particle:"#69ff9a"
};
}

if(distance>=2000){
return{
name:"AZURE PEAKS",
top:"#10284b",
mid:"#0b1733",
bottom:"#060a18",
m1:"#0b1d36",
m2:"#102b48",
m3:"#183a55",
rock:"#172a3c",
edge:"#65dfff",
particle:"#55ddff"
};
}

return{
name:"EMBER CAVERNS",
top:"#35122f",
mid:"#1a1022",
bottom:"#080914",
m1:"#1d1422",
m2:"#281522",
m3:"#351821",
rock:"#241820",
edge:"#ff8035",
particle:"#ff7040"
};
}
function loop(now){
if(!playing)return;

const dt=Math.min(
.03,
(now-lastTime)/1000
);

lastTime=now;

seconds+=dt;
distance+=52*dt;

level=Math.min(
10,
Math.floor(distance/500)
);

tipTimer-=dt;

if(tipTimer<=0){
gameTip.classList.add("hidden");
}

checkpointFlash=Math.max(
0,
checkpointFlash-dt
);

reviveSafety=Math.max(
0,
reviveSafety-dt
);

bird.velocity+=(
holding
?-720
:920
)*dt;

bird.velocity=Math.max(
-360,
Math.min(420,bird.velocity)
);

bird.y+=bird.velocity*dt;

for(const ember of embers){
ember.x-=ember.speed*dt;

ember.y+=Math.sin(
seconds*2+
ember.drift
)*12*dt;

if(ember.x<-8){
ember.x=W+8;
ember.y=Math.random()*H;
}
}

trails.push({
x:bird.x-32,
y:bird.y+(Math.random()-.5)*18,
size:7+Math.random()*9,
life:.8,
color:P[equippedPhoenix].color
});

trails=trails.filter(trail=>{
trail.life-=dt;

trail.x-=(
230+
Math.random()*120
)*dt;

trail.y+=Math.sin(
seconds*8+
trail.x*.03
)*12*dt;

return trail.life>0&&trail.x>-70;
});

const nextCheckpoint=
checkpoint+CHECKPOINT_DISTANCE;

const calm=
distance>=nextCheckpoint-220;

if(
reviveSafety<=0&&
!calm&&
!gate&&
(
rocks.length===0||
rocks[rocks.length-1].x<340
)
){
addRock();
}

const speed=Math.min(
265,
155+level*11
);

for(const rock of rocks){
rock.x-=speed*dt;

if(rock.shard&&!rock.shardCollected){
rock.shardX-=speed*dt;

if(equippedPhoenix==="verdant"){
const dx=bird.x-rock.shardX;
const dy=bird.y-rock.shardY;

const shardDistance=Math.hypot(dx,dy);

if(shardDistance<MAGNET_RANGE){
const pull=
(1-shardDistance/MAGNET_RANGE)*3.2;

rock.shardX+=dx*pull*dt;
rock.shardY+=dy*pull*dt;
}
}

const shardXDistance=bird.x-rock.shardX;
const shardYDistance=bird.y-rock.shardY;

if(
shardXDistance*shardXDistance+
shardYDistance*shardYDistance<
(bird.radius+14)*(bird.radius+14)
){
rock.shardCollected=true;
runShards++;

if(
tutorialRunning&&
!tutorialShardSeen
){
tutorialShardSeen=true;

showTip(
"<strong>Ember Shard collected!</strong><br>Spend saved Shards in the Phoenix Roost.",
5
);
}
}
}

const hitSide=
bird.x+bird.radius>rock.x&&
bird.x-bird.radius<rock.x+rock.width;

const hitRock=
bird.y-bird.radius<rock.top||
bird.y+bird.radius>rock.bottom;

if(hitSide&&hitRock){
if(
equippedPhoenix==="azure"&&
stormShield
){
stormShield=false;

rock.x=-220;
rock.shardX=-220;

showTip(
"<strong>Storm Shield!</strong><br>Azure Phoenix blocked the collision.",
3
);

continue;
}

if(
equippedPhoenix==="solar"&&
sunfireActive
){
sunfireActive=false;

rock.x=-220;
rock.shardX=-220;

runShards+=2;

showTip(
"<strong>Sunfire Grace!</strong><br>The rock burned away. +2 Shards.",
3
);

continue;
}

triggerGameOver();

return;
}
}

rocks=rocks.filter(rock=>{
return rock.x>-150;
});

if(
calm&&
!gate&&
rocks.length===0&&
reviveSafety<=0
){
gate={
x:470,
y:H/2,
value:nextCheckpoint,
pulse:0
};
}

if(gate){
gate.x-=speed*dt;
gate.pulse+=dt;

if(gate.x<bird.x){
checkpoint=gate.value;

runShards++;
checkpointFlash=2.6;

if(equippedPhoenix==="azure"){
stormShield=true;
}

if(equippedPhoenix==="violet"){
arcanePulse=true;
}

if(equippedPhoenix==="solar"){
sunfireGrace=true;
}

if(checkpoint>highestCheckpoint){
highestCheckpoint=checkpoint;

save();
}

if(
tutorialRunning&&
!tutorialGateSeen
){
tutorialGateSeen=true;

showTip(
"<strong>Checkpoint reached!</strong><br>You gained a Shard and one revive.",
5
);
}

gate=null;

addRock(760);

updateAbilityButton();
}
}

if(
reviveSafety<=0&&
(
bird.y-bird.radius<0||
bird.y+bird.radius>H
)
){
triggerGameOver();

return;
}

draw();

requestAnimationFrame(loop);
}
function draw(){
const z=zone();

const sky=x.createLinearGradient(
0,
0,
0,
H
);

sky.addColorStop(0,z.top);
sky.addColorStop(.48,z.mid);
sky.addColorStop(1,z.bottom);

x.fillStyle=sky;
x.fillRect(0,0,W,H);

mountains(z.m1,575,92,180,.08);
mountains(z.m2,640,125,145,.16);
mountains(z.m3,705,110,112,.26);

for(const ember of embers){
x.globalAlpha=.55;

x.fillStyle=
ember.size>2
?z.particle
:"#ed542d";

x.beginPath();

x.arc(
ember.x,
ember.y,
ember.size,
0,
Math.PI*2
);

x.fill();
}

x.globalAlpha=1;

/* Moving Phoenix flame trail */

for(const trail of trails){
const alpha=trail.life/.8;

x.save();

x.globalAlpha=alpha;

x.shadowBlur=16;
x.shadowColor=trail.color;
x.fillStyle=trail.color;

x.beginPath();

x.arc(
trail.x,
trail.y,
trail.size*alpha,
0,
Math.PI*2
);

x.fill();

x.restore();
}

/* Volcanic rock and Ember Shards */

for(const rock of rocks){
x.fillStyle=z.rock;
x.strokeStyle=z.edge;
x.lineWidth=2.5;

/* Top formation */

x.beginPath();

x.moveTo(rock.x,0);
x.lineTo(rock.x+rock.width,0);

for(let i=6;i>=0;i--){
x.lineTo(
rock.x+rock.face[i].dx,
rock.face[i].top
);
}

x.closePath();
x.fill();
x.stroke();

/* Bottom formation */

x.beginPath();

x.moveTo(rock.x,H);
x.lineTo(rock.x+rock.width,H);

for(let i=6;i>=0;i--){
x.lineTo(
rock.x+rock.face[i].dx,
rock.face[i].bottom
);
}

x.closePath();
x.fill();
x.stroke();

/* Ember Shard */

if(
rock.shard&&
!rock.shardCollected
){
x.save();

x.translate(
rock.shardX,
rock.shardY
);

x.rotate(seconds*2);

x.shadowBlur=14;
x.shadowColor="#ff7b2f";
x.fillStyle="#ffd15c";

x.beginPath();

x.moveTo(0,-11);
x.lineTo(8,0);
x.lineTo(0,11);
x.lineTo(-8,0);

x.closePath();
x.fill();

x.restore();
}
}

/* Phoenix checkpoint gate */

if(gate){
const phoenix=P[equippedPhoenix];

x.save();

x.translate(gate.x,gate.y);

const pulse=
1+Math.sin(gate.pulse*8)*.08;

x.scale(pulse,pulse);

x.globalAlpha=.28;
x.fillStyle=phoenix.color;

x.shadowBlur=30;
x.shadowColor=phoenix.color;

x.beginPath();

x.ellipse(
0,
0,
38,
68,
0,
0,
Math.PI*2
);

x.fill();

x.globalAlpha=1;
x.strokeStyle="#ffd15c";
x.lineWidth=5;

x.beginPath();

x.ellipse(
0,
0,
38,
68,
0,
0,
Math.PI*2
);

x.stroke();

x.restore();
}

/* Verdant Phoenix: Ember Magnet */

if(equippedPhoenix==="verdant"){
x.save();

x.globalAlpha=.18;

x.strokeStyle="#62f58c";
x.fillStyle="#62f58c";

x.shadowBlur=28;
x.shadowColor="#56f58a";

x.beginPath();

x.arc(
bird.x,
bird.y,
MAGNET_RANGE,
0,
Math.PI*2
);

x.stroke();

x.restore();
}

/* Azure Phoenix: Storm Shield */

if(
equippedPhoenix==="azure"&&
stormShield
){
x.save();

x.strokeStyle="#67e7ff";
x.lineWidth=3;

x.shadowBlur=24;
x.shadowColor="#36dfff";

x.beginPath();

x.arc(
bird.x,
bird.y,
42,
0,
Math.PI*2
);

x.stroke();

x.restore();
}

/* Violet Phoenix: charged Arcane Pulse */

if(
equippedPhoenix==="violet"&&
arcanePulse
){
x.save();

x.globalAlpha=.35;

x.strokeStyle="#c879ff";
x.lineWidth=3;

x.shadowBlur=28;
x.shadowColor="#9e4bff";

x.beginPath();

x.arc(
bird.x,
bird.y,
43,
0,
Math.PI*2
);

x.stroke();

x.restore();
}

/* Solar Phoenix: charged or active Sunfire Grace */

if(
equippedPhoenix==="solar"&&
(
sunfireGrace||
sunfireActive
)
){
x.save();

x.globalAlpha=
sunfireActive
?.52
:.28;

x.strokeStyle="#ffd15c";
x.lineWidth=4;

x.shadowBlur=30;
x.shadowColor="#ff9b2f";

x.beginPath();

x.arc(
bird.x,
bird.y,
sunfireActive
?45
:60,
0,
Math.PI*2
);

x.stroke();

x.restore();
}

/* Phoenix itself */

const phoenix=P[equippedPhoenix];

x.save();

x.translate(
bird.x,
bird.y
);

x.rotate(
Math.max(
-.38,
Math.min(
.58,
bird.velocity/650
)
)
);

x.filter=phoenix.filter;

x.shadowBlur=22;
x.shadowColor=phoenix.shadow;

if(sprite){
x.drawImage(
sprite,
-52,
-52,
104,
104
);
}else{
x.fillStyle=phoenix.color;

x.beginPath();

x.arc(
0,
0,
25,
0,
Math.PI*2
);

x.fill();
}

x.restore();

/* HUD: distance */

x.fillStyle="#fff";
x.font="bold 20px Arial";

x.fillText(
Math.floor(distance).toLocaleString()+" m",
16,
32
);

/* HUD: run Shards */

x.fillStyle="#ffd15c";
x.font="bold 15px Arial";

x.fillText(
"SHARDS: "+runShards,
16,
57
);

/* HUD: equipped Phoenix ability state */

x.font="bold 13px Arial";

if(equippedPhoenix==="verdant"){
x.fillStyle="#62f58c";

x.fillText(
"EMBER MAGNET",
16,
80
);
}

if(equippedPhoenix==="azure"){
x.fillStyle=
stormShield
?"#67e7ff"
:"#8a9ba8";

x.fillText(
stormShield
?"STORM SHIELD READY"
:"STORM SHIELD USED",
16,
80
);
}

if(equippedPhoenix==="violet"){
x.fillStyle=
arcanePulse
?"#c879ff"
:"#8a6a9f";

x.fillText(
arcanePulse
?"ARCANE PULSE READY"
:"ARCANE PULSE USED",
16,
80
);
}

if(equippedPhoenix==="solar"){
x.fillStyle=
sunfireGrace
?"#ffd15c"
:(
sunfireActive
?"#fff2b0"
:"#a58c68"
);

x.fillText(
sunfireGrace
?"SUNFIRE GRACE READY"
:(
sunfireActive
?"SUNFIRE GRACE ACTIVE"
:"SUNFIRE GRACE USED"
),
16,
80
);
}

/* HUD: zone and level */

x.textAlign="right";

x.fillStyle=phoenix.color;
x.font="bold 15px Arial";

x.fillText(
z.name+" · LEVEL "+(level+1),
402,
32
);

x.textAlign="left";

/* Checkpoint announcement */

if(checkpointFlash>0){
x.textAlign="center";

x.fillStyle="#ffd15c";
x.font="bold 25px Arial";

x.fillText(
"CHECKPOINT "+
checkpoint.toLocaleString()+
" m",
W/2,
118
);

x.font="bold 17px Arial";

x.fillText(
"+1 EMBER SHARD",
W/2,
146
);

if(equippedPhoenix==="azure"){
x.fillStyle="#67e7ff";

x.fillText(
"STORM SHIELD CHARGED",
W/2,
171
);
}

if(equippedPhoenix==="violet"){
x.fillStyle="#c879ff";

x.fillText(
"ARCANE PULSE CHARGED",
W/2,
171
);
}

if(equippedPhoenix==="solar"){
x.fillStyle="#ffd15c";

x.fillText(
"SUNFIRE GRACE CHARGED",
W/2,
171
);
}

x.textAlign="left";
}
}

updateMenuText();
</script>

</body>
</html>
