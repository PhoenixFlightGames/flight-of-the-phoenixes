<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b18;overflow:hidden;font-family:Arial;color:white}
canvas{width:100vw;height:100vh;object-fit:contain;touch-action:none}
#menu{
  position:fixed;inset:0;display:grid;place-content:center;text-align:center;
  padding:24px;background:rgba(9,11,24,.92)
}
h1{color:#ffc65a;font-size:38px;text-shadow:0 0 20px #ff542f}
p{max-width:340px;color:#ddd;line-height:1.45}
button{
  margin:8px;padding:15px 22px;border:1px solid #ffc65a;border-radius:12px;
  background:#49233d;color:white;font-size:18px;font-weight:bold
}
</style>
</head>
<body>

<canvas id="game" width="420" height="760"></canvas>

<div id="menu">
  <h1>FLIGHT OF THE<br>PHOENIXES</h1>
  <p>Hold the screen to rise. Release to glide.<br>Avoid the obstacles and fly as far as you can.</p>
  <button onclick="startGame()">Endless Flight</button>
  <p id="best">Best: 0 m</p>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const menu=document.getElementById("menu");
const bestText=document.getElementById("best");

let playing=false;
let holding=false;
let phoenix, obstacles, distance, seconds, lastTime, nextGate, zone;
let best=Number(localStorage.getItem("phoenixBest"))||0;

bestText.textContent="Best: "+best.toLocaleString()+" m";

function startGame(){
  playing=true;
  holding=false;
  phoenix={x:92,y:380,velocity:0,radius:19};
  obstacles=[];
  distance=0;
  seconds=0;
  nextGate=2000;
  zone=0;
  lastTime=performance.now();
  menu.style.display="none";
  requestAnimationFrame(gameLoop);
}

canvas.addEventListener("pointerdown",function(e){
  e.preventDefault();
  holding=true;
});
window.addEventListener("pointerup",function(){
  holding=false;
});

function makeObstacle(){
  const gap=Math.max(145,215-zone*14);
  const middle=160+Math.random()*440;
  obstacles.push({
    x:440,
    width:55,
    top:middle-gap/2,
    bottom:middle+gap/2
  });
}

function gameOver(){
  if(!playing)return;
  playing=false;
  best=Math.max(best,Math.floor(distance));
