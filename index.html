<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080914;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;color:#fff;text-align:center;background:#080914f0}
.hidden{display:none!important}
h1{margin:0 0 22px;color:#ffc65a;font-size:40px;text-shadow:0 0 20px #f05224}
p{max-width:360px;color:#e1dbe5;font-size:18px;line-height:1.45}
button{width:min(360px,86vw);margin:8px 0;padding:16px;border:2px solid #ffc65a;border-radius:14px;background:#592540;color:#fff;font-size:20px;font-weight:bold}
.roost{width:min(390px,92vw);max-height:64vh;overflow:auto}
.shards{color:#ffd15c;font-size:22px;font-weight:bold}
.card{margin:9px 0;padding:14px 15px;border:1px solid #744357;border-radius:12px;background:#221522;text-align:left}
.equipped{background:#402033}
.card button{width:100%;margin:10px 0 0;padding:10px;font-size:16px}
.preview{display:inline-block;width:17px;height:17px;margin-right:7px;border-radius:50%;vertical-align:-3px}
</style>
</head>
<body>

<canvas id="game" width="420" height="760"></canvas>

<div id="menu" class="screen">
<h1>FLIGHT OF THE<br>PHOENIXES</h1>
<p>Hold to rise. Release to glide.<br>Avoid volcanic rock and collect Ember Shards.</p>
<button onclick="startGame()">Endless Flight</button>
<button onclick="openRoost()">Phoenix Roost</button>
<p id="bestText"></p>
</div>

<div id="roost" class="screen hidden">
<h1>PHOENIX ROOST</h1>
<p class="shards" id="roostShards"></p>
<div class="roost" id="phoenixList"></div>
<button onclick="closeRoost()">Back to Flight</button>
</div>

<script>
const c=document.getElementById("game");
const x=c.getContext("2d");
const menu=document.getElementById("menu");
const roost=document.getElementById("roost");
const bestText=document.getElementById("bestText");
const roostShards=document.getElementById("roostShards");
const phoenixList=document.getElementById("phoenixList");

const W=420,H=760;
const CHECK=1000,CALM=220;

const P={
ember:{name:"Ember Phoenix",sub:"Starter Phoenix — orange flame",color:"#ff8a35",shadow:"#ff542f",cost:0,filter:""},
azure:{name:"Azure Phoenix",sub:"Stormborn feathers and cyan flame",color:"#67e7ff",shadow:"#36dfff",cost:25,filter:"hue-rotate(145deg) saturate(1.8) brightness(1.2)"},
verdant:{name:"Verdant Phoenix",sub:"Wildfire plumage and emerald flame",color:"#62f58c",shadow:"#56f58a",cost:50,filter:"hue-rotate(78deg) saturate(1.9) brightness(1.18)"}
};

let playing=false,holding=false;
let bird,rocks,embers,trails,gate;
let distance=0,seconds=0,level=0,run=0,last=0;
let checkpoint=0,flash=0;

let best=Number(localStorage.getItem("phoenixBest"))||0;
let total=Number(localStorage.getItem("phoenixShards"))||0;
let high=Number(localStorage.getItem("phoenixHighestCheckpoint"))||0;
let azure=localStorage.getItem("azureUnlocked")==="true";
let verdant=localStorage.getItem("verdantUnlocked")==="true";
let equipped=localStorage.getItem("equippedPhoenix")||"ember";

if(equipped==="azure"&&!azure)equipped="ember";
if(equipped==="verdant"&&!verdant)equipped="ember";

function zone(){
if(distance>=2000){
return{
name:"AZURE PEAKS",
top:"#10284b",
mid:"#0b1733",
bottom:"#060a18",
m1:"#0b1d36",
m2:"#102b48",
m3:"#183a55",
ember:"#55ddff",
rock:"#172a3c",
edge:"#65dfff"
};
}

return{
name:"EMBER CAVERNS",
top:"#35122f",
mid:"#1a1022",
bottom:"#080914",
m1:"#1d1422",
m2:"#281522",
m3:"#351821",
ember:"#ff7040",
rock:"#241820",
edge:"#ff8035"
};
}

function menuText(){
bestText.innerHTML=`
Best: ${best.toLocaleString()} m<br>
Highest checkpoint: ${high?high.toLocaleString()+" m":"Not reached"}
`;
}

menuText();

const img=new Image();
let sprite=null;

img.onload=()=>{
const s=document.createElement("canvas");
const q=s.getContext("2d");

s.width=img.naturalWidth;
s.height=img.naturalHeight;

q.drawImage(img,0,0);

const d=q.getImageData(0,0,s.width,s.height);

for(let i=0;i<d.data.length;i+=4){
const r=d.data[i];
const g=d.data[i+1];
const b=d.data[i+2];

if(
r>215&&g>215&&b>215&&
Math.max(r,g,b)-Math.min(r,g,b)<28
){
d.data[i+3]=0;
}
}

q.putImageData(d,0,0);
sprite=s;
};

img.src="IMG_3821.jpeg";

function save(){
localStorage.setItem("phoenixBest",best);
localStorage.setItem("phoenixShards",total);
localStorage.setItem("phoenixHighestCheckpoint",high);
localStorage.setItem("azureUnlocked",azure);
localStorage.setItem("verdantUnlocked",verdant);
localStorage.setItem("equippedPhoenix",equipped);
}

function unlocked(key){
return key==="ember"||
(key==="azure"&&azure)||
(key==="verdant"&&verdant);
}

function dot(color){
return `
<span
class="preview"
style="background:${color};box-shadow:0 0 12px ${color}"
></span>
`;
}

function openRoost(){
render();
menu.classList.add("hidden");
roost.classList.remove("hidden");
}

function closeRoost(){
roost.classList.add("hidden");
menu.classList.remove("hidden");
}

function card(key){
const phoenix=P[key];
const active=equipped===key;

if(!unlocked(key)){
return `
<div class="card">
<strong style="color:${phoenix.color}">
${dot(phoenix.color)}${phoenix.name}
</strong><br>
${phoenix.sub}
<button onclick="unlockPhoenix('${key}')">
Unlock for ${phoenix.cost} Shards
</button>
</div>
`;
}

return `
<div class="card ${active?"equipped":""}">
<strong style="color:${phoenix.color}">
${dot(phoenix.color)}${phoenix.name}
</strong><br>
${phoenix.sub}<br>
${active?"Equipped":"Unlocked"}
${active?"":`
<button onclick="equipPhoenix('${key}')">
Equip ${phoenix.name}
</button>
`}
</div>
`;
}

function render(){
roostShards.textContent="Ember Shards: "+total;

phoenixList.innerHTML=`
${card("ember")}
${card("azure")}
${card("verdant")}

<div class="card">
<strong>Violet Phoenix</strong><br>
Arcane flame — 100 shards
</div>

<div class="card">
<strong>Solar Phoenix</strong><br>
Sunfire wings — 175 shards
</div>
`;
}

function unlockPhoenix(key){
const phoenix=P[key];

if(total<phoenix.cost){
alert("You need "+phoenix.cost+" Ember Shards.");
return;
}

total-=phoenix.cost;

if(key==="azure")azure=true;
if(key==="verdant")verdant=true;

equipped=key;
save();
render();
}

function equipPhoenix(key){
if(!unlocked(key))return;

equipped=key;
save();
render();
}

function startGame(){
playing=true;
holding=false;

bird={x:95,y:380,v:0,r:25};
rocks=[];

embers=Array.from({length:42},()=>({
x:Math.random()*W,
y:Math.random()*H,
s:1+Math.random()*2.5,
sp:14+Math.random()*32,
d:Math.random()*7
}));

trails=[];
gate=null;

distance=0;
seconds=0;
level=0;
run=0;
checkpoint=0;
flash=0;
last=performance.now();

addRock(720);

menu.classList.add("hidden");
requestAnimationFrame(loop);
}

for(const type of["touchstart","mousedown"]){
c.addEventListener(type,event=>{
if(type==="touchstart")event.preventDefault();
if(playing)holding=true;
},{passive:false});
}

for(const type of["touchend","touchcancel"]){
c.addEventListener(type,event=>{
event.preventDefault();
holding=false;
},{passive:false});
}

window.addEventListener("mouseup",()=>holding=false);

function addRock(start=660){
const gap=220-level*8;
const min=gap/2+45;
const max=H-gap/2-45;
const mid=min+Math.random()*(max-min);

const width=118;
const top=mid-gap/2;
const bottom=mid+gap/2;

const face=Array.from({length:7},(_,i)=>({
dx:i*width/6,
t:top-8-Math.random()*28,
b:bottom+8+Math.random()*28
}));

rocks.push({
x:start,
w:width,
top:top,
bottom:bottom,
face:face,
shard:Math.random()<.35,
sy:top+42+Math.random()*(gap-84),
got:false
});
}

function end(){
if(!playing)return;

playing=false;
best=Math.max(best,Math.floor(distance));
total+=run;

save();
menuText();
menu.classList.remove("hidden");
}

function loop(now){
if(!playing)return;

const dt=Math.min(.03,(now-last)/1000);
last=now;

seconds+=dt;
distance+=52*dt;
level=Math.min(3,Math.floor(distance/500));
flash=Math.max(0,flash-dt);

const next=checkpoint+CHECK;
const calm=distance>=next-CALM;

bird.v+=(holding?-720:920)*dt;
bird.v=Math.max(-360,Math.min(420,bird.v));
bird.y+=bird.v*dt;

for(const ember of embers){
ember.x-=ember.sp*dt;
ember.y+=Math.sin(seconds*2+ember.d)*12*dt;

if(ember.x<-8){
ember.x=W+8;
ember.y=Math.random()*H;
}
}

const trailColor=P[equipped].color;

trails.push({
x:bird.x-32,
y:bird.y+(Math.random()-.5)*18,
s:7+Math.random()*9,
life:.82,
max:.82,
vx:-240-Math.random()*160,
vy:(Math.random()-.5)*45,
col:trailColor
});

trails=trails.filter(trail=>{
trail.life-=dt;
trail.x+=trail.vx*dt;
trail.y+=trail.vy*dt;
trail.vy+=12*dt;

return trail.life>0&&trail.x>-70;
});

if(
!calm&&
!gate&&
(
!rocks.length||
rocks[rocks.length-1].x<340
)
){
addRock();
}

const speed=155+level*10;

for(const rock of rocks){
rock.x-=speed*dt;

const hitSide=
bird.x+bird.r>rock.x&&
bird.x-bird.r<rock.x+rock.w;

const hitRock=
bird.y-bird.r<rock.top||
bird.y+bird.r>rock.bottom;

if(hitSide&&hitRock){
end();
return;
}

if(rock.shard&&!rock.got){
const dx=bird.x-rock.x-rock.w/2;
const dy=bird.y-rock.sy;

if(dx*dx+dy*dy<(bird.r+14)*(bird.r+14)){
rock.got=true;
run++;
}
}
}

rocks=rocks.filter(rock=>rock.x>-150);

if(calm&&!gate&&!rocks.length){
gate={
x:470,
y:H/2,
r:68,
v:next,
p:0
};
}

if(gate){
gate.x-=speed*dt;
gate.p+=dt;

if(gate.x<bird.x){
checkpoint=gate.v;
run++;
flash=2.6;

if(checkpoint>high){
high=checkpoint;
save();
}

gate=null;
addRock(760);
}
}

if(bird.y-bird.r<0||bird.y+bird.r>H){
end();
return;
}

draw();
requestAnimationFrame(loop);
}

function mountains(color,y,height,spacing,speed){
const offset=(distance*speed)%spacing;

x.fillStyle=color;
x.beginPath();
x.moveTo(-spacing-offset,H);

for(let px=-spacing-offset;px<W+spacing;px+=spacing){
x.lineTo(px,y);
x.lineTo(px+spacing/2,y-height);
x.lineTo(px+spacing,y);
}

x.lineTo(W+spacing,H);
x.closePath();
x.fill();
}

function draw(){
const z=zone();

const sky=x.createLinearGradient(0,0,0,H);
sky.addColorStop(0,z.top);
sky.addColorStop(.48,z.mid);
sky.addColorStop(1,z.bottom);

x.fillStyle=sky;
x.fillRect(0,0,W,H);

mountains(z.m1,575,92,180,.08);
mountains(z.m2,640,125,145,.16);
mountains(z.m3,705,110,112,.26);

for(const ember of embers){
x.globalAlpha=.55;
x.fillStyle=ember.s>2?z.ember:"#ed542d";

x.beginPath();
x.arc(ember.x,ember.y,ember.s,0,Math.PI*2);
x.fill();
}

x.globalAlpha=1;

for(const trail of trails){
const alpha=trail.life/trail.max;

x.save();
x.globalAlpha=alpha*.82;
x.translate(trail.x,trail.y);
x.scale(1+(1-alpha)*2.5,1);

x.shadowBlur=18;
x.shadowColor=trail.col;
x.fillStyle=trail.col;

x.beginPath();
x.arc(0,0,trail.s*alpha,0,Math.PI*2);
x.fill();

x.restore();
}

for(const rock of rocks){
x.fillStyle=z.rock;
x.strokeStyle=z.edge;
x.lineWidth=2.5;

x.beginPath();
x.moveTo(rock.x,0);
x.lineTo(rock.x+rock.w,0);

for(let i=6;i>=0;i--){
x.lineTo(
rock.x+rock.face[i].dx,
rock.face[i].t
);
}

x.closePath();
x.fill();
x.stroke();

x.beginPath();
x.moveTo(rock.x,H);
x.lineTo(rock.x+rock.w,H);

for(let i=6;i>=0;i--){
x.lineTo(
rock.x+rock.face[i].dx,
rock.face[i].b
);
}

x.closePath();
x.fill();
x.stroke();

if(rock.shard&&!rock.got){
x.save();
x.translate(rock.x+rock.w/2,rock.sy);
x.rotate(seconds*2);

x.shadowBlur=14;
x.shadowColor="#ff7b2f";
x.fillStyle="#ffd15c";

x.beginPath();
x.moveTo(0,-11);
x.lineTo(8,0);
x.lineTo(0,11);
x.lineTo(-8,0);
x.closePath();
x.fill();

x.restore();
}
}

if(gate){
const phoenix=P[equipped];

x.save();
x.translate(gate.x,gate.y);

const pulse=1+Math.sin(gate.p*8)*.08;
x.scale(pulse,pulse);

x.globalAlpha=.28;
x.fillStyle=phoenix.color;
x.shadowBlur=30;
x.shadowColor=phoenix.color;

x.beginPath();
x.ellipse(0,0,38,68,0,0,Math.PI*2);
x.fill();

x.globalAlpha=1;
x.strokeStyle="#ffd15c";
x.lineWidth=5;

x.beginPath();
x.ellipse(0,0,38,68,0,0,Math.PI*2);
x.stroke();

x.restore();
}

const flap=(Math.sin(seconds*18)+1)/2;
const phoenix=P[equipped];

x.save();
x.translate(bird.x,bird.y-flap*3);
x.rotate(Math.max(-.38,Math.min(.58,bird.v/650)));
x.scale(1.02-flap*.06,.94+flap*.12);

x.filter=phoenix.filter;
x.shadowBlur=18+flap*8;
x.shadowColor=phoenix.shadow;

if(sprite){
x.drawImage(sprite,-52,-52,104,104);
}else{
x.fillStyle=phoenix.color;
x.beginPath();
x.arc(0,0,25,0,Math.PI*2);
x.fill();
}

x.restore();

x.fillStyle="#fff";
x.font="bold 20px Arial";
x.fillText(Math.floor(distance).toLocaleString()+" m",16,32);

x.fillStyle="#ffd15c";
x.font="bold 15px Arial";
x.fillText("SHARDS: "+run,16,57);

x.textAlign="right";
x.fillStyle=phoenix.color;
x.fillText(z.name+" · LEVEL "+(level+1),402,32);
x.textAlign="left";

if(flash){
x.textAlign="center";
x.fillStyle="#ffd15c";
x.font="bold 25px Arial";

x.fillText(
"CHECKPOINT "+checkpoint.toLocaleString()+" m",
W/2,
118
);

x.font="bold 17px Arial";
x.fillText("+1 EMBER SHARD",W/2,146);

x.textAlign="left";
}
}
</script>
</body>
</html>
