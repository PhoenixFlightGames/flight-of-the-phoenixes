<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"

<title>Flight of the Phoenixes</title>

<style>
*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#080914;
font-family:Arial,sans-serif;
}

canvas{
display:block;
width:100vw;
height:100vh;
touch-action:none;
}

.screen{
position:fixed;
inset:0;
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

color:#fff;
text-align:center;
background:rgba(8,9,20,.94);
}

.hidden{
display:none!important;
}

h1{
margin:0 0 22px;
color:#ffc65a;

line-height:1.15;
text-shadow:0 0 20px #f05224;
}

p{

color:#e1dbe5;
font-size:18px;
line-height:1.45;

button{

padding:16px;
border:2px solid #ffc65a;
border-radius:14px;
background:#592540;

font-weight:bold;

}

button:active{
transform:scale(.98);
}

.roost,
.leaderboard-list{
width:min(390px,92vw);

}

.shards{

.card{

.card.equipped{

}

.card button{

margin:10px 0 0;
padding:10px;
font-size:16px;
}

.preview{

.revive-title{

.revive-button{

.end-button{

.leaderboard-button{

</head>

<body>

<canvas id="game" width="420" height="760"></canvas>
<button
id="abilityButton"
class="hidden"
onclick="useAbility()"
style="
position:fixed;
right:18px;
bottom:28px;
z-index:8;
width:112px;
height:112px;
margin:0;
padding:10px;
border:3px solid #c879ff;
border-radius:50%;
background:radial-gradient(circle,#5a267c,#231329);
color:#fff;
font-size:14px;
font-weight:bold;
line-height:1.15;
box-shadow:0 0 24px #9e4bff;
white-space:pre-line;
"
>
ABILITY
</button>

<div id="menu" class="screen">
<h1>FLIGHT OF THE<br>PHOENIXES</h1>

<p>
Hold to rise. Release to glide.<br>
Avoid volcanic rock and collect Ember Shards.
</p>

<button onclick="startGame()">Endless Flight</button>
<button onclick="openRoost()">Phoenix Roost</button>
<button
class="leaderboard-button"
onclick="openLeaderboard()"
>
Top Flights
</button>

<p id="bestText"></p>
</div>

<div id="roost" class="screen hidden">
<h1>PHOENIX ROOST</h1>

<div class="roost" id="phoenixList"></div>

<button onclick="closeRoost()">Back to Flight</button>
</div>

<div id="leaderboardScreen" class="screen hidden">
<h1 class="leaderboard-title">TOP FLIGHTS</h1>

<p>
Your best 10 completed flights on this device.
</p>

<div
id="leaderboardList"
class="leaderboard-list"
></div>

<button onclick="closeLeaderboard()">Back to Flight</button>
</div>

<div id="reviveScreen" class="screen hidden">
<h1 class="revive-title">PHOENIX FALLEN</h1>

<p id="reviveText"></p>

<button
class="revive-button"
onclick="reviveFlight()"
>
Revive for 15 Shards
</button>

<button
class="end-button"
onclick="endFlight()"
>
End Flight
</button>
</div>

<script>
const c=document.getElementById("game");
const x=c.getContext("2d");

const menu=document.getElementById("menu");
const roost=document.getElementById("roost");
const leaderboardScreen=
document.getElementById("leaderboardScreen");

const reviveScreen=
document.getElementById("reviveScreen");

const reviveText=
document.getElementById("reviveText");

const bestText=
document.getElementById("bestText");

const roostShards=
document.getElementById("roostShards");

const phoenixList=
document.getElementById("phoenixList");

const leaderboardList=
document.getElementById("leaderboardList");

const W=420;
const H=760;

const CHECKPOINT_DISTANCE=1000;
const CHECKPOINT_CALM_DISTANCE=220;
const REVIVE_COST=15;
const MAGNET_RANGE=80;
const MAGNET_PULL=3.2;

const LEADERBOARD_KEY=
"phoenixLocalLeaderboardV2";

const P={
ember:{
name:"Ember Phoenix",
sub:"Starter Phoenix — orange flame",
color:"#ff8a35",
shadow:"#ff542f",
cost:0
},

azure:{
name:"CC Azure Phoenix",
sub:"Stormborn feathers and a checkpoint Storm Shield",
color:"#67e7ff",
shadow:"#36dfff",
cost:25
},

verdant:{
name:"CC Verdant Phoenix",
sub:"Wildfire plumage and Ember Magnet",
color:"#62f58c",
shadow:"#56f58a",
cost:50
},

violet:{

sub:"Arcane flame and checkpoint Arcane Pulse",
color:"#c879ff",
shadow:"#9e4bff",
cost:100
},

solar:{

shadow:"#ff9b2f",
cost:175

};

const ASSETS={

ember:"Ember Phoenix.png",
azure:"CC Azure Phoenix.png",
verdant:"CC Verdant Phoenix.png",
violet:"CC Violet Phoenix.png",
solar:"CC Solar Phoenix.png"
},

zones:{

topOnly:[
"Ember Caverns Top Only Obstacle variation 1.png"
],

bottomOnly:[
"Ember Caverns Bottom Only Obstacle Variation 1.png",
"Ember Caverns Bottom Only Obstacle Variation 2.png"
],

flexible:[
"Ember Caverns Top or Bottom Obstacle Variation 1.png"
],

floating:[]
},

azure:{
topOnly:[
"Azure Peaks Top Only Obstacle.png"
],

bottomOnly:[
"Azure Peaks Bottom Only Obstacle.png"
],

flexible:[],

floating:[
"Azure Peaks Floating Obstacle Variation 1.png",
"Azure Peaks Floating Obstacle Variation 2.png"
]

verdant:{
topOnly:[
"Verdant wilds top obstacle 1.png"
],

bottomOnly:[
"verdant wilds bottom obstacle 1.png",
"verdant wilds bottom obstacle 2.png"
],

flexible:[
"verdant Top or Bottom Obstacle 1.png"
],

floating:[]
},

celestial:{
topOnly:[
"Celestial Ruins Top 1.png",
"Celestial Ruins Top 2.png",
"Celestial Ruins Top 3.png"
],

bottomOnly:[
"Celestial Ruins bottom 1.png",
"Celestial Ruins bottom 2.png",
"Celestial Ruins bottom 3.png"
],

flexible:[],

floating:[]
}
}
};

let playing=false;
let holding=false;

let bird;
let rocks=[];
let floatingObstacles=[];
let embers=[];
let trails=[];
let gate=null;

let distance=0;
let seconds=0;
let level=0;
let runShards=0;
let lastTime=0;

let checkpoint=0;
let checkpointFlash=0;

let revivedThisRun=false;
let reviveSafety=0;

let stormShield=false;
let shieldFlash=0;

let arcanePulse=false;
let pulseFlash=0;

let sunfireGrace=false;
let sunfireActive=false;
let sunfireFlash=0;

let zoneFlash=0;
let activeZone="EMBER CAVERNS";

let best=
Number(localStorage.getItem("phoenixBest"))||0;

let totalShards=
Number(localStorage.getItem("phoenixShards"))||0;

let highestCheckpoint=
Number(
localStorage.getItem("phoenixHighestCheckpoint")
)||0;

let equippedPhoenix=
localStorage.getItem("equippedPhoenix")
||"ember";

let azureUnlocked=
localStorage.getItem("azureUnlocked")
==="true";

let verdantUnlocked=
localStorage.getItem("verdantUnlocked")
==="true";

let violetUnlocked=
localStorage.getItem("violetUnlocked")
==="true";

let solarUnlocked=
localStorage.getItem("solarUnlocked")
==="true";

let leaderboard=
loadLeaderboard();

const art={};

let artworkReady=false;

if(
equippedPhoenix==="azure"&&
!azureUnlocked
){
equippedPhoenix="ember";
}

if(
equippedPhoenix==="verdant"&&
!verdantUnlocked
){
equippedPhoenix="ember";
}

if(
equippedPhoenix==="violet"&&
!violetUnlocked
){
equippedPhoenix="ember";
}

if(
equippedPhoenix==="solar"&&
!solarUnlocked
){
equippedPhoenix="ember";
}

function unlocked(key){
return(
key==="ember"||
(
key==="azure"&&
azureUnlocked
)||
(
key==="verdant"&&
verdantUnlocked
)||
(
key==="violet"&&
violetUnlocked
)||
(
key==="solar"&&
solarUnlocked
)
);
}

id:"celestial",
name:"CELESTIAL RUINS",
top:"#17133d",
mid:"#0b1230",
bottom:"#050817",
m1:"#171545",
m2:"#24205d",
m3:"#373078",
particle:"#b98cff",
rock:"#29245a",
edge:"#e6c8ff"
};
}

if(distance>=4000){
return{
id:"verdant",
name:"VERDANT WILDS",
top:"#123826",
mid:"#0b2018",
bottom:"#06110d",
m1:"#10271c",
m2:"#163b27",
m3:"#1d5131",
particle:"#69ff9a",
rock:"#173126",
edge:"#72f59b"
};
}

if(distance>=2000){
return{
id:"azure",
name:"AZURE PEAKS",
top:"#10284b",
mid:"#0b1733",
bottom:"#060a18",
m1:"#0b1d36",
m2:"#102b48",

}

name:"EMBER CAVERNS",

function loadLeaderboard(){
try{
const saved=
JSON.parse(
localStorage.getItem(LEADERBOARD_KEY)
);

return Array.isArray(saved)
?saved
:[];
}catch{
return[];
}
}

function saveLeaderboard(){
localStorage.setItem(
LEADERBOARD_KEY,
JSON.stringify(leaderboard)
);
}

function save(){
localStorage.setItem(
"phoenixBest",
best
);

localStorage.setItem(
"phoenixShards",
totalShards
);

localStorage.setItem(
"phoenixHighestCheckpoint",
highestCheckpoint
);

localStorage.setItem(
"azureUnlocked",
azureUnlocked
);

localStorage.setItem(
"verdantUnlocked",
verdantUnlocked
);

localStorage.setItem(
"violetUnlocked",
violetUnlocked
);

localStorage.setItem(
"solarUnlocked",
solarUnlocked
);

localStorage.setItem(
"equippedPhoenix",
equippedPhoenix
);
}

function updateMenuText(){
bestText.innerHTML=`
Best:
${best.toLocaleString()} m<br>

Highest checkpoint:
${
highestCheckpoint
?highestCheckpoint.toLocaleString()+" m"
:"Not reached"
}
`;
}

function pick(list){
return list[
Math.floor(
Math.random()*list.length
)
];
}

function dot(color){
return`
<span
class="preview"
style="
background:${color};
box-shadow:0 0 12px ${color}
">
</span>
`;
}

updateMenuText();

function removeWhiteBackground(image){
const output=document.createElement("canvas");
const context=output.getContext("2d");

output.width=image.naturalWidth;
output.height=image.naturalHeight;

context.drawImage(
image,
0,
0,
output.width,
output.height
);

return output;
}

function loadImage(filename){
return new Promise(resolve=>{
const image=new Image();

image.onload=()=>{
art[filename]=removeWhiteBackground(image);
resolve();
};

image.onerror=()=>{
console.warn(
"Could not load image:",
filename
);

art[filename]=null;
resolve();
};

image.src=filename;
});
}

async function loadAllArtwork(){
const filenames=[
...Object.values(ASSETS.phoenix),

...ASSETS.zones.ember.topOnly,
...ASSETS.zones.ember.bottomOnly,
...ASSETS.zones.ember.flexible,

...ASSETS.zones.azure.topOnly,
...ASSETS.zones.azure.bottomOnly,
...ASSETS.zones.azure.floating,

...ASSETS.zones.verdant.topOnly,
...ASSETS.zones.verdant.bottomOnly,
...ASSETS.zones.verdant.flexible,

...ASSETS.zones.celestial.topOnly,
...ASSETS.zones.celestial.bottomOnly
];

const uniqueFilenames=[
...new Set(filenames)
];

await Promise.all(
uniqueFilenames.map(loadImage)
);

artworkReady=true;
}

function openRoost(){
renderRoost();

menu.classList.add("hidden");
leaderboardScreen.classList.add("hidden");
roost.classList.remove("hidden");
}

function closeRoost(){
roost.classList.add("hidden");
menu.classList.remove("hidden");
}

function phoenixCard(key){
const phoenix=P[key];
const active=equippedPhoenix===key;

if(!unlocked(key)){
return`
<div class="card">

<strong style="color:${phoenix.color}">
${dot(phoenix.color)}
${phoenix.name}
</strong>

<br>
${phoenix.sub}

<button
onclick="unlockPhoenix('${key}')"
>
Unlock for ${phoenix.cost} Shards
</button>

</div>
`;
}

return`
<div class="card ${active?"equipped":""}">

<strong style="color:${phoenix.color}">
${dot(phoenix.color)}
${phoenix.name}
</strong>

<br>
${phoenix.sub}<br>
${active?"Equipped":"Unlocked"}

${
active
?""
:`
<button
onclick="equipPhoenix('${key}')"
>
Equip ${phoenix.name}
</button>
`
}

</div>
`;
}

function renderRoost(){
roostShards.textContent=
"Ember Shards: "+totalShards;

phoenixList.innerHTML=`
${phoenixCard("ember")}
${phoenixCard("azure")}
${phoenixCard("verdant")}
${phoenixCard("violet")}
${phoenixCard("solar")}
`;
}

function unlockPhoenix(key){
const phoenix=P[key];

if(totalShards<phoenix.cost){
alert(
"You need "+
phoenix.cost+
" Ember Shards."
);

return;
}

totalShards-=phoenix.cost;

if(key==="azure"){
azureUnlocked=true;
}

if(key==="verdant"){
verdantUnlocked=true;
}

if(key==="violet"){
violetUnlocked=true;
}

if(key==="solar"){
solarUnlocked=true;
}

equippedPhoenix=key;

save();
renderRoost();
updateMenuText();
}

function equipPhoenix(key){
if(!unlocked(key)){
return;
}

equippedPhoenix=key;

save();
renderRoost();
updateMenuText();
}

function openLeaderboard(){
renderLeaderboard();

menu.classList.add("hidden");
roost.classList.add("hidden");
leaderboardScreen.classList.remove("hidden");
}

function closeLeaderboard(){
leaderboardScreen.classList.add("hidden");
menu.classList.remove("hidden");
}

Start an Endless Flight to set your first record.

leaderboard.map((entry,index)=>{

P[entry.phoenix]||

<div class="leaderboard-rank">

function recordFlight(distanceValue,shardValue){
if(distanceValue<1){
return;
}

leaderboard.push({
distance:distanceValue,
shards:shardValue,
phoenix:equippedPhoenix,
date:new Date().toLocaleDateString()
});

leaderboard.sort(
(first,second)=>
second.distance-first.distance
);

leaderboard=
leaderboard.slice(0,10);

saveLeaderboard();
}

()=>({

y:Math.random()*H,
size:1+Math.random()*2.5,
speed:14+Math.random()*32,
drift:Math.random()*7

trails=[];
gate=null;

runShards=0;

checkpoint=0;

reviveSafety=0;

stormShield=false;
shieldFlash=0;

arcanePulse=false;

c.addEventListener(
"touchstart",

}

);

"touchend",

);

"touchcancel",

}

"mousedown",

}
);

window.addEventListener(
"mouseup",
()=>{
holding=false;
}
);

window.addEventListener(
"blur",

holding=false;

function addRock(start=660){
const zone=currentZone();
const assets=ASSETS.zones[zone.id];

let gap=Math.max(
150,
220-level*7
);

let min=gap/2+45;
let max=H-gap/2-45;

let middle=
min+
Math.random()*(max-min);

if(
distance>=5000&&
Math.random()<.26
){
gap=Math.max(
140,
gap-18
);

middle=
H/2+
(Math.random()-.5)*35;
}
else if(
distance>=3000&&
Math.random()<.30
){
middle=
H*.69+
Math.random()*70;
}
else if(
distance>=2000&&
Math.random()<.32
){
middle=
H*.20+
Math.random()*70;
}

middle=Math.max(
gap/2+45,
Math.min(
H-gap/2-45,
middle
)
);

const width=118;
const top=middle-gap/2;
const bottom=middle+gap/2;

const obstacle={
x:start,
width,
top,
bottom,

topArt:null,
bottomArt:null,

shard:Math.random()<.35,
shardX:start+width/2,
shardY:
top+
42+
Math.random()*(gap-84),

shardCollected:false
};

/*
Top-only assets always attach to the ceiling.
*/
if(assets.topOnly.length){
obstacle.topArt=
art[pick(assets.topOnly)];
}

/*
Bottom-only assets always attach to the floor.
*/
if(assets.bottomOnly.length){
obstacle.bottomArt=
art[pick(assets.bottomOnly)];
}

/*
Flexible assets can be assigned to either side.
They never appear on both sides of the same pair.
*/
if(assets.flexible.length){
const flexibleArt=
art[pick(assets.flexible)];

if(Math.random()<.5){
obstacle.topArt=flexibleArt;
}else{
obstacle.bottomArt=flexibleArt;
}
}

rocks.push(obstacle);
}

function addFloatingObstacle(start=650){
const zone=currentZone();
const assets=ASSETS.zones[zone.id];

if(
!assets.floating||
!assets.floating.length
){
return;
}

const imageName=
pick(assets.floating);

const image=art[imageName];

if(!image){
return;
}

const width=92;
const height=92;

const floating={
x:start,
y:150+Math.random()*(H-300),
width,
height,
image,
shard:false,
shardCollected:false
};

floatingObstacles.push(floating);
}

function floatingObstacleAllowed(){
const zone=currentZone();

return(
zone.id==="azure"&&
distance>=2000&&
distance<4000
);
}

function obstacleSpacingReady(){
if(!rocks.length){
return true;
}

const lastRock=
rocks[rocks.length-1];

return lastRock.x<340;
}

function floatingSpacingReady(){
if(!floatingObstacles.length){
return true;
}

const lastFloating=
floatingObstacles[
floatingObstacles.length-1
];

function triggerGameOver(){
if(!playing){

}

playing=false;

const canRevive=
checkpoint>0&&
!revivedThisRun&&
totalShards>=REVIVE_COST;

if(canRevive){
reviveText.innerHTML=`
You reached the
${checkpoint.toLocaleString()} m checkpoint.
<br><br>
Spend <b>${REVIVE_COST} saved Ember Shards</b>
<br>
to return to that checkpoint?
`;

reviveScreen.classList.remove("hidden");
return;
}

endFlight();
}

function endFlight(){

const finalDistance=
Math.floor(distance);

const finalShards=
Math.floor(runShards);

best=Math.max(
best,
finalDistance
);

totalShards+=finalShards;

recordFlight(

finalShards
);

save();
updateMenuText();

bestText.innerHTML+=`
<br><br>
Flight ended at
<b>${finalDistance.toLocaleString()} m</b>
<br>
Run Shards: <b>${finalShards}</b>
<br>

revivedThisRun=true;
distance=checkpoint;

bird={

y:H/2,
velocity:0,

};

rocks=[];
floatingObstacles=[];
trails=[];

arcanePulse=false;
pulseFlash=0;
sunfireGrace=false;
sunfireActive=false;
sunfireFlash=0;

playing=true;

function moveFloatingObstacles(scrollSpeed,dt){
for(const floating of floatingObstacles){
floating.x-=scrollSpeed*dt;

floating.y+=
Math.sin(seconds*2+floating.x*.02)*
9*
dt;

const birdDistance=Math.hypot(
bird.x-floating.x,
bird.y-floating.y
);

if(
birdDistance<
bird.radius+
floating.width*.32
){
if(sunfireActive){
floating.x=-220;
continue;
}

if(
equippedPhoenix==="azure"&&
stormShield
){
stormShield=false;
shieldFlash=.75;
floating.x=-220;
continue;
}

triggerGameOver();
return;
}
}

floatingObstacles=
floatingObstacles.filter(
floating=>floating.x+floating.width>-100
);
}

function loop(now){
if(!playing){
return;
}

const dt=Math.min(
.03,
(now-lastTime)/1000
);

lastTime=now;

seconds+=dt;
distance+=52*dt;

level=Math.min(
10,
Math.floor(distance/500)
);

const zone=currentZone();

if(zone.name!==activeZone){
activeZone=zone.name;
zoneFlash=2.6;
}

checkpointFlash=Math.max(
0,
checkpointFlash-dt
);

reviveSafety=Math.max(
0,
reviveSafety-dt
);

shieldFlash=Math.max(
0,
shieldFlash-dt
);

pulseFlash=Math.max(
0,
pulseFlash-dt
);

sunfireFlash=Math.max(
0,
sunfireFlash-dt
);

zoneFlash=Math.max(
0,
zoneFlash-dt
);

/*
Original gameplay physics:
hold to rise, release to glide.
*/
bird.velocity+=
(holding?-720:920)*
dt;

bird.velocity=Math.max(
-360,
Math.min(420,bird.velocity)
);

bird.y+=bird.velocity*dt;

for(const ember of embers){
ember.x-=ember.speed*dt;

ember.y+=
Math.sin(seconds*2+ember.drift)*
12*
dt;

if(ember.x<-8){
ember.x=W+8;
ember.y=Math.random()*H;
}
}

const trailColor=
P[equippedPhoenix].color;

trails.push({
x:bird.x-32,
y:bird.y+(Math.random()-.5)*18,
size:7+Math.random()*9,
life:.82,
maxLife:.82,
velocityX:-240-Math.random()*160,
velocityY:(Math.random()-.5)*45,
color:trailColor
});

trails=trails.filter(
trail=>{
trail.life-=dt;

trail.x+=trail.velocityX*dt;
trail.y+=trail.velocityY*dt;
trail.velocityY+=12*dt;

return trail.life>0&&trail.x>-70;
}
);

const nextCheckpoint=
checkpoint+
CHECKPOINT_DISTANCE;

const calm=
distance>=
nextCheckpoint-
CHECKPOINT_CALM_DISTANCE;

if(
reviveSafety<=0&&
!calm&&
!gate&&
obstacleSpacingReady()
){
addRock();
}

if(
floatingObstacleAllowed()&&
reviveSafety<=0&&
floatingSpacingReady()&&
Math.random()<.018
){
addFloatingObstacle();
}

const scrollSpeed=
Math.min(
265,
155+level*11
);

for(const rock of rocks){
rock.x-=scrollSpeed*dt;

if(
rock.shard&&
!rock.shardCollected
){
rock.shardX-=scrollSpeed*dt;

if(
equippedPhoenix==="verdant"
){
const dx=bird.x-rock.shardX;
const dy=bird.y-rock.shardY;
const shardDistance=
Math.hypot(dx,dy);

if(
shardDistance<MAGNET_RANGE&&
shardDistance>1
){
rock.shardX+=
(dx/shardDistance)*
MAGNET_PULL;

rock.shardY+=
(dy/shardDistance)*
MAGNET_PULL;
}
}

const shardDistance=
Math.hypot(
bird.x-rock.shardX,
bird.y-rock.shardY
);

if(
shardDistance<
bird.radius+14
){
rock.shardCollected=true;
runShards++;
}
}

const insideRockX=
bird.x+bird.radius>rock.x&&
bird.x-bird.radius<
rock.x+rock.width;

const outsideGap=
bird.y-bird.radius<rock.top||
bird.y+bird.radius>rock.bottom;

if(
reviveSafety<=0&&
insideRockX&&
outsideGap
){
if(
sunfireActive
){
rock.x=-220;
rock.shardX=-220;
continue;
}

if(
equippedPhoenix==="azure"&&
stormShield
){
stormShield=false;
shieldFlash=.75;
rock.x=-220;
rock.shardX=-220;
continue;
}

triggerGameOver();
return;
}
}

rocks=rocks.filter(
rock=>rock.x>-150
);

moveFloatingObstacles(
scrollSpeed,
dt
);

if(!playing){
return;
}

if(
!gate&&
distance>=
checkpoint+
CHECKPOINT_DISTANCE
){
gate={
x:W+50,
y:H/2,
radius:68,
value:checkpoint+
CHECKPOINT_DISTANCE,
pulse:0
};
}

if(gate){
gate.x-=scrollSpeed*dt;
gate.pulse+=dt;

if(
gate.x<bird.x&&
checkpoint<gate.value
){
checkpoint=gate.value;
runShards++;
checkpointFlash=2.6;

if(
checkpoint>highestCheckpoint
){
highestCheckpoint=checkpoint;
}

if(equippedPhoenix==="azure"){
stormShield=true;
shieldFlash=1.1;
}

if(equippedPhoenix==="violet"){
arcanePulse=true;
pulseFlash=.8;
}

if(equippedPhoenix==="solar"){
sunfireGrace=true;
}

save();
updateAbilityButton();

gate=null;
}

if(
gate&&
gate.x<-100
){
gate=null;
}
}

sunfireActive=false;

if(
bird.y-bird.radius<0||
bird.y+bird.radius>H
){
triggerGameOver();
return;
}

draw();

requestAnimationFrame(loop);
}

function mountains(

y,
height,
spacing,
speed
){
const offset=
(distance*speed)%spacing;

x.fillStyle=color;

x.beginPath();
x.moveTo(
-spacing-offset,
H
);

for(
let px=-spacing-offset;
px<W+spacing;
px+=spacing
){

x.lineTo(
px+spacing/2,
y-height
);
x.lineTo(
px+spacing,
y
);
}

x.lineTo(
W+spacing,
H
);

x.closePath();
x.fill();
}

function drawObstaclePiece(
image,
areaX,
areaY,
areaWidth,
areaHeight,
side,
zone
){
if(areaHeight<=0){
return;
}

x.save();

x.shadowColor=zone.edge;
x.shadowBlur=10;

if(image){
const ratio=
image.width/image.height;

let drawWidth=areaWidth;
let drawHeight=
drawWidth/ratio;

if(drawHeight>areaHeight){
drawHeight=areaHeight;
drawWidth=
drawHeight*ratio;
}

const drawX=
areaX+
(areaWidth-drawWidth)/2;

let drawY;

if(side==="top"){
drawY=
areaY+
areaHeight-
drawHeight;
}else{
drawY=areaY;
}

x.drawImage(
image,
drawX,
drawY,
drawWidth,
drawHeight
);
}else{
drawFallbackObstacle(
areaX,
areaY,
areaWidth,
areaHeight,
side,
zone
);
}

x.restore();
}

function drawFallbackObstacle(
areaX,
areaY,
areaWidth,
areaHeight,
side,
zone
){
const gradient=x.createLinearGradient(
areaX,
areaY,
areaX+areaWidth,
areaY+areaHeight
);

gradient.addColorStop(
0,
zone.edge
);

gradient.addColorStop(
.3,
zone.rock
);

gradient.addColorStop(
1,
"#080914"
);

x.fillStyle=gradient;

x.beginPath();

if(side==="top"){
x.moveTo(areaX,areaY);
x.lineTo(
areaX+areaWidth,
areaY
);

x.lineTo(
areaX+areaWidth,
areaY+areaHeight*.88
);

x.lineTo(
areaX+areaWidth*.67,
areaY+areaHeight
);

x.lineTo(
areaX+areaWidth*.3,
areaY+areaHeight*.78
);

x.lineTo(
areaX,
areaY+areaHeight
);
}else{
x.moveTo(
areaX,
areaY+areaHeight
);

x.lineTo(
areaX+areaWidth,
areaY+areaHeight
);

x.lineTo(
areaX+areaWidth,
areaY+areaHeight*.12
);

x.lineTo(
areaX+areaWidth*.67,
areaY
);

x.lineTo(
areaX+areaWidth*.3,
areaY+areaHeight*.2
);

x.lineTo(
areaX,
areaY
);
}

x.closePath();
x.fill();
}

x.textAlign="center";
x.fillStyle="#ffd15c";
x.shadowBlur=18;
x.shadowColor="#ff9b2f";
x.font="bold 24px Arial";

x.fillText(
"CHECKPOINT "+
checkpoint.toLocaleString()+" m",
W/2,
120
);

x.font="bold 16px Arial";
x.fillText(
"1 EMBER SHARD",
W/2,
147
);

if(equippedPhoenix==="azure"){
x.fillStyle="#67e7ff";

x.fillText(
"STORM SHIELD CHARGED",
W/2,
172
);
}

if(equippedPhoenix==="violet"){
x.fillStyle="#c879ff";

x.fillText(
"ARCANE PULSE CHARGED",
W/2,
172
);
}

if(equippedPhoenix==="solar"){
x.fillStyle="#ffd15c";

x.fillText(
"SUNFIRE GRACE CHARGED",
W/2,
172
);
}

x.restore();
}

if(zoneFlash>0){
x.save();

const alpha=
Math.min(
1,
zoneFlash/2.6
);

x.globalAlpha=alpha;
x.textAlign="center";
x.fillStyle=zone.edge;
x.shadowBlur=20;
x.shadowColor=zone.edge;
x.font="bold 27px Arial";

x.fillText(
activeZone,
W/2,
218
);

x.shadowBlur=0;
x.fillStyle="#fff";
x.font="16px Arial";

if(activeZone==="AZURE PEAKS"){
x.fillText(
"Stormborn heights rise ahead",
W/2,
245
);
}

if(activeZone==="VERDANT WILDS"){
x.fillText(
"Where emerald flames awaken",
W/2,
245
);
}

if(activeZone==="CELESTIAL RUINS"){
x.fillText(
"Ancient stars guard the heavens",
W/2,
245
);
}

x.restore();
}

if(
rebirthTimer>0
){
x.save();

x.textAlign="center";
x.fillStyle="#67e7ff";
x.shadowBlur=18;
x.shadowColor="#36dfff";
x.font="bold 27px Arial";

x.fillText(
"PHOENIX REBORN",
W/2,
190
);

x.shadowBlur=0;
x.fillStyle="#ffd15c";
x.font="bold 16px Arial";

x.fillText(
"A second flame takes flight",
W/2,
217
);

x.restore();
}
}

function draw(){
const zone=currentZone();

const sky=x.createLinearGradient(
0,
0,
0,
H
);

sky.addColorStop(
0,
zone.top
);

sky.addColorStop(
.48,
zone.mid
);

sky.addColorStop(
1,
zone.bottom
);

x.fillStyle=sky;
x.fillRect(
0,
0,
W,
H
);

drawZoneMap(zone);
drawEmbers(zone);
drawRocks(zone);
drawFloatingObstacles();
drawGate(zone);
drawTrails();
drawBird();
drawHud(zone);
}

function showMenu(){
playing=false;
holding=false;

reviveScreen.classList.add("hidden");
roost.classList.add("hidden");
leaderboardScreen.classList.add("hidden");

menu.classList.remove("hidden");

updateMenuText();
}

window.addEventListener(
"load",
()=>{
loadAllArtwork().then(
()=>{
showMenu();
}
);
}
);

showMenu();
</script>
