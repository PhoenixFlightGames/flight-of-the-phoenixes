<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080914;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}

.screen{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px;
  color:#fff;
  text-align:center;
  background:rgba(8,9,20,.94);
}

.hidden{
  display:none!important;
}

h1{
  margin:0 0 20px;
  color:#ffc65a;
  font-size:39px;
  line-height:1.12;
  text-shadow:0 0 20px #f05224;
}

p{
  max-width:365px;
  color:#e1dbe5;
  font-size:17px;
  line-height:1.45;
}

button{
  width:min(360px,86vw);
  margin:8px 0;
  padding:16px;
  border:2px solid #ffc65a;
  border-radius:14px;
  background:#592540;
  color:#fff;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.roost,
.leaderboard-list{
  width:min(390px,92vw);
  max-height:64vh;
  overflow:auto;
}

.shards{
  color:#ffd15c;
  font-size:22px;
  font-weight:bold;
}

.card{
  margin:9px 0;
  padding:14px;
  border:1px solid #744357;
  border-radius:12px;
  background:#221522;
  text-align:left;
}

.card.equipped{
  background:#402033;
}

.card button{
  width:100%;
  margin:10px 0 0;
  padding:10px;
  font-size:16px;
}

.preview{
  display:inline-block;
  width:17px;
  height:17px;
  margin-right:7px;
  border-radius:50%;
  vertical-align:-3px;
}

.revive-title{
  color:#67e7ff;
  text-shadow:0 0 20px #36dfff;
}

.revive-button,
.leaderboard-button{
  border-color:#67e7ff;
  background:#164c68;
}

.end-button{
  border-color:#a87d92;
  background:#392333;
}

.ability-button{
  position:fixed;
  right:18px;
  bottom:28px;
  z-index:8;
  width:112px;
  height:112px;
  margin:0;
  padding:10px;
  border:3px solid #c879ff;
  border-radius:50%;
  background:radial-gradient(circle,#5a267c,#231329);
  color:#fff;
  font-size:14px;
  line-height:1.15;
  box-shadow:0 0 24px #9e4bff;
}

.ability-button.solar{
  border-color:#ffd15c;
  background:radial-gradient(circle,#a95718,#4d2415);
  box-shadow:0 0 24px #ffb62f;
}

/* Local leaderboard */

.leaderboard-title{
  color:#67e7ff;
  text-shadow:0 0 20px #36dfff;
}

.leaderboard-subtitle{
  margin:0 0 14px;
  color:#b8ddeb;
  font-size:15px;
}

.leaderboard-row{
  display:grid;
  grid-template-columns:38px 1fr auto;
  gap:10px;
  align-items:center;
  margin:8px 0;
  padding:12px;
  border:1px solid #3f657d;
  border-radius:12px;
  background:#122032;
  text-align:left;
}

.leaderboard-row.first{
  border-color:#ffd15c;
  background:linear-gradient(135deg,#3d2d18,#201925);
  box-shadow:0 0 16px rgba(255,209,92,.22);
}

.leaderboard-rank{
  color:#ffd15c;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

.leaderboard-distance{
  color:#fff;
  font-size:18px;
  font-weight:bold;
}

.leaderboard-detail{
  margin-top:4px;
  color:#b9c9d7;
  font-size:12px;
  line-height:1.35;
}

.leaderboard-phoenix{
  font-size:13px;
  font-weight:bold;
  text-align:right;
}

.leaderboard-empty{
  padding:20px 10px;
  color:#b8ddeb;
  font-size:17px;
  line-height:1.45;
}
</style>
</head>

<body>

<canvas id="game" width="420" height="760"></canvas>

<button
  id="abilityButton"
  class="ability-button hidden"
  onclick="useAbility()"
>
ABILITY
</button>

<div id="menu" class="screen">
<h1>FLIGHT OF THE<br>PHOENIXES</h1>

<p>
Hold to rise. Release to glide.<br>
Avoid volcanic rock and collect Ember Shards.
</p>

<button onclick="startGame()">Endless Flight</button>
<button onclick="openRoost()">Phoenix Roost</button>
<button class="leaderboard-button" onclick="openLeaderboard()">
Top Flights
</button>

<p id="bestText"></p>
</div>

<div id="roost" class="screen hidden">
<h1>PHOENIX ROOST</h1>

<p class="shards" id="roostShards"></p>

<div class="roost" id="phoenixList"></div>

<button onclick="closeRoost()">Back to Flight</button>
</div>

<div id="leaderboardScreen" class="screen hidden">
<h1 class="leaderboard-title">TOP FLIGHTS</h1>

<p class="leaderboard-subtitle">
Your best 10 completed flights on this device.
</p>

<div class="leaderboard-list" id="leaderboardList"></div>

<button onclick="closeLeaderboard()">Back to Flight</button>
</div>

<div id="reviveScreen" class="screen hidden">
<h1 class="revive-title">PHOENIX FALLEN</h1>

<p id="reviveText"></p>

<button class="revive-button" onclick="reviveFlight()">
Revive for 15 Shards
</button>

<button class="end-button" onclick="endFlight()">
End Flight
</button>
</div>

<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

const W = 420;
const H = 760;

const CHECKPOINT_DISTANCE = 1000;
const CHECKPOINT_CALM_DISTANCE = 220;
const REVIVE_COST = 15;
const MAGNET_RANGE = 80;
const MAGNET_PULL = 3.2;

const menu = document.getElementById("menu");
const roost = document.getElementById("roost");
const reviveScreen = document.getElementById("reviveScreen");
const reviveText = document.getElementById("reviveText");
const bestText = document.getElementById("bestText");
const roostShards = document.getElementById("roostShards");
const phoenixList = document.getElementById("phoenixList");
const abilityButton = document.getElementById("abilityButton");

const leaderboardScreen = document.getElementById("leaderboardScreen");
const leaderboardList = document.getElementById("leaderboardList");

const LEADERBOARD_KEY = "phoenixLocalLeaderboardV1";

const ASSETS = {
  phoenix: {
    ember: "IMG_3899.png",
    azure: "IMG_3902.png",
    verdant: "IMG_3903.png",
    violet: "IMG_3904.png",
    solar: "IMG_3905.png"
  },

  obstacles: {
    ember: {
      top: ["IMG_3885.jpeg", "IMG_3886.png"],
      bottom: ["IMG_3887.png", "IMG_3888.png"]
    },

    azure: {
      top: ["IMG_3889.png", "IMG_3890.png"],
      bottom: ["IMG_3891.png", "IMG_3892.png"]
    },

    verdant: {
      top: ["IMG_3895.png", "IMG_3896.png"],
      bottom: ["IMG_3897.png", "IMG_3898.png"]
    }
  }
};

const P = {
  ember: {
    name: "Ember Phoenix",
    sub: "Starter Phoenix — orange flame",
    color: "#ff8a35",
    shadow: "#ff542f",
    cost: 0
  },

  azure: {
    name: "Azure Phoenix",
    sub: "Stormborn feathers and a checkpoint Storm Shield",
    color: "#67e7ff",
    shadow: "#36dfff",
    cost: 25
  },

  verdant: {
    name: "Verdant Phoenix",
    sub: "Wildfire plumage and Ember Magnet",
    color: "#62f58c",
    shadow: "#56f58a",
    cost: 50
  },

  violet: {
    name: "Violet Phoenix",
    sub: "Arcane flame and player-triggered Arcane Pulse",
    color: "#c879ff",
    shadow: "#9e4bff",
    cost: 100
  },

  solar: {
    name: "Solar Phoenix",
    sub: "Sunfire wings and player-triggered Sunfire Grace",
    color: "#ffd15c",
    shadow: "#ff9b2f",
    cost: 175
  }
};

let playing = false;
let holding = false;

let bird;
let rocks = [];
let embers = [];
let trails = [];
let gate = null;

let distance = 0;
let seconds = 0;
let level = 0;
let runShards = 0;
let lastTime = 0;

let checkpoint = 0;
let checkpointFlash = 0;

let revivedThisRun = false;
let reviveSafety = 0;

let rebirthTimer = 0;
let rebirthParticles = [];

let stormShield = false;
let shieldFlash = 0;

let arcanePulse = false;
let pulseFlash = 0;

let sunfireGrace = false;
let sunfireActive = false;
let sunfireFlash = 0;

let zoneFlash = 0;
let activeZone = "EMBER CAVERNS";

let best = Number(localStorage.getItem("phoenixBest")) || 0;
let totalShards = Number(localStorage.getItem("phoenixShards")) || 0;

let highestCheckpoint =
  Number(localStorage.getItem("phoenixHighestCheckpoint")) || 0;

let azureUnlocked =
  localStorage.getItem("azureUnlocked") === "true";

let verdantUnlocked =
  localStorage.getItem("verdantUnlocked") === "true";

let violetUnlocked =
  localStorage.getItem("violetUnlocked") === "true";

let solarUnlocked =
  localStorage.getItem("solarUnlocked") === "true";

let equippedPhoenix =
  localStorage.getItem("equippedPhoenix") || "ember";

let leaderboard = loadLeaderboard();

const art = {};
let artworkReady = false;

if (
  (equippedPhoenix === "azure" && !azureUnlocked) ||
  (equippedPhoenix === "verdant" && !verdantUnlocked) ||
  (equippedPhoenix === "violet" && !violetUnlocked) ||
  (equippedPhoenix === "solar" && !solarUnlocked)
) {
  equippedPhoenix = "ember";
}

function unlocked(key) {
  return (
    key === "ember" ||
    (key === "azure" && azureUnlocked) ||
    (key === "verdant" && verdantUnlocked) ||
    (key === "violet" && violetUnlocked) ||
    (key === "solar" && solarUnlocked)
  );
}

function loadLeaderboard() {
  try {
    const saved = JSON.parse(localStorage.getItem(LEADERBOARD_KEY));
    return Array.isArray(saved) ? saved : [];
  } catch {
    return [];
  }
}

function saveLeaderboard() {
  localStorage.setItem(
    LEADERBOARD_KEY,
    JSON.stringify(leaderboard)
  );
}

function pick(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function removeWhiteBackground(image) {
  const output = document.createElement("canvas");
  const outputContext = output.getContext("2d", {
    willReadFrequently: true
  });

  output.width = image.naturalWidth || image.width;
  output.height = image.naturalHeight || image.height;

  outputContext.drawImage(image, 0, 0);

  const pixels = outputContext.getImageData(
    0,
    0,
    output.width,
    output.height
  );

  for (let i = 0; i < pixels.data.length; i += 4) {
    const red = pixels.data[i];
    const green = pixels.data[i + 1];
    const blue = pixels.data[i + 2];

    const brightness = (red + green + blue) / 3;
    const range =
      Math.max(red, green, blue) - Math.min(red, green, blue);

    if (brightness > 235 && range < 28) {
      pixels.data[i + 3] = 0;
    }
  }

  outputContext.putImageData(pixels, 0, 0);

  return output;
}

function loadArtworkFile(filename) {
  return new Promise(resolve => {
    const image = new Image();

    image.onload = () => {
      art[filename] = removeWhiteBackground(image);
      resolve();
    };

    image.onerror = () => {
      console.warn("Artwork could not load:", filename);
      art[filename] = null;
      resolve();
    };

    image.src = filename;
  });
}

async function loadArtwork() {
  const filenames = [
    ...Object.values(ASSETS.phoenix),

    ...ASSETS.obstacles.ember.top,
    ...ASSETS.obstacles.ember.bottom,

    ...ASSETS.obstacles.azure.top,
    ...ASSETS.obstacles.azure.bottom,

    ...ASSETS.obstacles.verdant.top,
    ...ASSETS.obstacles.verdant.bottom
  ];

  await Promise.all(
    [...new Set(filenames)].map(loadArtworkFile)
  );

  artworkReady = true;
}

function currentZone() {
  if (distance >= 4000) {
    return {
      id: "verdant",
      name: "VERDANT WILDS",
      top: "#123826",
      mid: "#0b2018",
      bottom: "#06110d",
      m1: "#10271c",
      m2: "#163b27",
      m3: "#1d5131",
      particle: "#69ff9a",
      rock: "#173126",
      edge: "#72f59b"
    };
  }

  if (distance >= 2000) {
    return {
      id: "azure",
      name: "AZURE PEAKS",
      top: "#10284b",
      mid: "#0b1733",
      bottom: "#060a18",
      m1: "#0b1d36",
      m2: "#102b48",
      m3: "#183a55",
      particle: "#55ddff",
      rock: "#172a3c",
      edge: "#65dfff"
    };
  }

  return {
    id: "ember",
    name: "EMBER CAVERNS",
    top: "#35122f",
    mid: "#1a1022",
    bottom: "#080914",
    m1: "#1d1422",
    m2: "#281522",
    m3: "#351821",
    particle: "#ff7040",
    rock: "#241820",
    edge: "#ff8035"
  };
}

function save() {
  localStorage.setItem("phoenixBest", best);
  localStorage.setItem("phoenixShards", totalShards);

  localStorage.setItem(
    "phoenixHighestCheckpoint",
    highestCheckpoint
  );

  localStorage.setItem("azureUnlocked", azureUnlocked);
  localStorage.setItem("verdantUnlocked", verdantUnlocked);
  localStorage.setItem("violetUnlocked", violetUnlocked);
  localStorage.setItem("solarUnlocked", solarUnlocked);

  localStorage.setItem("equippedPhoenix", equippedPhoenix);
}

function updateMenuText() {
  bestText.innerHTML = `
    Best: ${best.toLocaleString()} m<br>
    Highest checkpoint:
    ${
      highestCheckpoint
        ? highestCheckpoint.toLocaleString() + " m"
        : "Not reached"
    }
  `;
}

function dot(color) {
  return `
    <span
      class="preview"
      style="background:${color};box-shadow:0 0 12px ${color}"
    ></span>
  `;
}

loadArtwork();
updateMenuText();
function openRoost() {
  renderRoost();

  menu.classList.add("hidden");
  leaderboardScreen.classList.add("hidden");
  roost.classList.remove("hidden");
}

function closeRoost() {
  roost.classList.add("hidden");
  menu.classList.remove("hidden");
}

function phoenixCard(key) {
  const phoenix = P[key];
  const active = equippedPhoenix === key;

  if (!unlocked(key)) {
    return `
      <div class="card">
        <strong style="color:${phoenix.color}">
          ${dot(phoenix.color)}${phoenix.name}
        </strong><br>

        ${phoenix.sub}

        <button onclick="unlockPhoenix('${key}')">
          Unlock for ${phoenix.cost} Shards
        </button>
      </div>
    `;
  }

  return `
    <div class="card ${active ? "equipped" : ""}">
      <strong style="color:${phoenix.color}">
        ${dot(phoenix.color)}${phoenix.name}
      </strong><br>

      ${phoenix.sub}<br>
      ${active ? "Equipped" : "Unlocked"}

      ${
        active
          ? ""
          : `
            <button onclick="equipPhoenix('${key}')">
              Equip ${phoenix.name}
            </button>
          `
      }
    </div>
  `;
}

function renderRoost() {
  roostShards.textContent = "Ember Shards: " + totalShards;

  phoenixList.innerHTML = `
    ${phoenixCard("ember")}
    ${phoenixCard("azure")}
    ${phoenixCard("verdant")}
    ${phoenixCard("violet")}
    ${phoenixCard("solar")}
  `;
}

function unlockPhoenix(key) {
  const phoenix = P[key];

  if (totalShards < phoenix.cost) {
    alert("You need " + phoenix.cost + " Ember Shards.");
    return;
  }

  totalShards -= phoenix.cost;

  if (key === "azure") azureUnlocked = true;
  if (key === "verdant") verdantUnlocked = true;
  if (key === "violet") violetUnlocked = true;
  if (key === "solar") solarUnlocked = true;

  equippedPhoenix = key;

  save();
  renderRoost();
  updateMenuText();
}

function equipPhoenix(key) {
  if (!unlocked(key)) return;

  equippedPhoenix = key;

  save();
  renderRoost();
  updateMenuText();
}

function openLeaderboard() {
  roost.classList.add("hidden");
  menu.classList.add("hidden");

  renderLeaderboard();
  leaderboardScreen.classList.remove("hidden");
}

function closeLeaderboard() {
  leaderboardScreen.classList.add("hidden");
  menu.classList.remove("hidden");
}

function renderLeaderboard() {
  if (!leaderboard.length) {
    leaderboardList.innerHTML = `
      <div class="leaderboard-empty">
        No completed flights yet.<br>
        Start an Endless Flight to set your first record.
      </div>
    `;
    return;
  }

  leaderboardList.innerHTML = leaderboard
    .map((entry, index) => {
      const phoenix = P[entry.phoenix] || P.ember;

      return `
        <div class="leaderboard-row ${index === 0 ? "first" : ""}">
          <div class="leaderboard-rank">#${index + 1}</div>

          <div>
            <div class="leaderboard-distance">
              ${entry.distance.toLocaleString()} m
            </div>

            <div class="leaderboard-detail">
              +${entry.shards} Shards · ${entry.date}
            </div>
          </div>

          <div
            class="leaderboard-phoenix"
            style="color:${phoenix.color}"
          >
            ${phoenix.name.replace(" Phoenix", "")}
          </div>
        </div>
      `;
    })
    .join("");
}

function recordFlight(finalDistance, shardCount) {
  if (finalDistance < 1) return;

  leaderboard.push({
    distance: finalDistance,
    shards: shardCount,
    phoenix: equippedPhoenix,
    date: new Date().toLocaleDateString()
  });

  leaderboard.sort((a, b) => b.distance - a.distance);

  leaderboard = leaderboard.slice(0, 10);

  saveLeaderboard();
}

function makeEmbers() {
  return Array.from({ length: 42 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 1 + Math.random() * 2.5,
    speed: 14 + Math.random() * 32,
    drift: Math.random() * 7
  }));
}

function updateAbilityButton() {
  abilityButton.classList.add("hidden");
  abilityButton.classList.remove("solar");

  if (!playing) return;

  if (equippedPhoenix === "violet" && arcanePulse) {
    abilityButton.textContent = "ARCANE\nPULSE";
    abilityButton.classList.remove("hidden");
  }

  if (equippedPhoenix === "solar" && sunfireGrace) {
    abilityButton.textContent = "SUNFIRE\nGRACE";
    abilityButton.classList.add("solar");
    abilityButton.classList.remove("hidden");
  }
}

function useAbility() {
  if (!playing) return;

  if (equippedPhoenix === "violet" && arcanePulse) {
    const target = rocks.find(
      rock => rock.x + rock.width > bird.x + 15
    );

    if (target) {
      arcanePulse = false;
      pulseFlash = 0.95;

      target.x = -220;
      target.shardX = -220;

      updateAbilityButton();
    }
  }

  if (equippedPhoenix === "solar" && sunfireGrace) {
    sunfireGrace = false;
    sunfireActive = true;
    sunfireFlash = 0.9;

    updateAbilityButton();
  }
}

function startGame() {
  playing = true;
  holding = false;

  bird = {
    x: 95,
    y: 380,
    velocity: 0,
    radius: 25
  };

  rocks = [];
  embers = makeEmbers();
  trails = [];
  gate = null;

  distance = 0;
  seconds = 0;
  level = 0;
  runShards = 0;

  checkpoint = 0;
  checkpointFlash = 0;

  revivedThisRun = false;
  reviveSafety = 0;

  rebirthTimer = 0;
  rebirthParticles = [];

  stormShield = false;
  shieldFlash = 0;

  arcanePulse = false;
  pulseFlash = 0;

  sunfireGrace = false;
  sunfireActive = false;
  sunfireFlash = 0;

  zoneFlash = 0;
  activeZone = "EMBER CAVERNS";

  lastTime = performance.now();

  addRock(720);

  menu.classList.add("hidden");
  leaderboardScreen.classList.add("hidden");

  updateAbilityButton();

  requestAnimationFrame(loop);
}

function addRock(start = 660) {
  const zone = currentZone();
  const artwork = ASSETS.obstacles[zone.id];

  let gap = Math.max(150, 220 - level * 7);

  let min = gap / 2 + 45;
  let max = H - gap / 2 - 45;

  let middle = min + Math.random() * (max - min);

  if (distance >= 5000 && Math.random() < 0.26) {
    gap = Math.max(140, gap - 18);
    middle = H / 2 + (Math.random() - 0.5) * 35;
  } else if (distance >= 3000 && Math.random() < 0.30) {
    middle = H * 0.69 + Math.random() * 70;
  } else if (distance >= 2000 && Math.random() < 0.32) {
    middle = H * 0.20 + Math.random() * 70;
  }

  middle = Math.max(
    gap / 2 + 45,
    Math.min(H - gap / 2 - 45, middle)
  );

  const width = 118;
  const top = middle - gap / 2;
  const bottom = middle + gap / 2;

  rocks.push({
    x: start,
    width,
    top,
    bottom,

    /* The image pair is selected once, here. */
    zoneId: zone.id,
    topArt: art[pick(artwork.top)],
    bottomArt: art[pick(artwork.bottom)],

    shard: Math.random() < 0.35,
    shardX: start + width / 2,
    shardY: top + 42 + Math.random() * (gap - 84),
    shardCollected: false
  });
}

function triggerGameOver() {
  if (!playing) return;

  playing = false;

  updateAbilityButton();

  const canRevive =
    checkpoint > 0 &&
    !revivedThisRun &&
    totalShards >= REVIVE_COST;

  if (canRevive) {
    reviveText.innerHTML = `
      You reached the ${checkpoint.toLocaleString()} m checkpoint.<br><br>

      Spend <b>${REVIVE_COST} saved Ember Shards</b><br>
      to return to that checkpoint?
    `;

    reviveScreen.classList.remove("hidden");
    return;
  }

  endFlight();
}

function endFlight() {
  reviveScreen.classList.add("hidden");

  updateAbilityButton();

  const finalDistance = Math.floor(distance);
  const collectedShards = runShards;

  best = Math.max(best, finalDistance);
  totalShards += collectedShards;

  recordFlight(finalDistance, collectedShards);

  save();
  updateMenuText();

  bestText.innerHTML += `
    <br><br>
    Flight ended at <b>${finalDistance.toLocaleString()} m</b><br>
    Run Shards: <b>${collectedShards}</b><br>
    Total Shards: ${totalShards}
  `;

  menu.classList.remove("hidden");
}

function reviveFlight() {
  if (totalShards < REVIVE_COST) return;

  totalShards -= REVIVE_COST;
  revivedThisRun = true;

  distance = checkpoint;

  bird = {
    x: 95,
    y: H / 2,
    velocity: 0,
    radius: 25
  };

  rocks = [];
  trails = [];
  gate = null;

  reviveSafety = 1.8;
  rebirthTimer = 2.5;
  rebirthParticles = [];

  stormShield = false;
  shieldFlash = 0;

  arcanePulse = false;
  pulseFlash = 0;

  sunfireGrace = false;
  sunfireActive = false;
  sunfireFlash = 0;

  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const particleSpeed = 70 + Math.random() * 170;

    rebirthParticles.push({
      x: bird.x,
      y: bird.y,
      velocityX: Math.cos(angle) * particleSpeed,
      velocityY: Math.sin(angle) * particleSpeed,
      size: 3 + Math.random() * 5,
      life: 0.9 + Math.random() * 0.7,
      maxLife: 1.6,
      color: i % 2 === 0 ? "#67e7ff" : "#ffd15c"
    });
  }

  playing = true;
  holding = false;

  lastTime = performance.now();

  save();

  reviveScreen.classList.add("hidden");

  updateAbilityButton();

  requestAnimationFrame(loop);
}
function loop(now) {
  if (!playing) return;

  const dt = Math.min(0.03, (now - lastTime) / 1000);
  lastTime = now;

  seconds += dt;
  distance += 52 * dt;

  level = Math.min(10, Math.floor(distance / 500));

  const zone = currentZone();

  if (zone.name !== activeZone) {
    activeZone = zone.name;
    zoneFlash = 2.6;
  }

  checkpointFlash = Math.max(0, checkpointFlash - dt);
  reviveSafety = Math.max(0, reviveSafety - dt);
  rebirthTimer = Math.max(0, rebirthTimer - dt);
  shieldFlash = Math.max(0, shieldFlash - dt);
  pulseFlash = Math.max(0, pulseFlash - dt);
  sunfireFlash = Math.max(0, sunfireFlash - dt);
  zoneFlash = Math.max(0, zoneFlash - dt);

  rebirthParticles = rebirthParticles.filter(particle => {
    particle.life -= dt;

    particle.x += particle.velocityX * dt;
    particle.y += particle.velocityY * dt;

    particle.velocityX *= 0.96;
    particle.velocityY *= 0.96;
    particle.velocityY += 18 * dt;

    return particle.life > 0;
  });

  const nextCheckpoint = checkpoint + CHECKPOINT_DISTANCE;

  const calm =
    distance >= nextCheckpoint - CHECKPOINT_CALM_DISTANCE;

  /*
    ORIGINAL FLIGHT FEEL:
    hold = rise, release = glide/fall
  */
  bird.velocity += (holding ? -720 : 920) * dt;
  bird.velocity = Math.max(
    -360,
    Math.min(420, bird.velocity)
  );

  bird.y += bird.velocity * dt;

  for (const ember of embers) {
    ember.x -= ember.speed * dt;
    ember.y += Math.sin(seconds * 2 + ember.drift) * 12 * dt;

    if (ember.x < -8) {
      ember.x = W + 8;
      ember.y = Math.random() * H;
    }
  }

  const trailColor = P[equippedPhoenix].color;

  trails.push({
    x: bird.x - 32,
    y: bird.y + (Math.random() - 0.5) * 18,
    size: 7 + Math.random() * 9,
    life: 0.82,
    maxLife: 0.82,
    velocityX: -240 - Math.random() * 160,
    velocityY: (Math.random() - 0.5) * 45,
    color: trailColor
  });

  trails = trails.filter(trail => {
    trail.life -= dt;

    trail.x += trail.velocityX * dt;
    trail.y += trail.velocityY * dt;
    trail.velocityY += 12 * dt;

    return trail.life > 0 && trail.x > -70;
  });

  /*
    Spawn only when the latest obstacle is far enough left.
    This preserves the original spacing and avoids overlap.
  */
  if (
    reviveSafety <= 0 &&
    !calm &&
    !gate &&
    (
      rocks.length === 0 ||
      rocks[rocks.length - 1].x < 340
    )
  ) {
    addRock();
  }

  const scrollSpeed = Math.min(265, 155 + level * 11);

  for (const rock of rocks) {
    rock.x -= scrollSpeed * dt;

    if (
      equippedPhoenix === "violet" &&
      arcanePulse &&
      rock.x < 340
    ) {
      arcanePulse = false;
      pulseFlash = 0.9;

      rock.x = -220;
      rock.shardX = -220;

      updateAbilityButton();
      continue;
    }

    if (rock.shard && !rock.shardCollected) {
      rock.shardX -= scrollSpeed * dt;

      if (equippedPhoenix === "verdant") {
        const dx = bird.x - rock.shardX;
        const dy = bird.y - rock.shardY;
        const shardDistance = Math.hypot(dx, dy);

        if (shardDistance < MAGNET_RANGE && shardDistance > 1) {
          rock.shardX += (dx / shardDistance) * MAGNET_PULL;
          rock.shardY += (dy / shardDistance) * MAGNET_PULL;
        }
      }

      const shardDistance = Math.hypot(
        bird.x - rock.shardX,
        bird.y - rock.shardY
      );

      if (shardDistance < bird.radius + 18) {
        rock.shardCollected = true;
        runShards++;
      }
    }

    const insideRockX =
      bird.x + bird.radius > rock.x &&
      bird.x - bird.radius < rock.x + rock.width;

    const outsideGap =
      bird.y - bird.radius < rock.top ||
      bird.y + bird.radius > rock.bottom;

    const protectedBySunfire =
      equippedPhoenix === "solar" &&
      sunfireActive;

    if (
      reviveSafety <= 0 &&
      !protectedBySunfire &&
      insideRockX &&
      outsideGap
    ) {
      if (
        equippedPhoenix === "azure" &&
        stormShield
      ) {
        stormShield = false;
        shieldFlash = 0.85;

        rock.x = -220;
        rock.shardX = -220;
      } else {
        triggerGameOver();
        return;
      }
    }
  }

  /*
    A pair stays alive until both its top and bottom artwork
    have fully moved beyond the left edge.
  */
  rocks = rocks.filter(
    rock => rock.x + rock.width > -150
  );

  if (
    bird.y - bird.radius < 0 ||
    bird.y + bird.radius > H
  ) {
    triggerGameOver();
    return;
  }

  if (
    !gate &&
    distance >= checkpoint + CHECKPOINT_DISTANCE
  ) {
    gate = {
      x: W + 80,
      passed: false
    };
  }

  if (gate) {
    gate.x -= scrollSpeed * dt;

    if (!gate.passed && gate.x < bird.x) {
      gate.passed = true;

      checkpoint += CHECKPOINT_DISTANCE;
      highestCheckpoint = Math.max(
        highestCheckpoint,
        checkpoint
      );

      checkpointFlash = 1.1;
      runShards++;

      if (equippedPhoenix === "azure") {
        stormShield = true;
      }

      if (equippedPhoenix === "violet") {
        arcanePulse = true;
      }

      if (equippedPhoenix === "solar") {
        sunfireGrace = true;
      }

      updateAbilityButton();
      save();
    }

    if (gate.x < -130) {
      gate = null;
    }
  }

  if (sunfireActive) {
    sunfireActive = false;
  }

  draw();

  requestAnimationFrame(loop);
}

c.addEventListener(
  "touchstart",
  event => {
    event.preventDefault();

    if (playing) {
      holding = true;
    }
  },
  { passive: false }
);

c.addEventListener(
  "touchend",
  event => {
    event.preventDefault();
    holding = false;
  },
  { passive: false }
);

c.addEventListener("touchcancel", () => {
  holding = false;
});

c.addEventListener("mousedown", () => {
  if (playing) {
    holding = true;
  }
});

window.addEventListener("mouseup", () => {
  holding = false;
});

window.addEventListener("blur", () => {
  holding = false;
});
function draw() {
  const zone = currentZone();

  const sky = x.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, zone.top);
  sky.addColorStop(0.55, zone.mid);
  sky.addColorStop(1, zone.bottom);

  x.fillStyle = sky;
  x.fillRect(0, 0, W, H);

  drawBackground(zone);
  drawEmbers(zone);
  drawRocks(zone);
  drawGate(zone);
  drawTrails();
  drawBird();
  drawRebirthParticles();
  drawHud(zone);
}

function drawBackground(zone) {
  x.save();

  x.globalAlpha = 0.45;
  x.fillStyle = zone.m1;

  for (let i = 0; i < 5; i++) {
    const mountainX =
      ((i * 120 - seconds * 18) % (W + 140)) - 80;

    x.beginPath();
    x.moveTo(mountainX, H);
    x.lineTo(mountainX + 75, H - 155 - i * 18);
    x.lineTo(mountainX + 150, H);
    x.closePath();
    x.fill();
  }

  x.globalAlpha = 0.42;
  x.fillStyle = zone.m2;

  for (let i = 0; i < 4; i++) {
    const mountainX =
      ((i * 155 - seconds * 31) % (W + 180)) - 100;

    x.beginPath();
    x.moveTo(mountainX, H);
    x.lineTo(mountainX + 95, H - 105 - i * 16);
    x.lineTo(mountainX + 190, H);
    x.closePath();
    x.fill();
  }

  x.globalAlpha = 0.28;
  x.fillStyle = zone.m3;

  for (let i = 0; i < 3; i++) {
    const mountainX =
      ((i * 210 - seconds * 48) % (W + 250)) - 120;

    x.beginPath();
    x.moveTo(mountainX, H);
    x.lineTo(mountainX + 125, H - 70 - i * 17);
    x.lineTo(mountainX + 250, H);
    x.closePath();
    x.fill();
  }

  x.restore();

  if (zoneFlash > 0) {
    x.save();

    x.globalAlpha = Math.min(0.32, zoneFlash * 0.15);
    x.fillStyle = zone.particle;
    x.fillRect(0, 0, W, H);

    x.restore();
  }
}

function drawEmbers(zone) {
  x.save();

  for (const ember of embers) {
    x.globalAlpha = 0.48 + Math.sin(seconds * 3 + ember.drift) * 0.2;

    x.fillStyle = zone.particle;
    x.shadowColor = zone.particle;
    x.shadowBlur = 11;

    x.beginPath();
    x.arc(ember.x, ember.y, ember.size, 0, Math.PI * 2);
    x.fill();
  }

  x.restore();
}

function drawRocks(zone) {
  for (const rock of rocks) {
    drawObstacleImage(
      rock.topArt,
      rock.x,
      0,
      rock.width,
      rock.top,
      "top",
      zone
    );

    drawObstacleImage(
      rock.bottomArt,
      rock.x,
      rock.bottom,
      rock.width,
      H - rock.bottom,
      "bottom",
      zone
    );

    if (rock.shard && !rock.shardCollected) {
      drawShard(rock.shardX, rock.shardY);
    }
  }
}

function drawObstacleImage(
  image,
  areaX,
  areaY,
  areaWidth,
  areaHeight,
  side,
  zone
) {
  if (areaHeight <= 0) return;

  x.save();

  x.shadowColor = zone.edge;
  x.shadowBlur = 12;

  if (image) {
    /*
      The image is scaled to fit inside its own ceiling/floor area.
      No flip is used. No crop can enter the middle gap.
    */
    const ratio = image.width / image.height;

    let drawWidth = areaWidth;
    let drawHeight = drawWidth / ratio;

    if (drawHeight > areaHeight) {
      drawHeight = areaHeight;
      drawWidth = drawHeight * ratio;
    }

    const drawX = areaX + (areaWidth - drawWidth) / 2;

    const drawY =
      side === "top"
        ? areaY + areaHeight - drawHeight
        : areaY;

    x.drawImage(
      image,
      drawX,
      drawY,
      drawWidth,
      drawHeight
    );
  } else {
    drawFallbackObstacle(
      areaX,
      areaY,
      areaWidth,
      areaHeight,
      side,
      zone
    );
  }

  x.restore();
}

function drawFallbackObstacle(
  areaX,
  areaY,
  areaWidth,
  areaHeight,
  side,
  zone
) {
  x.save();

  const gradient = x.createLinearGradient(
    areaX,
    areaY,
    areaX + areaWidth,
    areaY + areaHeight
  );

  gradient.addColorStop(0, zone.edge);
  gradient.addColorStop(0.25, zone.rock);
  gradient.addColorStop(1, "#080914");

  x.fillStyle = gradient;

  x.beginPath();

  if (side === "top") {
    x.moveTo(areaX, areaY);
    x.lineTo(areaX + areaWidth, areaY);
    x.lineTo(areaX + areaWidth, areaY + areaHeight * 0.88);
    x.lineTo(areaX + areaWidth * 0.68, areaY + areaHeight);
    x.lineTo(areaX + areaWidth * 0.3, areaY + areaHeight * 0.79);
    x.lineTo(areaX, areaY + areaHeight);
  } else {
    x.moveTo(areaX, areaY + areaHeight);
    x.lineTo(areaX + areaWidth, areaY + areaHeight);
    x.lineTo(areaX + areaWidth, areaY + areaHeight * 0.13);
    x.lineTo(areaX + areaWidth * 0.68, areaY);
    x.lineTo(areaX + areaWidth * 0.3, areaY + areaHeight * 0.2);
    x.lineTo(areaX, areaY);
  }

  x.closePath();
  x.fill();

  x.restore();
}

function drawShard(shardX, shardY) {
  const pulse = 1 + Math.sin(seconds * 6 + shardX) * 0.12;

  x.save();

  x.translate(shardX, shardY);
  x.rotate(Math.PI / 4);
  x.scale(pulse, pulse);

  x.fillStyle = "#ffd15c";
  x.shadowColor = "#ff842e";
  x.shadowBlur = 18;

  x.fillRect(-10, -10, 20, 20);

  x.fillStyle = "#fff6bd";
  x.fillRect(-4, -7, 8, 8);

  x.restore();
}

function drawGate(zone) {
  if (!gate) return;

  x.save();

  const gateY = H * 0.5;

  x.strokeStyle = "#ffd15c";
  x.lineWidth = 5;
  x.shadowColor = "#ff9b2f";
  x.shadowBlur = 21;

  x.beginPath();
  x.arc(gate.x, gateY, 42, 0, Math.PI * 2);
  x.stroke();

  x.strokeStyle = zone.particle;
  x.lineWidth = 2;

  x.beginPath();
  x.arc(gate.x, gateY, 28, 0, Math.PI * 2);
  x.stroke();

  x.restore();
}

function drawTrails() {
  for (const trail of trails) {
    const alpha = Math.max(0, trail.life / trail.maxLife);

    x.save();

    x.globalAlpha = alpha * 0.44;
    x.fillStyle = trail.color;
    x.shadowColor = trail.color;
    x.shadowBlur = 14;

    x.beginPath();
    x.arc(
      trail.x,
      trail.y,
      trail.size * alpha,
      0,
      Math.PI * 2
    );

    x.fill();

    x.restore();
  }
}

function drawBird() {
  const phoenix = P[equippedPhoenix];
  const image = art[ASSETS.phoenix[equippedPhoenix]];

  x.save();

  x.translate(bird.x, bird.y);

  const angle = Math.max(
    -0.48,
    Math.min(0.72, bird.velocity / 620)
  );

  x.rotate(angle);

  x.shadowColor = phoenix.shadow;
  x.shadowBlur = 22;

  if (image) {
    const size = 78;

    x.drawImage(
      image,
      -size / 2,
      -size / 2,
      size,
      size
    );
  } else {
    /* Backup shape if an image filename is missing. */
    x.fillStyle = phoenix.color;

    x.beginPath();
    x.moveTo(-30, 3);
    x.quadraticCurveTo(-2, -30, 29, -8);
    x.quadraticCurveTo(39, 4, 18, 18);
    x.quadraticCurveTo(-7, 27, -32, 14);
    x.closePath();
    x.fill();

    x.fillStyle = phoenix.shadow;

    x.beginPath();
    x.moveTo(-17, 13);
    x.lineTo(-42, 29);
    x.lineTo(-21, -2);
    x.closePath();
    x.fill();
  }

  x.restore();

  if (stormShield) {
    x.save();

    x.strokeStyle = "#67e7ff";
    x.lineWidth = 4;
    x.shadowColor = "#36dfff";
    x.shadowBlur = 20;

    x.beginPath();
    x.arc(bird.x, bird.y, 39, 0, Math.PI * 2);
    x.stroke();

    x.restore();
  }

  if (sunfireActive) {
    x.save();

    x.strokeStyle = "#ffd15c";
    x.lineWidth = 5;
    x.shadowColor = "#ff9b2f";
    x.shadowBlur = 25;

    x.beginPath();
    x.arc(bird.x, bird.y, 44, 0, Math.PI * 2);
    x.stroke();

    x.restore();
  }

  if (shieldFlash > 0 || pulseFlash > 0 || sunfireFlash > 0) {
    const flash = Math.max(
      shieldFlash,
      pulseFlash,
      sunfireFlash
    );

    x.save();

    x.globalAlpha = flash;
    x.strokeStyle =
      pulseFlash > 0
        ? "#c879ff"
        : sunfireFlash > 0
          ? "#ffd15c"
          : "#67e7ff";

    x.lineWidth = 6;
    x.shadowColor = x.strokeStyle;
    x.shadowBlur = 26;

    x.beginPath();
    x.arc(bird.x, bird.y, 50, 0, Math.PI * 2);
    x.stroke();

    x.restore();
  }
}

function drawRebirthParticles() {
  for (const particle of rebirthParticles) {
    const alpha = particle.life / particle.maxLife;

    x.save();

    x.globalAlpha = alpha;
    x.fillStyle = particle.color;
    x.shadowColor = particle.color;
    x.shadowBlur = 13;

    x.beginPath();
    x.arc(
      particle.x,
      particle.y,
      particle.size * alpha,
      0,
      Math.PI * 2
    );

    x.fill();

    x.restore();
  }
}

function drawHud(zone) {
  x.save();

  x.fillStyle = "rgba(5,7,16,.68)";
  x.fillRect(0, 0, W, 72);

  x.fillStyle = "#fff";
  x.font = "bold 26px Arial";
  x.textAlign = "left";

  x.fillText(
    `${Math.floor(distance).toLocaleString()} m`,
    17,
    34
  );

  x.fillStyle = "#ffd15c";
  x.font = "bold 15px Arial";

  x.fillText(`✦ ${runShards}`, 18, 57);

  x.textAlign = "right";
  x.fillStyle = zone.edge;
  x.font = "bold 12px Arial";

  x.fillText(zone.name, W - 16, 24);

  x.fillStyle = "#d9e6f2";
  x.font = "12px Arial";

  x.fillText(
    `Best ${best.toLocaleString()} m`,
    W - 16,
    48
  );

  if (checkpointFlash > 0) {
    x.textAlign = "center";
    x.globalAlpha = Math.min(1, checkpointFlash * 1.4);

    x.fillStyle = "#ffd15c";
    x.font = "bold 22px Arial";

    x.fillText(
      `CHECKPOINT ${checkpoint.toLocaleString()} m`,
      W / 2,
      105
    );
  }

  x.restore();
}

updateMenuText();
