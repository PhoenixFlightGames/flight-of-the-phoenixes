<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#080914;
font-family:Arial,sans-serif;
}

canvas{
display:block;
width:100vw;
height:100vh;
touch-action:none;
}

.screen{
position:fixed;
inset:0;
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:28px;
color:#fff;
text-align:center;
background:rgba(8,9,20,.94);
}

.hidden{
display:none!important;
}

h1{
margin:0 0 20px;
color:#ffc65a;
font-size:39px;
line-height:1.12;
text-shadow:0 0 20px #f05224;
}

p{
max-width:365px;
color:#e1dbe5;
font-size:17px;
line-height:1.45;
}

button{
width:min(360px,86vw);
margin:8px 0;
padding:16px;
border:2px solid #ffc65a;
border-radius:14px;
background:#592540;
color:#fff;
font-size:19px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.roost,
.leaderboard-list{
width:min(390px,92vw);
max-height:64vh;
overflow:auto;
}

.shards{
color:#ffd15c;
font-size:22px;
font-weight:bold;
}

.card{
margin:9px 0;
padding:14px;
border:1px solid #744357;
border-radius:12px;
background:#221522;
text-align:left;
}

.card.equipped{
background:#402033;
}

.card button{
width:100%;
margin:10px 0 0;
padding:10px;
font-size:16px;
}

.preview{
display:inline-block;
width:17px;
height:17px;
margin-right:7px;
border-radius:50%;
vertical-align:-3px;
}

.revive-title{
color:#67e7ff;
text-shadow:0 0 20px #36dfff;
}

.revive-button,
.tutorial-button,
.leaderboard-button{
border-color:#67e7ff;
background:#164c68;
}

.end-button,
.tutorial-skip{
border-color:#a87d92;
background:#392333;
}

.ability-button{
position:fixed;
right:18px;
bottom:28px;
z-index:8;
width:112px;
height:112px;
margin:0;
padding:10px;
border:3px solid #c879ff;
border-radius:50%;
background:radial-gradient(circle,#5a267c,#231329);
color:#fff;
font-size:14px;
line-height:1.15;
box-shadow:0 0 24px #9e4bff;
}

.ability-button.solar{
border-color:#ffd15c;
background:radial-gradient(circle,#a95718,#4d2415);
box-shadow:0 0 24px #ffb62f;
}

.tutorial-screen{
z-index:20;
background:rgba(5,8,19,.97);
}

.tutorial-card{
width:min(390px,92vw);
padding:22px 20px;
border:2px solid #67e7ff;
border-radius:18px;
background:linear-gradient(145deg,#152a48,#171329);
box-shadow:0 0 30px rgba(54,223,255,.35);
}

.tutorial-card h1{
margin:0 0 12px;
color:#67e7ff;
font-size:30px;
line-height:1.12;
text-shadow:0 0 18px #36dfff;
}

.tutorial-step{
margin-bottom:15px;
color:#ffd15c;
font-size:14px;
font-weight:bold;
letter-spacing:1px;
}

.tutorial-art{
position:relative;
width:100%;
height:138px;
margin:8px 0 18px;
overflow:hidden;
border:1px solid #42779b;
border-radius:12px;
background:linear-gradient(#15304f,#09111f);
}

.tutorial-bird{
position:absolute;
left:48px;
top:20px;
width:100px;
height:100px;
background-image:var(--ember-phoenix-image);
background-size:contain;
background-position:center;
background-repeat:no-repeat;
filter:drop-shadow(0 0 14px #ff542f);
transform:rotate(-8deg);
}

.tutorial-finger{
position:absolute;
right:46px;
bottom:17px;
padding:10px 13px;
border:2px solid #ffd15c;
border-radius:14px;
background:rgba(55,26,28,.86);
color:#fff;
font-size:14px;
font-weight:bold;
animation:pulse 1s ease-in-out infinite;
}

.tutorial-finger.glide{
border-color:#67e7ff;
background:rgba(15,55,77,.86);
}

.tutorial-shard{
position:absolute;
right:94px;
top:41px;
width:25px;
height:25px;
background:#ffd15c;
box-shadow:0 0 16px #ff7b2f;
transform:rotate(45deg);
}

.tutorial-gate{
position:absolute;
right:66px;
top:28px;
width:58px;
height:86px;
border:5px solid #ffd15c;
border-radius:50%;
box-shadow:0 0 22px #ff9b2f;
}

.tutorial-ability{
position:absolute;
right:30px;
bottom:15px;
width:74px;
height:74px;
padding-top:20px;
border:3px solid #c879ff;
border-radius:50%;
background:#5a267c;
box-shadow:0 0 20px #9e4bff;
color:#fff;
font-size:11px;
font-weight:bold;
text-align:center;
}

.tutorial-tip{
min-height:49px;
margin:0 0 14px;
color:#dcefff;
font-size:16px;
line-height:1.4;
}

.tutorial-next{
border-color:#67e7ff;
background:#164c68;
}

.tutorial-skip{
font-size:16px;
}

.game-tip{
position:fixed;
left:50%;
bottom:142px;
z-index:9;
width:min(340px,84vw);
padding:13px 16px;
border:2px solid #67e7ff;
border-radius:14px;
background:rgba(10,27,46,.94);
box-shadow:0 0 24px rgba(54,223,255,.45);
color:#fff;
font-size:16px;
font-weight:bold;
line-height:1.35;
text-align:center;
transform:translateX(-50%);
pointer-events:none;
}

.game-tip strong{
color:#ffd15c;
}

/* Local leaderboard */

.leaderboard-title{
color:#67e7ff;
text-shadow:0 0 20px #36dfff;
}

.leaderboard-subtitle{
margin:0 0 14px;
color:#b8ddeb;
font-size:15px;
}

.leaderboard-row{
display:grid;
grid-template-columns:38px 1fr auto;
gap:10px;
align-items:center;
margin:8px 0;
padding:12px;
border:1px solid #3f657d;
border-radius:12px;
background:#122032;
text-align:left;
}

.leaderboard-row.first{
border-color:#ffd15c;
background:linear-gradient(135deg,#3d2d18,#201925);
box-shadow:0 0 16px rgba(255,209,92,.22);
}

.leaderboard-rank{
color:#ffd15c;
font-size:20px;
font-weight:bold;
text-align:center;
}

.leaderboard-distance{
color:#fff;
font-size:18px;
font-weight:bold;
}

.leaderboard-detail{
margin-top:4px;
color:#b9c9d7;
font-size:12px;
line-height:1.35;
}

.leaderboard-phoenix{
font-size:13px;
font-weight:bold;
text-align:right;
}

.leaderboard-empty{
padding:20px 10px;
color:#b8ddeb;
font-size:17px;
line-height:1.45;
}

@keyframes pulse{
0%,100%{
transform:translateY(0);
opacity:.78;
}

50%{
transform:translateY(-8px);
opacity:1;
}
}
</style>
</head>

<body>

<canvas id="game" width="420" height="760"></canvas>

<button id="abilityButton" class="ability-button hidden" onclick="useAbility()">
ABILITY
</button>

<div id="gameTip" class="game-tip hidden"></div>

<div id="menu" class="screen">
<h1>FLIGHT OF THE<br>PHOENIXES</h1>

<p>
Hold to rise. Release to glide.<br>
Avoid volcanic rock and collect Ember Shards.
</p>

<button onclick="startGame()">Endless Flight</button>
<button class="tutorial-button" onclick="openTutorial()">How to Play</button>
<button onclick="openRoost()">Phoenix Roost</button>
<button class="leaderboard-button" onclick="openLeaderboard()">Top Flights</button>

<p id="bestText"></p>
</div>

<div id="roost" class="screen hidden">
<h1>PHOENIX ROOST</h1>
<p class="shards" id="roostShards"></p>
<div class="roost" id="phoenixList"></div>
<button onclick="closeRoost()">Back to Flight</button>
</div>

<div id="leaderboardScreen" class="screen hidden">
<h1 class="leaderboard-title">TOP FLIGHTS</h1>

<p class="leaderboard-subtitle">
Your best 10 completed flights on this device.
</p>

<div class="leaderboard-list" id="leaderboardList"></div>

<button onclick="closeLeaderboard()">Back to Flight</button>
</div>

<div id="reviveScreen" class="screen hidden">
<h1 class="revive-title">PHOENIX FALLEN</h1>
<p id="reviveText"></p>
<button class="revive-button" onclick="reviveFlight()">Revive for 15 Shards</button>
<button class="end-button" onclick="endFlight()">End Flight</button>
</div>

<div id="tutorialScreen" class="screen tutorial-screen hidden">
<div class="tutorial-card">
<div class="tutorial-step" id="tutorialStep"></div>
<h1 id="tutorialTitle"></h1>
<div class="tutorial-art" id="tutorialArt"></div>
<p class="tutorial-tip" id="tutorialText"></p>
<button class="tutorial-next" id="tutorialNext" onclick="nextTutorialStep()">Next</button>
<button class="tutorial-skip" onclick="skipTutorial()">Skip Tutorial</button>
</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });

const W = 420;
const H = 760;

canvas.width = W;
canvas.height = H;

const menu = document.getElementById("menu");
const roost = document.getElementById("roost");
const reviveScreen = document.getElementById("reviveScreen");
const tutorialScreen = document.getElementById("tutorialScreen");
const leaderboardScreen = document.getElementById("leaderboardScreen");

const abilityButton = document.getElementById("abilityButton");
const gameTip = document.getElementById("gameTip");

const STORAGE_KEY = "flightOfPhoenixesSaveV2";
const LEADERBOARD_KEY = "flightOfPhoenixesLeaderboardV1";

const imageSources = {
  ember: {
    top: ["IMG_3885.jpeg", "IMG_3886.png"],
    bottom: ["IMG_3887.png", "IMG_3888.png"]
  },

  azure: {
    top: ["IMG_3889.png", "IMG_3890.png"],
    bottom: ["IMG_3891.png", "IMG_3892.png"]
  },

  verdant: {
    top: ["IMG_3895.png", "IMG_3896.png"],
    bottom: ["IMG_3897.png", "IMG_3898.png"]
  },

  phoenixes: {
    ember: "IMG_3899.png",
    azure: "IMG_3902.png",
    verdant: "IMG_3903.png",
    violet: "IMG_3904.png",
    solar: "IMG_3905.png"
  }
};

const phoenixes = [
  {
    id: "ember",
    name: "Ember Phoenix",
    price: 0,
    color: "#ff5936",
    glow: "#ff922b",
    ability: "Flame Shield",
    abilityDescription: "Blocks one collision for 3 seconds.",
    abilityLabel: "FLAME\nSHIELD",
    duration: 180
  },

  {
    id: "azure",
    name: "Azure Phoenix",
    price: 60,
    color: "#4bdcff",
    glow: "#75f2ff",
    ability: "Sky Surge",
    abilityDescription: "Briefly slows the world for 4 seconds.",
    abilityLabel: "SKY\nSURGE",
    duration: 240
  },

  {
    id: "verdant",
    name: "Verdant Phoenix",
    price: 120,
    color: "#5ee984",
    glow: "#adff81",
    ability: "Wildwind",
    abilityDescription: "Pushes nearby obstacles away for 3 seconds.",
    abilityLabel: "WILD\nWIND",
    duration: 180
  },

  {
    id: "violet",
    name: "Violet Phoenix",
    price: 200,
    color: "#c675ff",
    glow: "#f0a9ff",
    ability: "Star Veil",
    abilityDescription: "Makes the Phoenix invulnerable for 3 seconds.",
    abilityLabel: "STAR\nVEIL",
    duration: 180
  },

  {
    id: "solar",
    name: "Solar Phoenix",
    price: 320,
    color: "#ffd35d",
    glow: "#fff1a6",
    ability: "Solar Dash",
    abilityDescription: "Launches forward and earns bonus shards.",
    abilityLabel: "SOLAR\nDASH",
    duration: 80
  }
];

let saveData = loadSave();
let leaderboardData = loadLeaderboard();

let loadedImages = {};
let imagesReady = false;

let gameRunning = false;
let pausedForRevive = false;
let animationFrame = null;

let player;
let obstacles = [];
let particles = [];
let stars = [];
let trails = [];

let distance = 0;
let shardsEarned = 0;
let checkpointDistance = 0;
let worldSpeed = 3.2;
let spawnTimer = 0;
let invincibleFrames = 0;
let shieldFrames = 0;
let slowFrames = 0;
let windFrames = 0;
let dashFrames = 0;
let abilityCooldown = 0;
let usedRevive = false;
let currentZone = "ember";
let newBestThisRun = false;

let holding = false;
let tutorialIndex = 0;

function loadSave() {
  const defaults = {
    shards: 0,
    bestDistance: 0,
    owned: ["ember"],
    equipped: "ember",
    tutorialSeen: false
  };

  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (!stored) return defaults;

    return {
      shards: Number(stored.shards || 0),
      bestDistance: Number(stored.bestDistance || 0),
      owned: Array.isArray(stored.owned) && stored.owned.length
        ? stored.owned
        : ["ember"],
      equipped: stored.equipped || "ember",
      tutorialSeen: Boolean(stored.tutorialSeen)
    };
  } catch {
    return defaults;
  }
}

function saveGame() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
}

function loadLeaderboard() {
  try {
    const stored = JSON.parse(localStorage.getItem(LEADERBOARD_KEY));
    return Array.isArray(stored) ? stored : [];
  } catch {
    return [];
  }
}

function saveLeaderboard() {
  localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboardData));
}

function getPhoenix(id) {
  return phoenixes.find(phoenix => phoenix.id === id) || phoenixes[0];
}

function getZoneForDistance(meters) {
  if (meters < 2000) return "ember";
  if (meters < 4000) return "azure";
  return "verdant";
}

function zoneData(zone) {
  if (zone === "azure") {
    return {
      name: "AZURE PEAKS",
      skyTop: "#163c6c",
      skyBottom: "#091526",
      mist: "#67d9ff",
      ground: "#153453",
      accent: "#8df1ff"
    };
  }

  if (zone === "verdant") {
    return {
      name: "VERDANT WILDS",
      skyTop: "#17452d",
      skyBottom: "#071b15",
      mist: "#70f0a0",
      ground: "#17442f",
      accent: "#b7ff7b"
    };
  }

  return {
    name: "EMBER CAVERNS",
    skyTop: "#5b1f26",
    skyBottom: "#120d19",
    mist: "#ff7b47",
    ground: "#45202a",
    accent: "#ffc15a"
  };
}

function loadImage(src) {
  return new Promise(resolve => {
    const image = new Image();

    image.onload = () => {
      resolve(makeWhiteTransparent(image));
    };

    image.onerror = () => {
      console.warn("Could not load image:", src);
      resolve(null);
    };

    image.src = src;
  });
}

function makeWhiteTransparent(image) {
  const offscreen = document.createElement("canvas");
  const offCtx = offscreen.getContext("2d", { willReadFrequently: true });

  offscreen.width = image.naturalWidth || image.width;
  offscreen.height = image.naturalHeight || image.height;

  offCtx.drawImage(image, 0, 0);

  const imageData = offCtx.getImageData(
    0,
    0,
    offscreen.width,
    offscreen.height
  );

  const pixels = imageData.data;

  for (let i = 0; i < pixels.length; i += 4) {
    const red = pixels[i];
    const green = pixels[i + 1];
    const blue = pixels[i + 2];
    const alpha = pixels[i + 3];

    const brightness = (red + green + blue) / 3;
    const colorDifference =
      Math.max(red, green, blue) - Math.min(red, green, blue);

    const nearlyWhite =
      brightness > 232 &&
      colorDifference < 32;

    const softWhite =
      brightness > 215 &&
      red > 200 &&
      green > 200 &&
      blue > 200 &&
      colorDifference < 22;

    if (alpha > 0 && (nearlyWhite || softWhite)) {
      pixels[i + 3] = 0;
    }
  }

  offCtx.putImageData(imageData, 0, 0);

  return offscreen;
}

async function loadAllImages() {
  const entries = [];

  for (const zone of ["ember", "azure", "verdant"]) {
    for (const side of ["top", "bottom"]) {
      for (const source of imageSources[zone][side]) {
        entries.push([source, source]);
      }
    }
  }

  for (const source of Object.values(imageSources.phoenixes)) {
    entries.push([source, source]);
  }

  const loaded = await Promise.all(
    entries.map(async ([key, source]) => [key, await loadImage(source)])
  );

  loaded.forEach(([key, image]) => {
    loadedImages[key] = image;
  });

  imagesReady = true;
  updateMenuText();

  document.documentElement.style.setProperty(
    "--ember-phoenix-image",
    `url("${imageSources.phoenixes.ember}")`
  );
}

function randomFrom(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function makeStars() {
  stars = [];

  for (let i = 0; i < 85; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.65 + 0.15,
      alpha: Math.random() * 0.65 + 0.2
    });
  }
}

function setupPlayer() {
  const phoenix = getPhoenix(saveData.equipped);

  player = {
    x: 112,
    y: H * 0.48,
    width: 72,
    height: 72,
    velocityY: 0,
    rotation: 0,
    phoenix
  };
}

function resetRun() {
  setupPlayer();
  obstacles = [];
  particles = [];
  trails = [];
  distance = 0;
  shardsEarned = 0;
  checkpointDistance = 0;
  worldSpeed = 3.2;
  spawnTimer = 90;
  invincibleFrames = 0;
  shieldFrames = 0;
  slowFrames = 0;
  windFrames = 0;
  dashFrames = 0;
  abilityCooldown = 0;
  usedRevive = false;
  currentZone = "ember";
  newBestThisRun = false;

  makeStars();
}

function updateMenuText() {
  const imageMessage = imagesReady
    ? ""
    : " Loading artwork…";

  document.getElementById("bestText").innerHTML =
    `Best flight: <strong>${Math.floor(saveData.bestDistance)} m</strong><br>` +
    `Ember Shards: <strong>${saveData.shards}</strong>${imageMessage}`;
}

function showGameTip(html, duration = 3000) {
  gameTip.innerHTML = html;
  gameTip.classList.remove("hidden");

  clearTimeout(showGameTip.timeout);

  showGameTip.timeout = setTimeout(() => {
    gameTip.classList.add("hidden");
  }, duration);
}

function hideGameTip() {
  clearTimeout(showGameTip.timeout);
  gameTip.classList.add("hidden");
}

function startGame() {
  if (!imagesReady) {
    showGameTip("Artwork is still loading. Please wait a moment.");
    return;
  }

  menu.classList.add("hidden");
  roost.classList.add("hidden");
  reviveScreen.classList.add("hidden");
  leaderboardScreen.classList.add("hidden");

  resetRun();
  gameRunning = true;
  pausedForRevive = false;

  abilityButton.textContent = getPhoenix(saveData.equipped).abilityLabel;
  abilityButton.className = "ability-button";

  if (saveData.equipped === "solar") {
    abilityButton.classList.add("solar");
  }

  abilityButton.classList.remove("hidden");

  if (!saveData.tutorialSeen) {
    openTutorial(true);
  } else {
    showGameTip(
      "Hold anywhere to <strong>rise</strong>.<br>Release to <strong>glide</strong>."
    );
  }

  cancelAnimationFrame(animationFrame);
  gameLoop();
}

function stopGame() {
  gameRunning = false;
  pausedForRevive = false;
  holding = false;

  abilityButton.classList.add("hidden");
  hideGameTip();

  cancelAnimationFrame(animationFrame);
}

function gameLoop() {
  updateGame();
  drawGame();

  if (gameRunning) {
    animationFrame = requestAnimationFrame(gameLoop);
  }
}

function updateGame() {
  if (!gameRunning || pausedForRevive) return;

  currentZone = getZoneForDistance(distance);

  const speedMultiplier = slowFrames > 0 ? 0.52 : 1;
  const activeSpeed = worldSpeed * speedMultiplier;

  if (holding) {
    player.velocityY -= 0.48;
  } else {
    player.velocityY += 0.34;
  }

  player.velocityY = Math.max(-7.6, Math.min(8.6, player.velocityY));

  if (dashFrames > 0) {
    player.velocityY *= 0.89;
    player.x = 130;
    dashFrames--;
  } else {
    player.x += (112 - player.x) * 0.12;
  }

  player.y += player.velocityY;
  player.rotation = Math.max(
    -0.48,
    Math.min(0.78, player.velocityY * 0.055)
  );

  if (player.y < 15) {
    player.y = 15;
    player.velocityY = 0;
  }

  if (player.y > H - 96) {
    crash();
  }

  distance += activeSpeed * 0.36;

  if (distance > saveData.bestDistance) {
    saveData.bestDistance = distance;
    newBestThisRun = true;
  }

  const newCheckpoint = Math.floor(distance / 1000) * 1000;

  if (newCheckpoint > checkpointDistance) {
    checkpointDistance = newCheckpoint;
    addParticles(W * 0.5, H * 0.48, "#ffd15c", 34, 4.8);
    showGameTip(
      `<strong>CHECKPOINT:</strong> ${checkpointDistance.toLocaleString()} m`,
      2100
    );
  }

  worldSpeed = Math.min(6.8, 3.2 + distance / 3000);

  spawnTimer--;

  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = Math.max(74, 116 - Math.floor(distance / 180));
  }

  updateStars(activeSpeed);
  updateObstacles(activeSpeed);
  updateParticles();
  updateTrails();

  if (invincibleFrames > 0) invincibleFrames--;
  if (shieldFrames > 0) shieldFrames--;
  if (slowFrames > 0) slowFrames--;
  if (windFrames > 0) windFrames--;
  if (abilityCooldown > 0) abilityCooldown--;

  updateAbilityButton();
}

function updateStars(speed) {
  for (const star of stars) {
    star.x -= star.speed * speed * 0.28;

    if (star.x < -4) {
      star.x = W + 4;
      star.y = Math.random() * H;
    }
  }
}

function updateTrails() {
  trails.push({
    x: player.x - 22,
    y: player.y + 35,
    size: Math.random() * 8 + 7,
    color: player.phoenix.glow,
    life: 20
  });

  if (trails.length > 45) trails.shift();

  for (const trail of trails) {
    trail.x -= 1.25;
    trail.y += (Math.random() - 0.5) * 0.8;
    trail.life--;
  }

  trails = trails.filter(trail => trail.life > 0);
}

function updateParticles() {
  for (const particle of particles) {
    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.vy += particle.gravity;
    particle.life--;
    particle.size *= 0.985;
  }

  particles = particles.filter(particle => particle.life > 0);
}

function addParticles(x, y, color, amount = 12, force = 2.5) {
  for (let i = 0; i < amount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const power = Math.random() * force;

    particles.push({
      x,
      y,
      vx: Math.cos(angle) * power,
      vy: Math.sin(angle) * power,
      gravity: 0.03,
      size: Math.random() * 5 + 2,
      color,
      life: Math.random() * 30 + 22
    });
  }
}

function spawnObstacle() {
  const zone = currentZone;
  const topSource = randomFrom(imageSources[zone].top);
  const bottomSource = randomFrom(imageSources[zone].bottom);

  const gapBase = Math.max(186, 245 - distance / 90);
  const gap = gapBase + Math.random() * 28;
  const topHeight = 86 + Math.random() * (H - 260 - gap);

  obstacles.push({
    x: W + 30,
    width: 104,
    topHeight,
    bottomY: topHeight + gap,
    topImage: loadedImages[topSource],
    bottomImage: loadedImages[bottomSource],
    zone,
    shardTaken: false,
    passed: false,
    pushed: false
  });
}

function updateObstacles(speed) {
  for (const obstacle of obstacles) {
    let obstacleSpeed = speed;

    if (windFrames > 0) {
      obstacleSpeed *= 1.75;
      obstacle.pushed = true;
    }

    obstacle.x -= obstacleSpeed;

    const shardX = obstacle.x + obstacle.width * 0.5;
    const shardY = (obstacle.topHeight + obstacle.bottomY) * 0.5;

    if (!obstacle.shardTaken) {
      const dx = player.x + player.width * 0.5 - shardX;
      const dy = player.y + player.height * 0.5 - shardY;

      if (Math.hypot(dx, dy) < 48) {
        obstacle.shardTaken = true;
        shardsEarned += 1;
        addParticles(shardX, shardY, "#ffd15c", 15, 3.2);
      }
    }

    if (!obstacle.passed && obstacle.x + obstacle.width < player.x) {
      obstacle.passed = true;
      shardsEarned += 1;
      addParticles(
        player.x,
        player.y + 35,
        player.phoenix.glow,
        8,
        1.8
      );
    }

    if (
      invincibleFrames <= 0 &&
      checkObstacleCollision(obstacle)
    ) {
      if (shieldFrames > 0) {
        shieldFrames = 0;
        invincibleFrames = 42;
        obstacle.x -= 25;
        addParticles(
          player.x + 30,
          player.y + 30,
          "#ffd15c",
          32,
          4.8
        );
        showGameTip("<strong>Flame Shield</strong> saved you!", 1500);
      } else {
        crash();
      }
    }
  }

  obstacles = obstacles.filter(obstacle => obstacle.x > -150);
}

function checkObstacleCollision(obstacle) {
  const px = player.x + 15;
  const py = player.y + 15;
  const pw = player.width - 30;
  const ph = player.height - 26;

  const obstacleLeft = obstacle.x + 13;
  const obstacleRight = obstacle.x + obstacle.width - 13;

  const hitTop =
    px + pw > obstacleLeft &&
    px < obstacleRight &&
    py < obstacle.topHeight - 4;

  const hitBottom =
    px + pw > obstacleLeft &&
    px < obstacleRight &&
    py + ph > obstacle.bottomY + 4;

  return hitTop || hitBottom;
}
function drawGame() {
  drawBackground();
  drawStars();
  drawZoneScenery();
  drawObstacles();
  drawTrails();
  drawPlayer();
  drawParticles();
  drawHud();
}

function drawBackground() {
  const zone = zoneData(currentZone);

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, zone.skyTop);
  sky.addColorStop(0.58, zone.skyBottom);
  sky.addColorStop(1, "#050711");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(
    W * 0.68,
    H * 0.27,
    5,
    W * 0.68,
    H * 0.27,
    270
  );

  glow.addColorStop(0, hexToRgba(zone.accent, 0.22));
  glow.addColorStop(0.5, hexToRgba(zone.mist, 0.06));
  glow.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  const bottomGlow = ctx.createLinearGradient(0, H * 0.72, 0, H);
  bottomGlow.addColorStop(0, "rgba(0,0,0,0)");
  bottomGlow.addColorStop(1, hexToRgba(zone.ground, 0.8));

  ctx.fillStyle = bottomGlow;
  ctx.fillRect(0, H * 0.72, W, H * 0.28);
}

function drawStars() {
  for (const star of stars) {
    ctx.save();
    ctx.globalAlpha = star.alpha;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawZoneScenery() {
  const zone = zoneData(currentZone);

  ctx.save();

  for (let i = 0; i < 7; i++) {
    const x = ((i * 89 - distance * 0.16) % (W + 130)) - 60;
    const height = 55 + ((i * 29) % 100);

    ctx.globalAlpha = 0.14;
    ctx.fillStyle = zone.mist;

    ctx.beginPath();
    ctx.moveTo(x, H - 76);
    ctx.lineTo(x + 34, H - 76 - height);
    ctx.lineTo(x + 74, H - 76);
    ctx.closePath();
    ctx.fill();
  }

  ctx.globalAlpha = 0.32;
  ctx.fillStyle = zone.ground;
  ctx.fillRect(0, H - 64, W, 64);

  ctx.globalAlpha = 0.66;
  ctx.strokeStyle = zone.accent;
  ctx.lineWidth = 2;

  for (let i = 0; i < 6; i++) {
    const x = ((i * 104 - distance * 0.42) % (W + 80)) - 30;

    ctx.beginPath();
    ctx.moveTo(x, H - 62);
    ctx.lineTo(x + 24, H - 78);
    ctx.lineTo(x + 52, H - 62);
    ctx.stroke();
  }

  ctx.restore();
}

function drawObstacles() {
  for (const obstacle of obstacles) {
    drawObstaclePart(
      obstacle.topImage,
      obstacle.x,
      0,
      obstacle.width,
      obstacle.topHeight,
      true,
      obstacle.zone
    );

    drawObstaclePart(
      obstacle.bottomImage,
      obstacle.x,
      obstacle.bottomY,
      obstacle.width,
      H - obstacle.bottomY + 30,
      false,
      obstacle.zone
    );

    if (!obstacle.shardTaken) {
      drawShard(
        obstacle.x + obstacle.width * 0.5,
        (obstacle.topHeight + obstacle.bottomY) * 0.5
      );
    }
  }
}

function drawObstaclePart(image, x, y, width, height, upsideDown, zone) {
  const data = zoneData(zone);

  ctx.save();

  ctx.shadowColor = data.accent;
  ctx.shadowBlur = 14;

  if (image) {
    if (upsideDown) {
      ctx.translate(x + width / 2, y + height / 2);
      ctx.scale(1, -1);
      ctx.drawImage(image, -width / 2, -height / 2, width, height);
    } else {
      ctx.drawImage(image, x, y, width, height);
    }
  } else {
    drawFallbackRock(x, y, width, height, upsideDown, zone);
  }

  ctx.restore();
}

function drawFallbackRock(x, y, width, height, upsideDown, zone) {
  const data = zoneData(zone);

  ctx.save();

  if (upsideDown) {
    ctx.translate(x + width / 2, y + height / 2);
    ctx.scale(1, -1);
    x = -width / 2;
    y = -height / 2;
  }

  const rock = ctx.createLinearGradient(x, y, x + width, y + height);
  rock.addColorStop(0, data.accent);
  rock.addColorStop(0.25, data.ground);
  rock.addColorStop(1, "#090810");

  ctx.fillStyle = rock;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + width, y);
  ctx.lineTo(x + width * 0.87, y + height * 0.55);
  ctx.lineTo(x + width * 0.66, y + height);
  ctx.lineTo(x + width * 0.37, y + height * 0.82);
  ctx.lineTo(x, y + height);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawShard(x, y) {
  ctx.save();

  const pulse = 1 + Math.sin(Date.now() * 0.008 + x) * 0.13;

  ctx.translate(x, y);
  ctx.rotate(Math.PI / 4);
  ctx.scale(pulse, pulse);

  ctx.shadowColor = "#ff8e2e";
  ctx.shadowBlur = 19;
  ctx.fillStyle = "#ffd15c";

  ctx.fillRect(-10, -10, 20, 20);

  ctx.fillStyle = "#fff5bd";
  ctx.fillRect(-4, -7, 8, 8);

  ctx.restore();
}

function drawTrails() {
  for (const trail of trails) {
    const alpha = Math.max(0, trail.life / 20);

    ctx.save();
    ctx.globalAlpha = alpha * 0.42;
    ctx.fillStyle = trail.color;
    ctx.shadowColor = trail.color;
    ctx.shadowBlur = 14;

    ctx.beginPath();
    ctx.arc(trail.x, trail.y, trail.size * alpha, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawPlayer() {
  if (!player) return;

  const image = loadedImages[imageSources.phoenixes[player.phoenix.id]];
  const centerX = player.x + player.width / 2;
  const centerY = player.y + player.height / 2;

  ctx.save();

  ctx.translate(centerX, centerY);
  ctx.rotate(player.rotation);

  const flashing =
    invincibleFrames > 0 &&
    Math.floor(invincibleFrames / 5) % 2 === 0;

  if (flashing) {
    ctx.globalAlpha = 0.42;
  }

  ctx.shadowColor = player.phoenix.glow;
  ctx.shadowBlur = 25;

  if (image) {
    ctx.drawImage(
      image,
      -player.width / 2,
      -player.height / 2,
      player.width,
      player.height
    );
  } else {
    drawFallbackPhoenix(player.phoenix);
  }

  ctx.restore();

  if (shieldFrames > 0) {
    ctx.save();

    ctx.strokeStyle = "#ffd15c";
    ctx.lineWidth = 4;
    ctx.shadowColor = "#ff8e2e";
    ctx.shadowBlur = 23;

    ctx.beginPath();
    ctx.arc(centerX, centerY, 46, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  if (invincibleFrames > 0 && shieldFrames <= 0) {
    ctx.save();

    ctx.strokeStyle = player.phoenix.glow;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.7;

    ctx.beginPath();
    ctx.arc(centerX, centerY, 43, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }
}

function drawFallbackPhoenix(phoenix) {
  ctx.save();

  ctx.fillStyle = phoenix.color;
  ctx.beginPath();
  ctx.moveTo(-34, 4);
  ctx.quadraticCurveTo(-2, -38, 31, -10);
  ctx.quadraticCurveTo(46, 2, 22, 18);
  ctx.quadraticCurveTo(-4, 33, -35, 16);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = phoenix.glow;
  ctx.beginPath();
  ctx.moveTo(-20, 14);
  ctx.lineTo(-46, 30);
  ctx.lineTo(-24, -3);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(16, -5, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  for (const particle of particles) {
    const alpha = Math.max(0, particle.life / 52);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = particle.color;
    ctx.shadowColor = particle.color;
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawHud() {
  if (!gameRunning) return;

  const zone = zoneData(currentZone);

  ctx.save();

  ctx.fillStyle = "rgba(4,7,16,.68)";
  ctx.fillRect(0, 0, W, 76);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 27px Arial";
  ctx.textAlign = "left";
  ctx.fillText(`${Math.floor(distance).toLocaleString()} m`, 18, 35);

  ctx.font = "bold 15px Arial";
  ctx.fillStyle = "#ffd15c";
  ctx.fillText(`✦ ${shardsEarned}`, 20, 59);

  ctx.textAlign = "right";
  ctx.fillStyle = zone.accent;
  ctx.font = "bold 13px Arial";
  ctx.fillText(zone.name, W - 17, 26);

  ctx.fillStyle = "#d7e9ff";
  ctx.font = "13px Arial";
  ctx.fillText(
    `Best ${Math.floor(saveData.bestDistance).toLocaleString()} m`,
    W - 17,
    51
  );

  if (abilityCooldown > 0) {
    ctx.textAlign = "center";
    ctx.font = "bold 14px Arial";
    ctx.fillStyle = "#ffffff";

    ctx.fillText(
      `Ability ready in ${Math.ceil(abilityCooldown / 60)}s`,
      W / 2,
      H - 83
    );
  }

  ctx.restore();
}

function hexToRgba(hex, alpha) {
  const value = hex.replace("#", "");

  const r = parseInt(value.substring(0, 2), 16);
  const g = parseInt(value.substring(2, 4), 16);
  const b = parseInt(value.substring(4, 6), 16);

  return `rgba(${r},${g},${b},${alpha})`;
}
function useAbility() {
  if (!gameRunning || pausedForRevive || abilityCooldown > 0) return;

  const phoenix = player.phoenix;

  abilityCooldown = 660;

  if (phoenix.id === "ember") {
    shieldFrames = phoenix.duration;
    addParticles(player.x + 38, player.y + 35, "#ffd15c", 34, 4.2);
    showGameTip("<strong>Flame Shield!</strong><br>One collision is blocked.", 1900);
  }

  if (phoenix.id === "azure") {
    slowFrames = phoenix.duration;
    addParticles(player.x + 38, player.y + 35, "#67e7ff", 30, 3.8);
    showGameTip("<strong>Sky Surge!</strong><br>The world slows down.", 1900);
  }

  if (phoenix.id === "verdant") {
    windFrames = phoenix.duration;

    for (const obstacle of obstacles) {
      if (obstacle.x > player.x - 40 && obstacle.x < W + 80) {
        obstacle.x += 80;
      }
    }

    addParticles(player.x + 38, player.y + 35, "#8cff9d", 34, 4.4);
    showGameTip("<strong>Wildwind!</strong><br>Obstacles are blown away.", 1900);
  }

  if (phoenix.id === "violet") {
    invincibleFrames = phoenix.duration;
    addParticles(player.x + 38, player.y + 35, "#d798ff", 34, 4.2);
    showGameTip("<strong>Star Veil!</strong><br>You are invulnerable.", 1900);
  }

  if (phoenix.id === "solar") {
    dashFrames = phoenix.duration;
    invincibleFrames = phoenix.duration;
    shardsEarned += 4;

    for (const obstacle of obstacles) {
      if (obstacle.x > player.x - 40 && obstacle.x < W + 60) {
        obstacle.x += 116;
      }
    }

    addParticles(player.x + 38, player.y + 35, "#ffd15c", 42, 5);
    showGameTip("<strong>Solar Dash!</strong><br>+4 Ember Shards", 1900);
  }

  updateAbilityButton();
}

function updateAbilityButton() {
  if (!gameRunning) return;

  const phoenix = player.phoenix;

  abilityButton.textContent =
    abilityCooldown > 0
      ? `${Math.ceil(abilityCooldown / 60)}s`
      : phoenix.abilityLabel;

  abilityButton.style.opacity =
    abilityCooldown > 0 ? "0.58" : "1";

  abilityButton.style.transform =
    abilityCooldown > 0 ? "scale(.9)" : "scale(1)";
}

function crash() {
  if (!gameRunning || pausedForRevive || invincibleFrames > 0) return;

  holding = false;

  addParticles(
    player.x + player.width / 2,
    player.y + player.height / 2,
    player.phoenix.glow,
    46,
    5.4
  );

  if (!usedRevive && saveData.shards >= 15 && checkpointDistance > 0) {
    pausedForRevive = true;
    abilityButton.classList.add("hidden");

    document.getElementById("reviveText").innerHTML =
      `You reached <strong>${Math.floor(distance).toLocaleString()} m</strong>.<br>` +
      `Revive at the ${checkpointDistance.toLocaleString()} m checkpoint for 15 Ember Shards?`;

    reviveScreen.classList.remove("hidden");
    return;
  }

  endFlight();
}

function reviveFlight() {
  if (!pausedForRevive || saveData.shards < 15) {
    endFlight();
    return;
  }

  saveData.shards -= 15;
  usedRevive = true;
  distance = checkpointDistance;
  player.y = H * 0.44;
  player.velocityY = -1;
  player.rotation = 0;
  invincibleFrames = 180;
  shieldFrames = 0;
  obstacles = obstacles.filter(obstacle => obstacle.x > player.x + 95);

  if (obstacles.length < 2) {
    spawnTimer = 48;
  }

  pausedForRevive = false;
  reviveScreen.classList.add("hidden");
  abilityButton.classList.remove("hidden");

  addParticles(player.x + 35, player.y + 35, "#67e7ff", 38, 4.7);
  showGameTip(
    `<strong>REVIVED!</strong><br>Checkpoint: ${checkpointDistance.toLocaleString()} m`,
    2200
  );

  saveGame();
  updateMenuText();
}

function endFlight() {
  if (!gameRunning && !pausedForRevive) return;

  const finishedDistance = Math.floor(distance);
  const gainedShards = Math.max(0, Math.floor(shardsEarned));

  saveData.shards += gainedShards;
  saveData.bestDistance = Math.max(saveData.bestDistance, finishedDistance);

  addLeaderboardEntry(
    finishedDistance,
    gainedShards,
    player ? player.phoenix.id : saveData.equipped
  );

  saveGame();
  updateMenuText();

  reviveScreen.classList.add("hidden");

  stopGame();

  menu.classList.remove("hidden");

  document.getElementById("bestText").innerHTML =
    `Flight: <strong>${finishedDistance.toLocaleString()} m</strong><br>` +
    `Shards collected: <strong>+${gainedShards}</strong><br>` +
    `Best flight: <strong>${Math.floor(saveData.bestDistance).toLocaleString()} m</strong><br>` +
    `Ember Shards: <strong>${saveData.shards}</strong>` +
    (newBestThisRun
      ? `<br><span style="color:#ffd15c">New personal best!</span>`
      : "");
}

function addLeaderboardEntry(distanceValue, shardValue, phoenixId) {
  if (distanceValue < 1) return;

  leaderboardData.push({
    distance: distanceValue,
    shards: shardValue,
    phoenix: phoenixId,
    date: new Date().toLocaleDateString()
  });

  leaderboardData.sort((a, b) => b.distance - a.distance);
  leaderboardData = leaderboardData.slice(0, 10);

  saveLeaderboard();
}

function openRoost() {
  menu.classList.add("hidden");
  leaderboardScreen.classList.add("hidden");
  roost.classList.remove("hidden");

  renderRoost();
}

function closeRoost() {
  roost.classList.add("hidden");
  menu.classList.remove("hidden");
  updateMenuText();
}

function renderRoost() {
  const list = document.getElementById("phoenixList");

  document.getElementById("roostShards").textContent =
    `Ember Shards: ${saveData.shards}`;

  list.innerHTML = "";

  for (const phoenix of phoenixes) {
    const owned = saveData.owned.includes(phoenix.id);
    const equipped = saveData.equipped === phoenix.id;

    const card = document.createElement("div");
    card.className = `card${equipped ? " equipped" : ""}`;

    const status = equipped
      ? "Equipped"
      : owned
        ? "Owned"
        : `${phoenix.price} Shards`;

    const action = equipped
      ? "Equipped"
      : owned
        ? "Equip Phoenix"
        : `Unlock for ${phoenix.price}`;

    card.innerHTML = `
      <div>
        <span class="preview" style="background:${phoenix.color};box-shadow:0 0 13px ${phoenix.glow};"></span>
        <strong>${phoenix.name}</strong>
      </div>

      <div style="margin-top:7px;color:#d4dce4;font-size:14px;">
        ${phoenix.ability}: ${phoenix.abilityDescription}
      </div>

      <div style="margin-top:8px;color:${equipped ? "#ffd15c" : "#a8dfff"};font-size:14px;font-weight:bold;">
        ${status}
      </div>

      <button
        ${equipped ? "disabled" : ""}
        onclick="selectPhoenix('${phoenix.id}')"
      >
        ${action}
      </button>
    `;

    list.appendChild(card);
  }
}

function selectPhoenix(id) {
  const phoenix = getPhoenix(id);
  const owned = saveData.owned.includes(id);

  if (!owned) {
    if (saveData.shards < phoenix.price) {
      showGameTip(
        `You need <strong>${phoenix.price - saveData.shards}</strong> more Ember Shards.`,
        2200
      );
      return;
    }

    saveData.shards -= phoenix.price;
    saveData.owned.push(id);
  }

  saveData.equipped = id;
  saveGame();

  renderRoost();
  updateMenuText();
}

function openLeaderboard() {
  menu.classList.add("hidden");
  roost.classList.add("hidden");
  leaderboardScreen.classList.remove("hidden");

  renderLeaderboard();
}

function closeLeaderboard() {
  leaderboardScreen.classList.add("hidden");
  menu.classList.remove("hidden");
}

function renderLeaderboard() {
  const list = document.getElementById("leaderboardList");

  if (!leaderboardData.length) {
    list.innerHTML = `
      <div class="leaderboard-empty">
        No completed flights yet.<br>
        Start an Endless Flight to set your first record.
      </div>
    `;
    return;
  }

  list.innerHTML = "";

  leaderboardData.forEach((entry, index) => {
    const phoenix = getPhoenix(entry.phoenix);
    const row = document.createElement("div");

    row.className =
      `leaderboard-row${index === 0 ? " first" : ""}`;

    row.innerHTML = `
      <div class="leaderboard-rank">#${index + 1}</div>

      <div>
        <div class="leaderboard-distance">
          ${entry.distance.toLocaleString()} m
        </div>

        <div class="leaderboard-detail">
          +${entry.shards} shards · ${entry.date || "Saved flight"}
        </div>
      </div>

      <div class="leaderboard-phoenix" style="color:${phoenix.glow};">
        ${phoenix.name.replace(" Phoenix", "")}
      </div>
    `;

    list.appendChild(row);
  });
}

function openTutorial(fromGame = false) {
  tutorialIndex = 0;
  tutorialScreen.dataset.fromGame = fromGame ? "true" : "false";

  tutorialScreen.classList.remove("hidden");
  renderTutorialStep();
}

function nextTutorialStep() {
  tutorialIndex++;

  if (tutorialIndex >= tutorialSteps.length) {
    finishTutorial();
    return;
  }

  renderTutorialStep();
}

function skipTutorial() {
  finishTutorial();
}

function finishTutorial() {
  saveData.tutorialSeen = true;
  saveGame();

  tutorialScreen.classList.add("hidden");

  if (tutorialScreen.dataset.fromGame === "true") {
    showGameTip(
      "Hold to <strong>rise</strong>. Release to <strong>glide</strong>.",
      3200
    );
  } else {
    menu.classList.remove("hidden");
  }
}

const tutorialSteps = [
  {
    title: "FLY",
    text: "Hold anywhere on the screen to rise. Release your finger to glide downward.",
    art: `
      <div class="tutorial-bird"></div>
      <div class="tutorial-finger">HOLD</div>
    `
  },

  {
    title: "COLLECT",
    text: "Fly through the center gaps. Touch glowing Ember Shards to collect them.",
    art: `
      <div class="tutorial-bird" style="top:26px;left:44px;"></div>
      <div class="tutorial-shard"></div>
    `
  },

  {
    title: "CHECKPOINTS",
    text: "Every 1,000 meters is a checkpoint. After a crash, revive with Ember Shards.",
    art: `
      <div class="tutorial-bird" style="top:30px;left:52px;"></div>
      <div class="tutorial-gate"></div>
    `
  },

  {
    title: "PHOENIX POWERS",
    text: "Tap your Phoenix ability button when the trail gets dangerous. Each Phoenix has a unique power.",
    art: `
      <div class="tutorial-bird" style="top:24px;left:40px;"></div>
      <div class="tutorial-ability">ABILITY</div>
    `
  }
];

function renderTutorialStep() {
  const step = tutorialSteps[tutorialIndex];

  document.getElementById("tutorialStep").textContent =
    `STEP ${tutorialIndex + 1} OF ${tutorialSteps.length}`;

  document.getElementById("tutorialTitle").textContent = step.title;
  document.getElementById("tutorialText").textContent = step.text;
  document.getElementById("tutorialArt").innerHTML = step.art;

  document.getElementById("tutorialNext").textContent =
    tutorialIndex === tutorialSteps.length - 1
      ? "Start Flying"
      : "Next";
}

function beginHold(event) {
  if (!gameRunning || pausedForRevive) return;

  if (event && event.target === abilityButton) return;

  holding = true;

  if (event && canvas.setPointerCapture) {
    try {
      canvas.setPointerCapture(event.pointerId);
    } catch {}
  }
}

function endHold() {
  holding = false;
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  beginHold(event);
});

canvas.addEventListener("pointerup", event => {
  event.preventDefault();
  endHold();
});

canvas.addEventListener("pointercancel", endHold);
canvas.addEventListener("pointerleave", endHold);

window.addEventListener("pointerup", endHold);

abilityButton.addEventListener("pointerdown", event => {
  event.stopPropagation();
});

window.addEventListener("keydown", event => {
  if (event.code === "Space" || event.code === "ArrowUp") {
    event.preventDefault();
    holding = true;
  }

  if (event.code === "KeyE") {
    useAbility();
  }
});

window.addEventListener("keyup", event => {
  if (event.code === "Space" || event.code === "ArrowUp") {
    holding = false;
  }
});

window.addEventListener("blur", () => {
  holding = false;
});

loadAllImages();
updateMenuText();
function showStartupScreen() {
  menu.classList.remove("hidden");
  roost.classList.add("hidden");
  reviveScreen.classList.add("hidden");
  tutorialScreen.classList.add("hidden");
  leaderboardScreen.classList.add("hidden");

  abilityButton.classList.add("hidden");
  gameTip.classList.add("hidden");

  updateMenuText();
}

window.addEventListener("load", () => {
  showStartupScreen();

  setTimeout(() => {
    if (!imagesReady) {
      updateMenuText();
    }
  }, 1000);
});

showStartupScreen();
</script>

</body>
</html>
