<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080914;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

#menu {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 28px;
  color: white;
  background: rgba(8, 9, 20, .93);
}

h1 {
  margin: 0 0 25px;
  color: #ffc65a;
  font-size: 40px;
  line-height: 1.15;
  text-shadow: 0 0 20px #f05224;
}

p {
  max-width: 360px;
  font-size: 19px;
  line-height: 1.45;
  color: #e1dbe5;
}

button {
  width: min(360px, 86vw);
  margin: 22px 0 12px;
  padding: 18px;
  border: 2px solid #ffc65a;
  border-radius: 14px;
  background: #592540;
  color: white;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>
<canvas id="game" width="420" height="760"></canvas>

<div id="menu">
  <h1>FLIGHT OF THE<br>PHOENIXES</h1>
  <p>Hold the screen to rise. Release to glide.<br>Avoid the obstacles and fly as far as you can.</p>
  <button onclick="startGame()">Endless Flight</button>
  <p id="bestText">Best: 0 m</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const bestText = document.getElementById("bestText");
const phoenixImage = new Image();
let phoenixSprite = null;

phoenixImage.onload = function() {
  const spriteCanvas = document.createElement("canvas");
  spriteCanvas.width = phoenixImage.naturalWidth;
  spriteCanvas.height = phoenixImage.naturalHeight;

  const spriteCtx = spriteCanvas.getContext("2d");
  spriteCtx.drawImage(phoenixImage, 0, 0);

  const pixels = spriteCtx.getImageData(
    0,
    0,
    spriteCanvas.width,
    spriteCanvas.height
  );

  for (let i = 0; i < pixels.data.length; i += 4) {
    const red = pixels.data[i];
    const green = pixels.data[i + 1];
    const blue = pixels.data[i + 2];

    const isNearWhite =
      red > 215 &&
      green > 215 &&
      blue > 215 &&
      Math.max(red, green, blue) - Math.min(red, green, blue) < 28;

    if (isNearWhite) {
      pixels.data[i + 3] = 0;
    }
  }

  spriteCtx.putImageData(pixels, 0, 0);
  phoenixSprite = spriteCanvas;
};

phoenixImage.src = "IMG_3821.jpeg";


let playing = false;
let holding = false;
let bird;
let obstacles;
let distance;
let seconds;
let lastTime;

let best = Number(localStorage.getItem("phoenixBest")) || 0;
bestText.textContent = "Best: " + best.toLocaleString() + " m";

function startGame() {
  playing = true;
  holding = false;

  bird = {
    x: 95,
    y: 380,
    velocity: 0,
    radius: 25
  };

  obstacles = [];
  distance = 0;
  seconds = 0;
  lastTime = performance.now();

  menu.style.display = "none";
  requestAnimationFrame(gameLoop);
}

canvas.addEventListener("touchstart", function(event) {
  event.preventDefault();
  if (playing) holding = true;
}, { passive: false });

canvas.addEventListener("touchend", function(event) {
  event.preventDefault();
  holding = false;
}, { passive: false });

canvas.addEventListener("touchcancel", function() {
  holding = false;
});

canvas.addEventListener("mousedown", function() {
  if (playing) holding = true;
});

window.addEventListener("mouseup", function() {
  holding = false;
});

function addObstacle() {
  const gap = 220;
  const middle = 160 + Math.random() * 440;

  obstacles.push({
    x: 440,
    width: 55,
    top: middle - gap / 2,
    bottom: middle + gap / 2
  });
}

function gameOver() {
  if (!playing) return;

  playing = false;
  best = Math.max(best, Math.floor(distance));
  localStorage.setItem("phoenixBest", best);

  bestText.innerHTML =
    "Flight ended at <b>" + Math.floor(distance).toLocaleString() +
    " m</b><br>Best: " + best.toLocaleString() + " m";

  menu.style.display = "flex";
}

function gameLoop(now) {
  if (!playing) return;

  const dt = Math.min(0.03, (now - lastTime) / 1000);
  lastTime = now;

  seconds += dt;

  bird.velocity += (holding ? -720 : 920) * dt;
  bird.velocity = Math.max(-360, Math.min(420, bird.velocity));
  bird.y += bird.velocity * dt;

  distance += 52 * dt;

  if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 235) {
    addObstacle();
  }

  for (const obstacle of obstacles) {
    obstacle.x -= 155 * dt;

    const hitSide =
      bird.x + bird.radius > obstacle.x &&
      bird.x - bird.radius < obstacle.x + obstacle.width;

    const hitObstacle =
      bird.y - bird.radius < obstacle.top ||
      bird.y + bird.radius > obstacle.bottom;

    if (hitSide && hitObstacle) {
      gameOver();
    }
  }

  obstacles = obstacles.filter(obstacle => obstacle.x > -70);

  if (bird.y - bird.radius < 0 || bird.y + bird.radius > 760) {
    gameOver();
  }

  drawGame();
  requestAnimationFrame(gameLoop);
}

function drawGame() {
  const sky = ctx.createLinearGradient(0, 0, 0, 760);
  sky.addColorStop(0, "#2b102d");
  sky.addColorStop(1, "#080914");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 420, 760);

  for (const obstacle of obstacles) {
    ctx.fillStyle = "#2c1820";
    ctx.fillRect(obstacle.x, 0, obstacle.width, obstacle.top);
    ctx.fillRect(
      obstacle.x,
      obstacle.bottom,
      obstacle.width,
      760 - obstacle.bottom
    );

    ctx.strokeStyle = "#ff8c36";
    ctx.lineWidth = 3;
    ctx.strokeRect(obstacle.x, 0, obstacle.width, obstacle.top);
    ctx.strokeRect(
      obstacle.x,
      obstacle.bottom,
      obstacle.width,
      760 - obstacle.bottom
    );
  }

   ctx.save();
  ctx.translate(bird.x, bird.y);

  const tilt = Math.max(-0.38, Math.min(0.58, bird.velocity / 650));
  ctx.rotate(tilt);

  ctx.shadowBlur = 18;
  ctx.shadowColor = "#ff542f";

  if (phoenixSprite) {

    ctx.drawImage(phoenixSprite, -52, -52, 104, 104);

  } else {
    ctx.fillStyle = "#ff842f";
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.quadraticCurveTo(-4, -27, 24, -8);
    ctx.quadraticCurveTo(32, 0, 24, 8);
    ctx.quadraticCurveTo(-4, 27, -25, 0);
    ctx.fill();
  }

  ctx.restore();


  ctx.fillStyle = "white";
  ctx.font = "bold 20px Arial";
  ctx.fillText(Math.floor(distance).toLocaleString() + " m", 16, 32);

  ctx.font = "16px Arial";
  ctx.fillText(seconds.toFixed(1) + " s", 16, 56);

  ctx.textAlign = "right";
  ctx.fillText("ASHLANDS", 402, 32);
  ctx.textAlign = "left";
}
</script>
</body>
</html>
