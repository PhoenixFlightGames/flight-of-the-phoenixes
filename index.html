<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080914;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;color:#fff;text-align:center;background:rgba(8,9,20,.94)}
.hidden{display:none!important}
h1{margin:0 0 22px;color:#ffc65a;font-size:40px;line-height:1.15;text-shadow:0 0 20px #f05224}
p{max-width:360px;color:#e1dbe5;font-size:18px;line-height:1.45}
button{width:min(360px,86vw);margin:8px 0;padding:16px;border:2px solid #ffc65a;border-radius:14px;background:#592540;color:#fff;font-size:20px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.98)}
.roost{width:min(390px,92vw);max-height:64vh;overflow-y:auto;padding:2px 3px 10px}
.shards{margin-top:-4px;color:#ffd15c;font-size:22px;font-weight:bold}
.card{margin:9px 0;padding:14px 15px;border:1px solid #744357;border-radius:12px;background:#221522;text-align:left}
.card.equipped{background:#402033}
.card strong{font-size:18px}
.card button{width:100%;margin:10px 0 0;padding:10px;font-size:16px}
.preview{display:inline-block;width:17px;height:17px;margin-right:7px;border-radius:50%;vertical-align:-3px}
@keyframes unlockPop{
0%{opacity:0;transform:translate(-50%,-45%) scale(.75)}
15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
30%{transform:translate(-50%,-50%) scale(1)}
80%{opacity:1}
100%{opacity:0;transform:translate(-50%,-55%) scale(.96)}
}
</style>
</head>
<body>

<canvas id="game" width="420" height="760"></canvas>

<div id="menu" class="screen">
<h1>FLIGHT OF THE<br>PHOENIXES</h1>
<p>Hold the screen to rise. Release to glide.<br>Avoid volcanic rock and collect Ember Shards.</p>
<button onclick="startGame()">Endless Flight</button>
<button onclick="openRoost()">Phoenix Roost</button>
<p id="bestText">Best: 0 m</p>
</div>

<div id="roost" class="screen hidden">
<h1>PHOENIX ROOST</h1>
<p class="shards" id="roostShards"></p>
<div class="roost" id="phoenixList"></div>
<button onclick="closeRoost()">Back to Flight</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const menu=document.getElementById("menu");
const roost=document.getElementById("roost");
const bestText=document.getElementById("bestText");
const roostShards=document.getElementById("roostShards");
const phoenixList=document.getElementById("phoenixList");

const W=420,H=760;

const PHOENIXES={
ember:{name:"Ember Phoenix",subtitle:"Starter Phoenix — orange flame",color:"#ff8a35",shadow:"#ff542f",cost:0,filter:""},
azure:{name:"Azure Phoenix",subtitle:"Stormborn feathers and cyan flame",color:"#67e7ff",shadow:"#36dfff",cost:25,filter:"hue-rotate(145deg) saturate(1.8) brightness(1.2)"},
verdant:{name:"Verdant Phoenix",subtitle:"Wildfire plumage and emerald flame",color:"#62f58c",shadow:"#56f58a",cost:50,filter:"hue-rotate(78deg) saturate(1.9) brightness(1.18)"}
};

let playing=false,holding=false;
let bird,obstacles,embers,trails;
let distance=0,seconds=0,level=0,runShards=0,lastTime=0;

let best=Number(localStorage.getItem("phoenixBest"))||0;
let totalShards=Number(localStorage.getItem("phoenixShards"))||0;
let azureUnlocked=localStorage.getItem("azureUnlocked")==="true";
let verdantUnlocked=localStorage.getItem("verdantUnlocked")==="true";
let equippedPhoenix=localStorage.getItem("equippedPhoenix")||"ember";

if(equippedPhoenix==="azure"&&!azureUnlocked)equippedPhoenix="ember";
if(equippedPhoenix==="verdant"&&!verdantUnlocked)equippedPhoenix="ember";

bestText.textContent="Best: "+best.toLocaleString()+" m";

const phoenixImage=new Image();
let phoenixSprite=null;

phoenixImage.onload=function(){
const spriteCanvas=document.createElement("canvas");
spriteCanvas.width=phoenixImage.naturalWidth;
spriteCanvas.height=phoenixImage.naturalHeight;

const spriteCtx=spriteCanvas.getContext("2d");
spriteCtx.drawImage(phoenixImage,0,0);

const pixels=spriteCtx.getImageData(0,0,spriteCanvas.width,spriteCanvas.height);

for(let i=0;i<pixels.data.length;i+=4){
const r=pixels.data[i];
const g=pixels.data[i+1];
const b=pixels.data[i+2];

const white=
r>215&&g>215&&b>215&&
Math.max(r,g,b)-Math.min(r,g,b)<28;

if(white)pixels.data[i+3]=0;
}

spriteCtx.putImageData(pixels,0,0);
phoenixSprite=spriteCanvas;
};

phoenixImage.src="IMG_3821.jpeg";

function savePhoenixProgress(){
localStorage.setItem("phoenixShards",totalShards);
localStorage.setItem("azureUnlocked",azureUnlocked);
localStorage.setItem("verdantUnlocked",verdantUnlocked);
localStorage.setItem("equippedPhoenix",equippedPhoenix);
}

function isUnlocked(key){
return key==="ember"||
(key==="azure"&&azureUnlocked)||
(key==="verdant"&&verdantUnlocked);
}

function setUnlocked(key){
if(key==="azure")azureUnlocked=true;
if(key==="verdant")verdantUnlocked=true;
}

function preview(color){
return `<span class="preview" style="background:${color};box-shadow:0 0 12px ${color}"></span>`;
}

function openRoost(){
renderRoost();
menu.classList.add("hidden");
roost.classList.remove("hidden");
}

function closeRoost(){
roost.classList.add("hidden");
menu.classList.remove("hidden");
}

function phoenixCard(key){
const phoenix=PHOENIXES[key];
const unlocked=isUnlocked(key);
const equipped=equippedPhoenix===key;

if(!unlocked){
return `
<div class="card" style="border-color:${phoenix.color}">
<strong style="color:${phoenix.color}">
${preview(phoenix.color)}${phoenix.name}
</strong><br>
${phoenix.subtitle}
<button onclick="unlockPhoenix('${key}')" style="border-color:${phoenix.color};background:#17394d">
Unlock for ${phoenix.cost} Shards
</button>
</div>`;
}

return `
<div class="card ${equipped?"equipped":""}" style="border-color:${equipped?phoenix.color:"#744357"}">
<strong style="color:${phoenix.color}">
${preview(phoenix.color)}${phoenix.name}
</strong><br>
${phoenix.subtitle}<br>
${equipped?"Equipped":"Unlocked"}
${equipped?"":`<button onclick="equipPhoenix('${key}')" style="border-color:${phoenix.color};background:#17394d">Equip ${phoenix.name}</button>`}
</div>`;
}

function renderRoost(){
roostShards.textContent="Ember Shards: "+totalShards;

phoenixList.innerHTML=`
${phoenixCard("ember")}
${phoenixCard("azure")}
${phoenixCard("verdant")}

<div class="card">
<strong style="color:#cb79ff">${preview("#cb79ff")}Violet Phoenix</strong><br>
Arcane flame — 100 shards
</div>

<div class="card">
<strong style="color:#ffd65c">${preview("#ffd65c")}Solar Phoenix</strong><br>
Sunfire wings — 175 shards
</div>

<div class="card">
<strong style="color:#8a8795">${preview("#8a8795")}Obsidian Phoenix</strong><br>
Ancient ash — 300 shards
</div>`;
}

function unlockPhoenix(key){
const phoenix=PHOENIXES[key];
if(!phoenix||key==="ember")return;

if(totalShards<phoenix.cost){
alert("You need "+phoenix.cost+" Ember Shards to unlock "+phoenix.name+".");
return;
}

totalShards-=phoenix.cost;
setUnlocked(key);
equippedPhoenix=key;
savePhoenixProgress();
renderRoost();
showUnlockCelebration(phoenix.name,phoenix.color);
}

function equipPhoenix(key){
if(!isUnlocked(key))return;
equippedPhoenix=key;
savePhoenixProgress();
renderRoost();
}

function showUnlockCelebration(name,color){
const message=document.createElement("div");

message.innerHTML=`
<div style="font-size:40px;margin-bottom:10px">✦</div>
<div>${name} Unlocked!</div>
<div style="font-size:16px;margin-top:8px;color:#f4f1fa">
Now equipped for your next flight.
</div>`;

message.style.cssText=`
position:fixed;z-index:30;left:50%;top:50%;
width:min(330px,82vw);padding:25px 18px;
border:2px solid ${color};border-radius:18px;
background:rgba(12,15,30,.96);color:${color};
box-shadow:0 0 35px ${color};text-align:center;
font-size:25px;font-weight:bold;
animation:unlockPop 2.2s ease forwards;`;

document.body.appendChild(message);
setTimeout(()=>message.remove(),2300);
}

function makeEmbers(){
const particles=[];

for(let i=0;i<42;i++){
particles.push({
x:Math.random()*W,
y:Math.random()*H,
size:1+Math.random()*2.5,
speed:14+Math.random()*32,
drift:Math.random()*Math.PI*2,
glow:Math.random()>.45
});
}

return particles;
}

function startGame(){
playing=true;
holding=false;

bird={x:95,y:380,velocity:0,radius:25};
obstacles=[];
embers=makeEmbers();
trails=[];

distance=0;
seconds=0;
level=0;
runShards=0;
lastTime=performance.now();

addObstacle(720);

menu.classList.add("hidden");
requestAnimationFrame(gameLoop);
}

canvas.addEventListener("touchstart",event=>{
event.preventDefault();
if(playing)holding=true;
},{passive:false});

canvas.addEventListener("touchend",event=>{
event.preventDefault();
holding=false;
},{passive:false});

canvas.addEventListener("touchcancel",()=>holding=false);

canvas.addEventListener("mousedown",()=>{
if(playing)holding=true;
});

window.addEventListener("mouseup",()=>holding=false);

function addObstacle(spawnX=660){
const gap=220-level*8;
const min=gap/2+42;
const max=H-gap/2-42;
const middle=min+Math.random()*(max-min);

const top=middle-gap/2;
const bottom=middle+gap/2;
const shard=Math.random()<.35;

const topTeeth=[];
const bottomTeeth=[];

for(let i=0;i<=5;i++){
topTeeth.push(5+Math.random()*20);
bottomTeeth.push(5+Math.random()*20);
}

obstacles.push({
x:spawnX,
width:62,
top:top,
bottom:bottom,
shard:shard,
shardY:top+42+Math.random()*(gap-84),
shardCollected:false,
topTeeth:topTeeth,
bottomTeeth:bottomTeeth
});
}

function updateEmbers(dt){
for(const ember of embers){
ember.x-=ember.speed*dt;
ember.y+=Math.sin(seconds*2+ember.drift)*12*dt;

if(ember.x<-8){
ember.x=W+8;
ember.y=Math.random()*H;
}
}
}

function updateTrails(dt){
const color=PHOENIXES[equippedPhoenix].color;

trails.push({
x:bird.x-32,
y:bird.y+(Math.random()-.5)*18,
size:7+Math.random()*9,
life:.82,
maxLife:.82,
vx:-240-Math.random()*160,
vy:(Math.random()-.5)*45,
color:color
});

trails=trails.filter(trail=>{
trail.life-=dt;
trail.x+=trail.vx*dt;
trail.y+=trail.vy*dt;
trail.vy+=12*dt;
return trail.life>0&&trail.x>-70;
});
}

function gameOver(){
if(!playing)return;

playing=false;
best=Math.max(best,Math.floor(distance));
totalShards+=runShards;

localStorage.setItem("phoenixBest",best);
savePhoenixProgress();

bestText.innerHTML=`
Flight ended at <b>${Math.floor(distance).toLocaleString()} m</b><br>
Ember Shards: <b>${runShards}</b><br>
Total Shards: ${totalShards}<br>
Best: ${best.toLocaleString()} m`;

menu.classList.remove("hidden");
}

function gameLoop(now){
if(!playing)return;

const dt=Math.min(.03,(now-lastTime)/1000);
lastTime=now;

seconds+=dt;
distance+=52*dt;
level=Math.min(3,Math.floor(distance/500));

bird.velocity+=(holding?-720:920)*dt;
bird.velocity=Math.max(-360,Math.min(420,bird.velocity));
bird.y+=bird.velocity*dt;

updateEmbers(dt);
updateTrails(dt);

if(obstacles.length===0){
addObstacle(660);
}else if(obstacles[obstacles.length-1].x<340){
addObstacle(660);
}

const obstacleSpeed=155+level*10;

for(const obstacle of obstacles){
obstacle.x-=obstacleSpeed*dt;

const hitSide=
bird.x+bird.radius>obstacle.x&&
bird.x-bird.radius<obstacle.x+obstacle.width;

const hitObstacle=
bird.y-bird.radius<obstacle.top||
bird.y+bird.radius>obstacle.bottom;

if(hitSide&&hitObstacle){
gameOver();
return;
}

if(obstacle.shard&&!obstacle.shardCollected){
const shardX=obstacle.x+obstacle.width/2;
const dx=bird.x-shardX;
const dy=bird.y-obstacle.shardY;

if(dx*dx+dy*dy<(bird.radius+14)*(bird.radius+14)){
obstacle.shardCollected=true;
runShards++;
}
}
}

obstacles=obstacles.filter(obstacle=>obstacle.x>-80);

if(bird.y-bird.radius<0||bird.y+bird.radius>H){
gameOver();
return;
}

drawGame();
requestAnimationFrame(gameLoop);
}

function drawMountainLayer(color,baseY,peakHeight,spacing,speed){
const offset=(distance*speed)%spacing;

ctx.fillStyle=color;
ctx.beginPath();
ctx.moveTo(-spacing-offset,H);

for(let x=-spacing-offset;x<W+spacing;x+=spacing){
ctx.lineTo(x,baseY);
ctx.lineTo(x+spacing/2,baseY-peakHeight);
ctx.lineTo(x+spacing,baseY);
}

ctx.lineTo(W+spacing,H);
ctx.closePath();
ctx.fill();
}

function drawTrails(){
for(const trail of trails){
const opacity=trail.life/trail.maxLife;
const stretch=1+(1-opacity)*2.5;

ctx.save();
ctx.globalAlpha=opacity*.82;
ctx.translate(trail.x,trail.y);
ctx.scale(stretch,1);
ctx.shadowBlur=18;
ctx.shadowColor=trail.color;
ctx.fillStyle=trail.color;

ctx.beginPath();
ctx.arc(0,0,trail.size*opacity,0,Math.PI*2);
ctx.fill();

ctx.restore();
}
}

function drawRock(obstacle){
const step=obstacle.width/5;

ctx.fillStyle="#251821";
ctx.strokeStyle="#ff8035";
ctx.lineWidth=2.5;

ctx.beginPath();
ctx.moveTo(obstacle.x,0);
ctx.lineTo(obstacle.x+obstacle.width,0);

for(let i=5;i>=0;i--){
const x=obstacle.x+i*step;
const y=obstacle.top-obstacle.topTeeth[i];
ctx.lineTo(x,y);
}

ctx.lineTo(obstacle.x,0);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(obstacle.x,obstacle.bottom);

for(let i=0;i<=5;i++){
const x=obstacle.x+i*step;
const y=obstacle.bottom+obstacle.bottomTeeth[i];
ctx.lineTo(x,y);
}

ctx.lineTo(obstacle.x+obstacle.width,H);
ctx.lineTo(obstacle.x,H);
ctx.lineTo(obstacle.x,obstacle.bottom);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.strokeStyle="#713027";
ctx.lineWidth=1.5;
ctx.globalAlpha=.8;

for(let i=1;i<5;i++){
const x=obstacle.x+i*step;
const topEnd=obstacle.top-obstacle.topTeeth[i]-18;
const bottomEnd=obstacle.bottom+obstacle.bottomTeeth[i]+18;

ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x-7,topEnd);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x,H);
ctx.lineTo(x+7,bottomEnd);
ctx.stroke();
}

ctx.globalAlpha=1;
}

function drawShard(obstacle){
ctx.save();
ctx.translate(obstacle.x+obstacle.width/2,obstacle.shardY);
ctx.rotate(seconds*2);
ctx.shadowBlur=14;
ctx.shadowColor="#ff7b2f";
ctx.fillStyle="#ffd15c";

ctx.beginPath();
ctx.moveTo(0,-11);
ctx.lineTo(8,0);
ctx.lineTo(0,11);
ctx.lineTo(-8,0);
ctx.closePath();
ctx.fill();

ctx.restore();
}

function drawPhoenix(){
const flap=(Math.sin(seconds*18)+1)/2;
const phoenix=PHOENIXES[equippedPhoenix];

ctx.save();
ctx.translate(bird.x,bird.y-flap*3);
ctx.rotate(Math.max(-.38,Math.min(.58,bird.velocity/650)));
ctx.scale(1.02-flap*.06,.94+flap*.12);
ctx.filter=phoenix.filter;
ctx.shadowBlur=18+flap*8;
ctx.shadowColor=phoenix.shadow;

if(phoenixSprite){
ctx.drawImage(phoenixSprite,-52,-52,104,104);
}else{
ctx.fillStyle=phoenix.color;
ctx.beginPath();
ctx.arc(0,0,25,0,Math.PI*2);
ctx.fill();
}

ctx.restore();
}

function drawGame(){
const sky=ctx.createLinearGradient(0,0,0,H);
sky.addColorStop(0,"#35122f");
sky.addColorStop(.48,"#1a1022");
sky.addColorStop(1,"#080914");

ctx.fillStyle=sky;
ctx.fillRect(0,0,W,H);

drawMountainLayer("#1d1422",575,92,180,.08);
drawMountainLayer("#281522",640,125,145,.16);
drawMountainLayer("#351821",705,110,112,.26);

for(const ember of embers){
ctx.globalAlpha=.55;
ctx.fillStyle=ember.glow?"#ffb04d":"#ed542d";
ctx.beginPath();
ctx.arc(ember.x,ember.y,ember.size,0,Math.PI*2);
ctx.fill();
}

ctx.globalAlpha=1;
drawTrails();

for(const obstacle of obstacles){
drawRock(obstacle);
if(obstacle.shard&&!obstacle.shardCollected)drawShard(obstacle);
}

drawPhoenix();

const phoenix=PHOENIXES[equippedPhoenix];

ctx.fillStyle="#fff";
ctx.font="bold 20px Arial";
ctx.fillText(Math.floor(distance).toLocaleString()+" m",16,32);

ctx.fillStyle="#ffd15c";
ctx.font="bold 15px Arial";
ctx.fillText("SHARDS: "+runShards,16,57);

ctx.textAlign="right";
ctx.fillStyle=phoenix.color;
ctx.fillText(
equippedPhoenix.toUpperCase()+" · LEVEL "+(level+1),
402,
32
);
ctx.textAlign="left";
}
</script>
</body>
</html>
