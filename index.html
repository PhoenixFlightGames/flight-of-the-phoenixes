<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flight of the Phoenixes</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080914;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

.screen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px;
  text-align: center;
  color: #fff;
  background: rgba(8, 9, 20, .94);
}

.hidden {
  display: none !important;
}

h1 {
  margin: 0 0 22px;
  color: #ffc65a;
  font-size: 40px;
  line-height: 1.15;
  text-shadow: 0 0 20px #f05224;
}

p {
  max-width: 360px;
  color: #e1dbe5;
  font-size: 18px;
  line-height: 1.45;
}

button {
  width: min(360px, 86vw);
  margin: 8px 0;
  padding: 16px;
  border: 2px solid #ffc65a;
  border-radius: 14px;
  background: #592540;
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.roost {
  width: min(390px, 92vw);
  max-height: 64vh;
  overflow: auto;
}

.shards {
  color: #ffd15c;
  font-size: 22px;
  font-weight: bold;
}

.card {
  margin: 9px 0;
  padding: 14px 15px;
  border: 1px solid #744357;
  border-radius: 12px;
  background: #221522;
  text-align: left;
}

.equipped {
  background: #402033;
}

.card button {
  width: 100%;
  margin: 10px 0 0;
  padding: 10px;
  font-size: 16px;
}

.preview {
  display: inline-block;
  width: 17px;
  height: 17px;
  margin-right: 7px;
  border-radius: 50%;
  vertical-align: -3px;
}

@keyframes pop {
  0% {
    opacity: 0;
    transform: translate(-50%, -45%) scale(.75);
  }

  15% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.06);
  }

  80% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -55%) scale(.96);
  }
}
</style>
</head>

<body>
<canvas id="game" width="420" height="760"></canvas>

<div id="menu" class="screen">
  <h1>FLIGHT OF THE<br>PHOENIXES</h1>

  <p>
    Hold the screen to rise. Release to glide.<br>
    Avoid volcanic rock and collect Ember Shards.
  </p>

  <button onclick="startGame()">Endless Flight</button>
  <button onclick="openRoost()">Phoenix Roost</button>

  <p id="bestText"></p>
</div>

<div id="roost" class="screen hidden">
  <h1>PHOENIX ROOST</h1>
  <p class="shards" id="roostShards"></p>
  <div class="roost" id="phoenixList"></div>
  <button onclick="closeRoost()">Back to Flight</button>
</div>

<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

const menu = document.getElementById("menu");
const roost = document.getElementById("roost");
const bestText = document.getElementById("bestText");
const roostShards = document.getElementById("roostShards");
const phoenixList = document.getElementById("phoenixList");

const W = 420;
const H = 760;

const CHECKPOINT = 1000;
const CLEAR_START = 220;

const P = {
  ember: {
    name: "Ember Phoenix",
    sub: "Starter Phoenix — orange flame",
    color: "#ff8a35",
    shadow: "#ff542f",
    cost: 0,
    filter: ""
  },

  azure: {
    name: "Azure Phoenix",
    sub: "Stormborn feathers and cyan flame",
    color: "#67e7ff",
    shadow: "#36dfff",
    cost: 25,
    filter: "hue-rotate(145deg) saturate(1.8) brightness(1.2)"
  },

  verdant: {
    name: "Verdant Phoenix",
    sub: "Wildfire plumage and emerald flame",
    color: "#62f58c",
    shadow: "#56f58a",
    cost: 50,
    filter: "hue-rotate(78deg) saturate(1.9) brightness(1.18)"
  }
};

let playing = false;
let holding = false;

let bird;
let rocks;
let embers;
let trails;
let gate;

let distance = 0;
let seconds = 0;
let level = 0;
let run = 0;
let last = 0;

let checkpoint = 0;
let flash = 0;

let best = Number(localStorage.getItem("phoenixBest")) || 0;
let total = Number(localStorage.getItem("phoenixShards")) || 0;

let high =
  Number(localStorage.getItem("phoenixHighestCheckpoint")) || 0;

let azure = localStorage.getItem("azureUnlocked") === "true";
let verdant = localStorage.getItem("verdantUnlocked") === "true";

let equipped =
  localStorage.getItem("equippedPhoenix") || "ember";

if (
  equipped === "azure" &&
  !azure
) {
  equipped = "ember";
}

if (
  equipped === "verdant" &&
  !verdant
) {
  equipped = "ember";
}

function menuText() {
  bestText.innerHTML = `
    Best: ${best.toLocaleString()} m<br>
    Highest checkpoint: ${
      high
        ? high.toLocaleString() + " m"
        : "Not reached"
    }
  `;
}

menuText();

const img = new Image();
let sprite = null;

img.onload = function() {
  const spriteCanvas = document.createElement("canvas");
  spriteCanvas.width = img.naturalWidth;
  spriteCanvas.height = img.naturalHeight;

  const spriteCtx = spriteCanvas.getContext("2d");
  spriteCtx.drawImage(img, 0, 0);

  const pixels = spriteCtx.getImageData(
    0,
    0,
    spriteCanvas.width,
    spriteCanvas.height
  );

  for (let i = 0; i < pixels.data.length; i += 4) {
    const r = pixels.data[i];
    const g = pixels.data[i + 1];
    const b = pixels.data[i + 2];

    const white =
      r > 215 &&
      g > 215 &&
      b > 215 &&
      Math.max(r, g, b) - Math.min(r, g, b) < 28;

    if (white) {
      pixels.data[i + 3] = 0;
    }
  }

  spriteCtx.putImageData(pixels, 0, 0);
  sprite = spriteCanvas;
};

img.src = "IMG_3821.jpeg";

function save() {
  localStorage.setItem("phoenixBest", best);
  localStorage.setItem("phoenixShards", total);
  localStorage.setItem("phoenixHighestCheckpoint", high);
  localStorage.setItem("azureUnlocked", azure);
  localStorage.setItem("verdantUnlocked", verdant);
  localStorage.setItem("equippedPhoenix", equipped);
}

function unlocked(key) {
  return (
    key === "ember" ||
    (key === "azure" && azure) ||
    (key === "verdant" && verdant)
  );
}

function dot(color) {
  return `
    <span
      class="preview"
      style="background:${color};box-shadow:0 0 12px ${color}"
    ></span>
  `;
}

function openRoost() {
  render();
  menu.classList.add("hidden");
  roost.classList.remove("hidden");
}

function closeRoost() {
  roost.classList.add("hidden");
  menu.classList.remove("hidden");
}

function card(key) {
  const phoenix = P[key];
  const active = equipped === key;

  if (!unlocked(key)) {
    return `
      <div class="card">
        <strong style="color:${phoenix.color}">
          ${dot(phoenix.color)}${phoenix.name}
        </strong><br>
        ${phoenix.sub}

        <button onclick="unlockPhoenix('${key}')">
          Unlock for ${phoenix.cost} Shards
        </button>
      </div>
    `;
  }

  return `
    <div class="card ${active ? "equipped" : ""}">
      <strong style="color:${phoenix.color}">
        ${dot(phoenix.color)}${phoenix.name}
      </strong><br>

      ${phoenix.sub}<br>
      ${active ? "Equipped" : "Unlocked"}

      ${
        active
          ? ""
          : `
            <button onclick="equipPhoenix('${key}')">
              Equip ${phoenix.name}
            </button>
          `
      }
    </div>
  `;
}

function render() {
  roostShards.textContent =
    "Ember Shards: " + total;

  phoenixList.innerHTML = `
    ${card("ember")}
    ${card("azure")}
    ${card("verdant")}

    <div class="card">
      <strong>Violet Phoenix</strong><br>
      Arcane flame — 100 shards
    </div>

    <div class="card">
      <strong>Solar Phoenix</strong><br>
      Sunfire wings — 175 shards
    </div>
  `;
}

function unlockPhoenix(key) {
  const phoenix = P[key];

  if (total < phoenix.cost) {
    alert(
      "You need " +
      phoenix.cost +
      " Ember Shards."
    );
    return;
  }

  total -= phoenix.cost;

  if (key === "azure") {
    azure = true;
  }

  if (key === "verdant") {
    verdant = true;
  }

  equipped = key;
  save();
  render();
}

function equipPhoenix(key) {
  if (!unlocked(key)) {
    return;
  }

  equipped = key;
  save();
  render();
}

function makeEmbers() {
  return Array.from(
    { length: 42 },
    function() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        s: 1 + Math.random() * 2,
        speed: 15 + Math.random() * 30,
        d: Math.random() * 7
      };
    }
  );
}

function startGame() {
  playing = true;
  holding = false;

  bird = {
    x: 95,
    y: 380,
    v: 0,
    r: 25
  };

  rocks = [];
  embers = makeEmbers();
  trails = [];
  gate = null;

  distance = 0;
  seconds = 0;
  level = 0;
  run = 0;
  checkpoint = 0;
  flash = 0;

  last = performance.now();

  addRock(720);

  menu.classList.add("hidden");
  requestAnimationFrame(loop);
}

c.addEventListener("touchstart", function(event) {
  event.preventDefault();

  if (playing) {
    holding = true;
  }
}, { passive: false });

c.addEventListener("touchend", function(event) {
  event.preventDefault();
  holding = false;
}, { passive: false });

c.addEventListener("touchcancel", function() {
  holding = false;
});

c.addEventListener("mousedown", function() {
  holding = playing;
});

window.addEventListener("mouseup", function() {
  holding = false;
});

function addRock(start = 660) {
  const gap = 220 - level * 8;

  const middle =
    gap / 2 +
    45 +
    Math.random() * (H - gap - 90);

  const width = 118;
  const top = middle - gap / 2;
  const bottom = middle + gap / 2;

  const face = Array.from(
    { length: 7 },
    function(_, i) {
      return {
        dx: i * width / 6,
        t: top - 8 - Math.random() * 28,
        b: bottom + 8 + Math.random() * 28
      };
    }
  );

  rocks.push({
    x: start,
    w: width,
    top: top,
    bottom: bottom,
    face: face,
    shard: Math.random() < .35,
    sy: top + 42 + Math.random() * (gap - 84),
    got: false
  });
}

function makeGate() {
  gate = {
    x: 470,
    y: H / 2,
    r: 68,
    v: checkpoint + CHECKPOINT,
    p: 0
  };
}

function finishGate() {
  checkpoint = gate.v;
  run += 1;
  flash = 2.6;

  if (checkpoint > high) {
    high = checkpoint;
    save();
  }

  gate = null;
  addRock(760);
}

function end() {
  if (!playing) {
    return;
  }

  playing = false;

  best = Math.max(
    best,
    Math.floor(distance)
  );

  total += run;

  save();
  menuText();

  menu.classList.remove("hidden");
}

function loop(now) {
  if (!playing) {
    return;
  }

  const dt = Math.min(
    .03,
    (now - last) / 1000
  );

  last = now;
  seconds += dt;
  distance += 52 * dt;

  level = Math.min(
    3,
    Math.floor(distance / 500)
  );

  flash = Math.max(0, flash - dt);

  const nextCheckpoint =
    checkpoint + CHECKPOINT;

  const calm =
    distance >= nextCheckpoint - CLEAR_START;

  bird.v += (holding ? -720 : 920) * dt;
  bird.v = Math.max(
    -360,
    Math.min(420, bird.v)
  );

  bird.y += bird.v * dt;

  for (const ember of embers) {
    ember.x -= ember.speed * dt;

    if (ember.x < 0) {
      ember.x = W;
      ember.y = Math.random() * H;
    }
  }

  const trailColor = P[equipped].color;

  trails.push({
    x: bird.x - 32,
    y: bird.y + (Math.random() - .5) * 16,
    s: 8,
    life: .7,
    color: trailColor
  });

  trails = trails.filter(function(trail) {
    trail.life -= dt;
    trail.x -= 330 * dt;

    return trail.life > 0;
  });

  if (
    !calm &&
    !gate &&
    (
      !rocks.length ||
      rocks[rocks.length - 1].x < 340
    )
  ) {
    addRock();
  }

  const speed = 155 + level * 10;

  for (const rock of rocks) {
    rock.x -= speed * dt;

    const sideHit =
      bird.x + bird.r > rock.x &&
      bird.x - bird.r < rock.x + rock.w;

    const rockHit =
      bird.y - bird.r < rock.top ||
      bird.y + bird.r > rock.bottom;

    if (sideHit && rockHit) {
      end();
      return;
    }

    if (rock.shard && !rock.got) {
      const dx =
        bird.x - rock.x - rock.w / 2;

      const dy =
        bird.y - rock.sy;

      if (
        dx * dx + dy * dy <
        (bird.r + 14) * (bird.r + 14)
      ) {
        rock.got = true;
        run += 1;
      }
    }
  }

  rocks = rocks.filter(function(rock) {
    return rock.x > -150;
  });

  if (
    calm &&
    !gate &&
    rocks.length === 0
  ) {
    makeGate();
  }

  if (gate) {
    gate.x -= speed * dt;
    gate.p += dt;

    if (gate.x < bird.x) {
      finishGate();
    }
  }

  if (
    bird.y - bird.r < 0 ||
    bird.y + bird.r > H
  ) {
    end();
    return;
  }

  draw();
  requestAnimationFrame(loop);
}

function drawRock(rock) {
  x.fillStyle = "#241820";
  x.strokeStyle = "#ff8035";
  x.lineWidth = 3;

  x.beginPath();
  x.moveTo(rock.x, 0);
  x.lineTo(rock.x + rock.w, 0);

  for (let i = 6; i >= 0; i--) {
    x.lineTo(
      rock.x + rock.face[i].dx,
      rock.face[i].t
    );
  }

  x.closePath();
  x.fill();
  x.stroke();

  x.beginPath();
  x.moveTo(rock.x, H);
  x.lineTo(rock.x + rock.w, H);

  for (let i = 6; i >= 0; i--) {
    x.lineTo(
      rock.x + rock.face[i].dx,
      rock.face[i].b
    );
  }

  x.closePath();
  x.fill();
  x.stroke();
}

function drawGate() {
  if (!gate) {
    return;
  }

  const phoenix = P[equipped];

  x.save();

  x.translate(gate.x, gate.y);

  const pulse =
    1 + Math.sin(gate.p * 8) * .08;

  x.scale(pulse, pulse);

  x.strokeStyle = "#ffd15c";
  x.shadowBlur = 25;
  x.shadowColor = phoenix.color;
  x.lineWidth = 5;

  x.beginPath();
  x.ellipse(
    0,
    0,
    38,
    68,
    0,
    0,
    Math.PI * 2
  );

  x.stroke();
  x.restore();
}

function drawPhoenix() {
  const phoenix = P[equipped];

  x.save();

  x.translate(bird.x, bird.y);
  x.filter = phoenix.filter;
  x.shadowBlur = 20;
  x.shadowColor = phoenix.shadow;

  if (sprite) {
    x.drawImage(
      sprite,
      -52,
      -52,
      104,
      104
    );
  }

  x.restore();
}

function draw() {
  const sky = x.createLinearGradient(
    0,
    0,
    0,
    H
  );

  sky.addColorStop(0, "#35122f");
  sky.addColorStop(1, "#080914");

  x.fillStyle = sky;
  x.fillRect(0, 0, W, H);

  for (const trail of trails) {
    const alpha = trail.life / .7;

    x.globalAlpha = alpha;
    x.fillStyle = trail.color;

    x.beginPath();
    x.arc(
      trail.x,
      trail.y,
      trail.s * alpha,
      0,
      Math.PI * 2
    );

    x.fill();
  }

  x.globalAlpha = 1;

  for (const rock of rocks) {
    drawRock(rock);

    if (rock.shard && !rock.got) {
      x.fillStyle = "#ffd15c";

      x.beginPath();
      x.arc(
        rock.x + rock.w / 2,
        rock.sy,
        8,
        0,
        Math.PI * 2
      );

      x.fill();
    }
  }

  drawGate();
  drawPhoenix();

  x.fillStyle = "#fff";
  x.font = "bold 20px Arial";
  x.fillText(
    Math.floor(distance).toLocaleString() + " m",
    16,
    32
  );

  x.fillStyle = "#ffd15c";
  x.font = "bold 15px Arial";
  x.fillText(
    "SHARDS: " + run,
    16,
    57
  );

  if (flash > 0) {
    x.textAlign = "center";
    x.fillStyle = "#ffd15c";
    x.font = "bold 24px Arial";

    x.fillText(
      "CHECKPOINT " + checkpoint + " m",
      W / 2,
      118
    );

    x.font = "bold 16px Arial";

    x.fillText(
      "+1 EMBER SHARD",
      W / 2,
      145
    );

    x.textAlign = "left";
  }
}
</script>
</body>
</html>
